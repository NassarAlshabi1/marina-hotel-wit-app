# .gitleaks.toml
# تكوين Gitleaks لكشف الأسرار المُسربة
# الوثائق: https://github.com/gitleaks/gitleaks

title = "Marina Hotel Gitleaks Config"

[extend]
# استخدام القواعد الافتراضية + قواعد مخصصة
useDefault = true

# ═══════════════════════════════════════════════════════════════
#  Global allowlist — ملفات/مسارات لا تُفحص
# ═══════════════════════════════════════════════════════════════
[allowlist]
description = "Global allowlist"
paths = [
  '''node_modules/''',
  '''.dart_tool/''',
  '''build/''',
  '''.git/''',
  '''.*\.lock''',
  '''package-lock\.json''',
  '''pubspec\.lock''',
  # google-services.json يحتوي Google API key عام (safe by design)
  # Firebase Android config يجب أن يُcommitted للمستودع
  '''google-services\.json''',
  # ملفات الاختبارات قد تحتوي tokens وهمية
  '''test/.*''',
  '''.*_test\.dart''',
  # ملفات الأمثلة
  '''example/.*''',
  # README قد يحتوي placeholders
  '''README.*''',
  '''CHANGELOG.*''',
]

# أنماط ليست أسراراً (placeholders معروفة)
regexes = [
  '''your_.*_here''',
  '''xxx+''',
  '''placeholder''',
  '''example''',
  '''test.*token''',
  '''sample''',
  '''dummy''',
  # Appwrite API key is intentionally embedded in the app (configurable by users at runtime
  # via Settings → Appwrite Connection). It's a project-level key, not a personal secret.
  # See: mobile/lib/services/appwrite_config.dart and secondary_appwrite_config.dart
  '''standard_c0ab6ac2628715c7714eb312e2272a55ae41809dcc156c7e4553874e4a6ad9f3d3e9169d8a69b84f7d746b108905041e412a66ec66d03e122ccb056484c43d2a27f7839088bf60385ab58061624bbcc1f82271c09d608536e68d9cc0ff1b05b83ae4fe14c4dc4ce38840317ea555155f1733141450b3097df09a2a1b4b154a6c''',
  # Static XOR obfuscation secret — not cryptographic, used only for trivial obfuscation of
  # app_settings synced across devices. See mobile/lib/utils/secure_storage.dart
  '''marina_hotel_sync_secret_2024''',
  # Android signing keystore password — keystore file is committed but password is project-level
  # (not a personal secret). The keystore signs release APKs for the Marina Hotel app.
  '''Marina2025SecureKey''',
]

# ═══════════════════════════════════════════════════════════════
#  Custom rules — قواعد إضافية لمشروع Marina Hotel
# ═══════════════════════════════════════════════════════════════

[[rules]]
id = "marina-appwrite-api-key"
description = "Appwrite API Key"
regex = '''standard_[a-zA-Z0-9]{40,}'''
tags = ["appwrite", "api-key"]

[[rules]]
id = "marina-firebase-server-key"
description = "Firebase Server Key (Legacy)"
regex = '''AAAA[a-zA-Z0-9_\\-]{35}[a-zA-Z0-9_\\-]+'''
tags = ["firebase", "fcm"]

[[rules]]
id = "marina-firebase-private-key"
description = "Firebase Private Key"
regex = '''private_key.*-----BEGIN [A-Z ]*PRIVATE KEY-----'''
tags = ["firebase", "private-key"]

[[rules]]
id = "marina-telegram-bot-token"
description = "Telegram Bot Token"
regex = '''[0-9]{8,10}:AA[a-zA-Z0-9_\\-]{30,}'''
tags = ["telegram", "bot"]

[[rules]]
id = "marina-whatsapp-api-key"
description = "WhatsApp/CallMeBot API Key"
regex = '''whatsapp.*api.*key.*['"][a-zA-Z0-9]{20,}['"]'''
tags = ["whatsapp", "api-key"]

[[rules]]
id = "marina-google-service-account"
description = "Google Service Account JSON"
regex = '''"type":\s*"service_account"'''
tags = ["google", "service-account"]

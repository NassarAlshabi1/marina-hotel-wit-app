# Marina Hotel - Kotlin + Jetpack Compose Conversion
# Schema version: 70 (mirrors Drift schema)
# Package: com.marina.marina

# JVM memory tuned for 4GB local machines and 16GB CI runners alike.
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

kotlin.code.style=official
kapt.incremental.apt=false
kotlin.compiler.execution.strategy=in-process
android.suppressUnsupportedCompileSdk=35

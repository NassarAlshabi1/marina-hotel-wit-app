pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "marina_hotel_mobile"
include ':app'

// Opt-in keeps normal release/unit-test builds independent of benchmark tooling.
if (providers.gradleProperty('enableMacrobenchmark').isPresent()) {
    include ':macrobenchmark'
}

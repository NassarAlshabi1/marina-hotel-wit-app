plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "kotlin-kapt"
    id "kotlin-parcelize"
    id "dagger.hilt.android.plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

kapt {
    correctErrorTypes true
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
        arg("room.exportSchema", "true")
        arg("dagger.hilt.disableCrossCompilationRootValidation", "true")
    }
}

android {
    // namespace MUST equal applicationId (com.a.a) — the Flutter original had
    // namespace == applicationId and never hit AAPT resource-linking issues.
    // Keeping them identical removes the resource-package ambiguity entirely.
    // Kotlin class packages intentionally remain com.marina.marina; only the
    // generated R/BuildConfig packages follow the namespace.
    namespace "com.a.a"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
        // Global opt-ins for the experimental Compose APIs used across the
        // ported screens (Material3 top bars/tabs, Foundation combined input).
        freeCompilerArgs += [
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                "-opt-in=androidx.compose.material.ExperimentalMaterialApi",
                "-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi"
        ]
    }

    defaultConfig {
        // Install package identity — user requested short name com.a.a.
        applicationId "com.a.a"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        // Size optimization: keep only the locales the app actually ships
        // (Arabic UI + English fallbacks); strips every other resource set.
        resourceConfigurations += ["ar", "en"]

        manifestPlaceholders = [
            appName: "Marina Hotel",
            appDescription: "Complete Hotel Management System",
            posthogToken: localProperties.getProperty("POSTHOG_API_KEY", System.getenv("POSTHOG_API_KEY") ?: ""),
            workerUrl: localProperties.getProperty("CLOUDFLARE_WORKER_URL", "https://marina-hotel-api.adenmarina2.workers.dev"),
            cfUsername: localProperties.getProperty("CLOUDFLARE_USERNAME", "admin"),
            cfPassword: localProperties.getProperty("CLOUDFLARE_PASSWORD", "admin")
        ]
    }

    signingConfigs {
        unified {
            if (keystoreProperties['keyAlias'] != null) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
            // Maximum installation compatibility: some OEM package installers
            // (MIUI/EMUI and older devices) reject APKs that lack a v1 JAR
            // signature, while Android 11+ requires v2+. Signing with all
            // schemes guarantees the APK installs everywhere.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.unified
        }

        release {
            // CI builds a diagnostic non-minified release via
            // `./gradlew assembleRelease -PmarinaNoMinify` — used to A/B-test
            // R8-stripping crashes on real devices (compare with mapping.txt).
            def noMinify = project.hasProperty('marinaNoMinify')
            minifyEnabled !noMinify
            shrinkResources !noMinify
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.unified
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.11"
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1',
                         'META-INF/DEPENDENCIES', 'META-INF/NOTICE*',
                         'META-INF/*.kotlin_module', 'kotlin/**',
                         'DebugProbesKt.bin', 'META-INF/com.android.tools/r8/**']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    // AndroidX
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.fragment:fragment-ktx:1.8.2"
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"

    // Jetpack Compose
    implementation "androidx.compose.ui:ui:1.7.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.0"
    implementation "androidx.compose.ui:ui-tooling:1.7.0"
    implementation "androidx.compose.material3:material3:1.3.0"
    implementation "androidx.compose.material:material:1.7.0"
    implementation "androidx.compose.runtime:runtime:1.7.0"
    implementation "androidx.compose.runtime:runtime-livedata:1.7.0"
    implementation "androidx.compose.foundation:foundation:1.7.0"
    implementation "androidx.compose.foundation:foundation-layout:1.7.0"
    implementation "androidx.compose.material:material-icons-extended:1.7.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.7.0"

    // Navigation Compose
    implementation "androidx.navigation:navigation-compose:2.8.0"

    // Room
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"

    // Hilt DI
    implementation "com.google.dagger:hilt-android:2.52"
    kapt "com.google.dagger:hilt-compiler:2.52"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Retrofit + OkHttp + Gson
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // Coil for image loading
    implementation "io.coil-kt:coil-compose:2.7.0"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.1.0"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Security
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Gson
    implementation "com.google.code.gson:gson:2.11.0"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:33.4.0")
    implementation "com.google.firebase:firebase-analytics-ktx"
    implementation "com.google.firebase:firebase-crashlytics-ktx"
    implementation "com.google.firebase:firebase-messaging-ktx"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    testImplementation "app.cash.turbine:turbine:1.1.0"
    // Robolectric launch smoke test — launches the real MainActivity (real
    // Hilt graph, Room, Compose composition) on the JVM inside CI so a
    // launch crash surfaces with its true production stack trace.
    testImplementation "org.robolectric:robolectric:4.13"
    testImplementation "androidx.test:core-ktx:1.6.1"
    testImplementation "androidx.test.ext:junit-ktx:1.2.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.7.0"
    debugImplementation "androidx.test:orchestrator:1.5.1"
}


# Marina Hotel Mobile - Code Quality Configuration
# ====================================================
# F4DD Central Configuration for Code Quality Tools
# F4BB Maintainer: Marina Hotel Dev Team
# F4D1 Last Updated: 2026-08-04
#
# F4D1 Usage:
#   This file contains configuration for all code quality tools
#   Used by: generate_reports.sh, CI/CD workflows, local development

# ============================================
# GLOBAL CONFIGURATION
# ============================================

global:
  # Project information
  project_name: "Marina Hotel Mobile"
  project_version: "1.2.0+3"
  flutter_version: "3.35.7"
  dart_version: "3.8.0"
  
  # Quality thresholds
  thresholds:
    # Code quality score (0-100)
    quality_score: 80
    
    # Test pass rate (%)
    test_pass_rate: 80
    
    # Code coverage (%)
    code_coverage: 80
    
    # Cyclomatic complexity (max)
    max_complexity: 20
    
    # Lines of code per file (max)
    max_lines_per_file: 500
    
    # Functions per file (max)
    max_functions_per_file: 20
    
    # Parameters per function (max)
    max_parameters: 4
    
    # Nesting depth (max)
    max_nesting: 5

# ============================================
# STATIC ANALYSIS CONFIGURATION
# ============================================

static_analysis:
  enabled: true
  
  # Analysis options
  options:
    - "--fatal-infos"
    - "--fatal-warnings"
    - "."
  
  # Files to exclude
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "**/build/**"
    - "test/**"
    - "integration_test/**"
  
  # Severity levels
  severity:
    error:
      - "missing_return"
      - "missing_required_param"
      - "undefined_class"
      - "undefined_identifier"
      - "undefined_method"
      - "argument_type_not_assignable"
      - "return_of_invalid_type"
      - "incompatible_return_value_type"
      - "null_aware_before_operator"
      - "null_check_on_nullable"
    
    warning:
      - "unused_local_variable"
      - "unused_parameter"
      - "unused_field"
      - "dead_code"
      - "unnecessary_cast"
      - "unnecessary_null_check"

# ============================================
# LINTING CONFIGURATION
# ============================================

linting:
  enabled: true
  
  # Lint rules file
  rules_file: "analysis_options.yaml"
  
  # Custom rules
  custom_rules:
    # Style rules
    style:
      always_declare_return_types: true
      always_put_control_body_on_new_line: true
      always_put_required_named_parameters_first: true
      always_specify_types: true
      annotate_overrides: true
      avoid_bool_literals_in_conditional_expressions: true
      avoid_catches_without_on_clauses: true
      avoid_dynamic_calls: true
      avoid_empty_else: true
      avoid_final_parameters: false  # Temporarily disabled
      avoid_function_literals_in_foreach_calls: true
      avoid_init_to_null: true
      avoid_null_checks_in_equality_operators: true
      avoid_positional_boolean_parameters: true
      avoid_print: false  # Use logger instead
      avoid_redundant_argument_values: true
      avoid_relative_lib_imports: true
      avoid_returning_null: true
      avoid_returning_null_for_future: true
      avoid_returning_this: true
      avoid_shadowing_type_parameters: true
      avoid_single_cascade_in_expression_statements: true
      avoid_types_on_closure_parameters: true
      avoid_unnecessary_containers: true
      avoid_unused_constructor_parameters: true
      avoid_void_async: true
      camel_case_extensions: true
      camel_case_types: true
      cascade_invocations: true
      close_sinks: true
      comment_references: true
      constant_identifier_names: true
      control_flow_in_finally: true
      curly_braces_in_flow_control_structures: true
      directives_ordering: true
      empty_catches: true
      empty_constructor_bodies: true
      empty_statements: true
      eol_at_end_of_file: true
      exhaustive_cases: true
      file_names: true
      hash_and_equals: true
      implementation_imports: true
      join_return_with_assignment: true
      leading_newlines_in_multiline_strings: true
      library_annotations: true
      library_names: true
      library_prefixes: true
      lines_longer_than_80_chars: true
      literal_only_boolean_expressions: true
      missing_whitespace: true
      no_adjacent_strings_in_list: true
      no_default_cases: true
      no_duplicate_case_values: true
      no_leading_underscores_for_library_prefixes: true
      no_leading_underscores_for_local_identifiers: true
      no_logic_in_create_state: true
      no_runtimeType_toString: true
      no_wildcard_variable_uses: true
      non_constant_identifier_names: true
      null_checks: true
      null_closures: true
      omit_local_variable_types: false
      one_member_abstracts: true
      only_throw_errors: true
      overridden_fields: true
      package_api_docs: true
      package_names: true
      package_prefixed_library_names: true
      parameter_assignments: true
      prefer_adjacent_string_concatenation: true
      prefer_asserts_in_initializer_lists: true
      prefer_asserts_with_message: true
      prefer_collection_literals: true
      prefer_conditional_assignment: true
      prefer_const_constructors: true
      prefer_const_constructors_in_immutables: true
      prefer_const_declarations: true
      prefer_const_literals_to_create_immutables: true
      prefer_constructors_over_static_methods: true
      prefer_contains: true
      prefer_equal_for_default_values: true
      prefer_expression_function_bodies: true
      prefer_final_fields: true
      prefer_final_in_for_each: true
      prefer_final_locals: true
      prefer_for_elements_to_map_fromIterable: true
      prefer_generic_function_type_aliases: true
      prefer_if_elements_to_conditional_expressions: true
      prefer_if_null_operators: true
      prefer_inlined_adds: true
      prefer_int_literals: true
      prefer_is_empty: true
      prefer_is_not_empty: true
      prefer_iterable_whereType: true
      prefer_null_aware_method_calls: true
      prefer_null_aware_operators: true
      prefer_relative_imports: true
      prefer_single_quotes: true
      prefer_spread_collections: true
      prefer_typing_uninitialized_variables: true
      prefer_void_to_null: true
      provide_deprecation_message: true
      public_member_api_docs: true
      require_trailing_commas: true
      secure_pubspec_urls: true
      sized_box_for_whitespace: true
      sized_box_shrink_expand: true
      slash_for_doc_comments: true
      sort_child_properties_last: true
      sort_constructors_first: true
      sort_unnamed_constructors_first: true
      super_goes_last: true
      test_types_in_equals: true
      throw_in_finally: true
      type_annotate_public_api: true
      type_init_formals: true
      unawaited_futures: true
      unnecessary_await_in_return: true
      unnecessary_brace_in_string_interps: true
      unnecessary_const: true
      unnecessary_final: true
      unnecessary_getters_setters: true
      unnecessary_lambdas: true
      unnecessary_late: true
      unnecessary_new: true
      unnecessary_null_aware_assignments: true
      unnecessary_null_checks: true
      unnecessary_nullable_for_final_variable_declarations: true
      unnecessary_overrides: true
      unnecessary_parenthesis: true
      unnecessary_raw_strings: true
      unnecessary_statements: true
      unnecessary_string_escapes: true
      unnecessary_string_interpolations: true
      unnecessary_this: true
      unnecessary_underscores: true
      use_build_context_synchronously: true
      use_colored_box: true
      use_decorated_box: true
      use_enums: true
      use_full_hex_values_for_flutter_colors: true
      use_function_type_syntax_for_parameters: true
      use_if_null_to_convert_nulls_to_bools: true
      use_key_in_widget_constructors: true
      use_late_for_private_fields_and_variables: true
      use_named_constants: true
      use_raw_strings: true
      use_rethrow_when_possible: true
      use_setters_to_change_properties: true
      use_string_buffers: true
      use_super_parameters: true
      use_test_throws_matchers: true
      use_to_and_as_if_applicable: true
      use_truncating_division: true
      valid_regexps: true
      void_checks: true

# ============================================
# CODE FORMATTING CONFIGURATION
# ============================================

formatting:
  enabled: true
  
  # Formatting options
  options:
    line_length: 80
    indentation: 2
    use_spaces: true
    trailing_commas: true
    
  # Files to format
  include:
    - "lib/**"
    - "test/**"
    - "integration_test/**"
  
  # Files to exclude
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "**/build/**"

# ============================================
# CODE COMPLEXITY CONFIGURATION
# ============================================

complexity:
  enabled: true
  
  # Tool: dart_code_metrics
  tool: "dart_code_metrics"
  
  # Metrics thresholds
  metrics:
    cyclomatic_complexity: 20
    lines_of_code: 150
    number_of_parameters: 4
    maximum_nesting: 5
    
  # Anti-patterns to detect
  anti_patterns:
    - "long-method"
    - "long-parameter-list"
    - "long-function"
    
  # Rules
  rules:
    avoid-collection-mutation: true
    avoid-dynamic: true
    avoid-global-state: true
    avoid-long-functions: true
    avoid-many-parameters: true
    avoid-nested-conditions: true
    avoid-unused-parameters: true
    prefer-conditional-expressions: true
    prefer-first: true
    prefer-immediate-return: true
    prefer-last: true

# ============================================
# TESTING CONFIGURATION
# ============================================

testing:
  enabled: true
  
  # Test types
  types:
    unit:
      enabled: true
      directory: "test/unit/"
      coverage: true
      timeout: "2x"
      
    widget:
      enabled: true
      directory: "test/widget/"
      coverage: true
      timeout: "2x"
      
    integration:
      enabled: true
      directory: "integration_test/"
      coverage: true
      timeout: "3x"
      
    performance:
      enabled: true
      directory: "test/performance/"
      coverage: false
      timeout: "2x"
  
  # Coverage configuration
  coverage:
    enabled: true
    minimum: 80
    reports:
      - "lcov"
      - "html"
    
    # Files to exclude from coverage
    exclude:
      - "**/*.g.dart"
      - "**/*.freezed.dart"
      - "**/generated/**"
      - "**/build/**"
      - "test/**"
      - "integration_test/**"
  
  # Test reporters
  reporters:
    - "json"
    - "expanded"

# ============================================
# SECURITY CONFIGURATION
# ============================================

security:
  enabled: true
  
  # Security scanning tools
  tools:
    gitleaks:
      enabled: true
      config_file: ".gitleaks.toml"
      
    # Custom patterns to scan for
    custom_patterns:
      - "apiKey"
      - "api_key"
      - "API_KEY"
      - "secret"
      - "password"
      - "token"
      - "private_key"
      - "appwrite"
      - "firebase"
  
  # Files to scan
  include:
    - "lib/**"
    - "test/**"
    - "integration_test/**"
    - "*.dart"
    - "*.yaml"
    - "*.json"
  
  # Files to exclude
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "**/build/**"
    - ".git/**"
    - "pubspec.lock"
    - ".env*"

# ============================================
# CODE GENERATION CONFIGURATION
# ============================================

code_generation:
  enabled: true
  
  # Build runner configuration
  build_runner:
    build_extensions:
      "^lib/{{path}}": "generated/{{path}}"
    
    auto_apply: "all"
    
    # Build targets
    targets:
      $default:
        builders:
          freezed:
            enabled: true
            options:
              generate_to_json: true
              generate_from_json: true
              generate_copy_with: true
              generate_equals: true
              generate_to_string: true
              use_nullable: true
          
          json_serializable:
            enabled: true
            options:
              generate_to_json: true
              generate_from_json: true
              use_nullable: true
              field_rename: "snake"
              ignore_unannotated: false
              explicit_to_json: true
          
          riverpod_generator:
            enabled: true
            options:
              generate_provider: true
              use_generated_provider: true
          
          drift_dev:
            enabled: true
            options:
              generate_database: true
              generate_daos: true
          
          mockito:
            enabled: true
            options:
              generate_mocks: true

# ============================================
# REPORTING CONFIGURATION
# ============================================

reporting:
  enabled: true
  
  # Report directories
  directories:
    reports: "reports/"
    coverage: "coverage/"
    test_results: "test_results/"
    security: "security_reports/"
    quality: "quality_reports/"
  
  # Report formats
  formats:
    - "markdown"
    - "json"
    - "html"
  
  # Report retention
  retention:
    days: 30
    max_reports: 10
  
  # Email notifications (if configured)
  notifications:
    enabled: false
    recipients: []
    
  # Slack notifications (if configured)
  slack:
    enabled: false
    webhook_url: ""
    channel: "#code-quality"

# ============================================
# CI/CD INTEGRATION
# ============================================

ci_cd:
  enabled: true
  
  # GitHub Actions configuration
  github_actions:
    workflows:
      - ".github/workflows/flutter_ci_cd.yml"
      - ".github/workflows/copilot_review.yml"
    
    # Jobs to run
    jobs:
      - "code_quality"
      - "unit_widget_tests"
      - "integration_tests"
      - "coverage"
      - "build_production"
      - "security_scan"
      - "copilot_review"
    
    # Artifacts to upload
    artifacts:
      - "test-results"
      - "coverage-report"
      - "quality-reports"
      - "security-reports"
      - "production-apks"
      - "production-appbundle"

# ============================================
# LOCAL DEVELOPMENT CONFIGURATION
# ============================================

local_development:
  enabled: true
  
  # Makefile targets
  makefile:
    test: "flutter test"
    quality: "flutter analyze && flutter lint && flutter format --set-exit-if-changed ."
    build: "flutter build apk --release"
    clean: "flutter clean"
    generate: "flutter pub run build_runner build --delete-conflicting-outputs"
  
  # Scripts
  scripts:
    run_tests: "scripts/run_tests.sh"
    check_quality: "scripts/check_quality.sh"
    build_production: "scripts/build_production.sh"
    generate_reports: "scripts/generate_reports.sh"
  
  # Pre-commit hooks
  pre_commit:
    enabled: true
    hooks:
      - "make quality"
      - "make test-unit"
      - "git add ."

# ============================================
# PRODUCTION CONFIGURATION
# ============================================

production:
  enabled: true
  
  # Build configuration
  build:
    apk:
      enabled: true
      release: true
      split_per_abi: true
      obfuscate: true
      tree_shake_icons: false
      
    appbundle:
      enabled: true
      release: true
      obfuscate: true
      tree_shake_icons: false
  
  # Deployment
  deployment:
    firebase:
      enabled: true
      app_distribution: true
      
    google_play:
      enabled: true
      track: "production"
      
    app_store:
      enabled: false
      
  # Monitoring
  monitoring:
    crashlytics: true
    analytics: true
    performance: true
    
  # Logging
  logging:
    level: "info"
    output: "console"
    file: "logs/app.log"

# ============================================
# NOTIFICATIONS
# ============================================

notifications:
  # Quality threshold notifications
  quality_threshold:
    warning: 80
    error: 60
    
  # Test threshold notifications
  test_threshold:
    warning: 80
    error: 60
    
  # Coverage threshold notifications
  coverage_threshold:
    warning: 80
    error: 60
    
  # Security notifications
  security:
    warning: "low"
    error: "high"

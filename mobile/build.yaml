targets:
  $default:
    builders:
      freezed:
        enabled: true
        generate_for:
          exclude:
            - lib/services/sync_performance_optimizer.dart
            - lib/services/smart_sync_manager.dart
      drift_dev:
        enabled: true
        options:
          store_date_time_values_as_text: true
        generate_for:
          exclude:
            - lib/services/sync_performance_optimizer.dart
      source_gen:
        generate_for:
          exclude:
            - lib/services/sync_performance_optimizer.dart
# Marina Hotel Mobile - Build Configuration
# Build Runner Configuration for Code Generation
# Minimal, build_runner-compatible configuration.

targets:
  $default:
    builders:
      freezed:
        enabled: true
      json_serializable:
        enabled: true
        options:
          explicit_to_json: true
          field_rename: snake
      riverpod_generator:
        enabled: true
      drift_dev:
        enabled: true
      mockito:
        enabled: true

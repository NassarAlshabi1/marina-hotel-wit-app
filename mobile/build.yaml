# Marina Hotel Mobile - Build Configuration
# Build Runner Configuration for Code Generation
# Minimal, build_runner-compatible configuration.

targets:
  $default:
    builders:
      freezed:
        enabled: true
      json_serializable:
        enabled: true
        options:
          explicit_to_json: true
          field_rename: snake
      riverpod_generator:
        enabled: true
      drift_dev:
        enabled: true
      mockito:
        enabled: true

# CI-verified: build_runner parses and generates code successfully (Flutter 3.44.x).

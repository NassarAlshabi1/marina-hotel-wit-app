# Marina Hotel Mobile - Build Configuration
# ============================================
# Build Runner Configuration for Code Generation
# Maintainer: Marina Hotel Dev Team
# Last Updated: 2026-08-04
#
# Usage:
#   flutter pub run build_runner build
#   flutter pub run build_runner watch
#   flutter pub run build_runner clean

# ============================================
# GLOBAL BUILD OPTIONS
# ============================================
global_options:
  # Enable for all builders globally (supported key)
  auto_apply: all

# ============================================
# TARGETS CONFIGURATION
# ============================================

targets:
  $default:
    # Build Configuration (build_extensions is only valid inside a target)
    build_extensions:
      "^lib/{{path}}": "generated/{{path}}"
    # Builders Configuration
    builders:
      # ==========================================
      # FREEZED (Immutable Classes & Serialization)
      # ==========================================
      freezed:
        enabled: true
        options:
          # Generate to_json/toJson methods
          generate_to_json: true
          # Generate from_json/fromJson methods
          generate_from_json: true
          # Generate copyWith method
          generate_copy_with: true
          # Generate == and hashCode
          generate_equals: true
          # Generate toString
          generate_to_string: true
          # Use nullable for all fields
          use_nullable: true
          
      # ==========================================
      # JSON SERIALIZABLE (JSON Conversion)
      # ==========================================
      json_serializable:
        enabled: true
        options:
          # Generate toJson method
          generate_to_json: true
          # Generate fromJson method
          generate_from_json: true
          # Use nullable for all fields
          use_nullable: true
          # Generate for all classes with JsonSerializable
          use_generated_from_json: true
          use_generated_to_json: true
          # Field renaming strategy
          field_rename: snake
          # Ignore unannotated fields
          ignore_unannotated: false
          # Explicit toJson
          explicit_to_json: true
          
      # ==========================================
      # RIVERPOD (State Management)
      # ==========================================
      riverpod_generator:
        enabled: true
        options:
          # Generate provider classes
          generate_provider: true
          # Generate for all providers
          use_generated_provider: true
          
      # ==========================================
      # DRIFT (Database)
      # ==========================================
      drift_dev:
        enabled: true
        options:
          # Generate database classes
          generate_database: true
          # Generate DAOs
          generate_daos: true
          # Generate for all drift files
          use_generated_database: true
          use_generated_daos: true
          
      # ==========================================
      # MOCKITO (Mock Generation)
      # ==========================================
      mockito:
        enabled: true
        options:
          # Generate mocks for all classes
          generate_mocks: true
          # Generate for all mockable classes
          use_generated_mocks: true

  # ============================================
  # SPECIFIC TARGETS (Custom Configuration)
  # ============================================
  
  # Lib Directory (Main Source)
  lib:
    builders:
      freezed:
        options:
          # Custom output directory for lib
          output_directory: "generated/lib"
          
      json_serializable:
        options:
          # Custom output directory for lib
          output_directory: "generated/lib"
          
      riverpod_generator:
        options:
          # Custom output directory for lib
          output_directory: "generated/lib"

  # Test Directory
  test:
    builders:
      freezed:
        enabled: true
        options:
          output_directory: "generated/test"
          
      json_serializable:
        enabled: true
        options:
          output_directory: "generated/test"
          
      mockito:
        enabled: true
        options:
          output_directory: "generated/test/mocks"

  # Integration Test Directory
  integration_test:
    builders:
      freezed:
        enabled: true
        options:
          output_directory: "generated/integration_test"
          
      json_serializable:
        enabled: true
        options:
          output_directory: "generated/integration_test"
          
      mockito:
        enabled: true
        options:
          output_directory: "generated/integration_test/mocks"

# ═══════════════════════════════════════════════════════════════
#  Marina Hotel — Analysis Options (Best-in-Class 2026)
#  Based on Very Good Analysis (VGV) — Professional Quality Gate
# ═══════════════════════════════════════════════════════════════
#
#  ✅ يستخدم very_good_analysis كقاعدة (معايير VGV عالمية)
#     include غير مُنسّق (unversioned) → دائماً أحدث القواعد تلقائياً
#     (راجع: https://pub.dev/packages/very_good_analysis#usage)
#  ✅ strict-casts, strict-inference, strict-raw-types مُفعّلة
#  ✅ custom_lint plugin مُفعّل (لمساعدات riverpod_lint)
#  ✅ قواعد Performance + Flutter Best Practices مُفعّلة
#  ✅ القواعد الأمنية المعاد تفعيلها (Phase-2 migration):
#       - avoid_dynamic_calls   (type safety)
#       - close_sinks           (memory leaks)
#       - discarded_futures     (unhandled async errors)
#       - avoid_slow_async_io   (main-thread protection)
#  ✅ Suppress القواعد على مستوى المشروع يتم عبر linter.rules: <rule>: false
#     (الطريقة الموثقة في VGA README، وليس عبر analyzer.errors)
# ═══════════════════════════════════════════════════════════════

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # NOTE: custom_lint plugin entry removed — see pubspec.yaml comment for
  # the upstream analyzer version conflict between riverpod_lint/custom_lint
  # (analyzer ^7.0.0) and json_serializable ^6.14.0 (analyzer >=10.0.0).
  # Will be re-enabled when project migrates to riverpod 3.x.
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    - "test/**"
    - "build/**"
    - "integration_test/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # === Errors (blocking) — هذه diagnostics من الـ analyzer وليست lint rules ===
    missing_return: error
    missing_required_param: error
    invalid_annotation_target: ignore

linter:
  rules:
    # ═══════════════════════════════════════════════════════════════════
    # Project-level suppressions (per VGA README documentation)
    # Pattern: <rule_name>: false
    # Reason: إيقاف قواعد lint غير مناسبة للمشروع أو تتطلب ترحيل تدريجي
    # ═══════════════════════════════════════════════════════════════════

    # === Project-specific overrides ===
    always_use_package_imports: false  # المشروع يستخدم relative imports
    avoid_final_parameters: false
    omit_local_variable_types: false  # نُفضّل الأنواع الصريحة للقراءة

    # === Temporarily disabled for migration (Phase-2) ===
    public_member_api_docs: false  # يتطلب توثيق كل member عام (مرحلي)
    lines_longer_than_80_chars: false  # المشروع يستخدم line-length 120
    avoid_print: false  # نستخدم dlog() بدلاً منها
    avoid_catches_without_on_clauses: false  # يحتاج refactor تدريجي
    avoid_catching_errors: false  # يحتاج refactor تدريجي
    cascade_invocations: false  # غير متوافق مع style المشروع الحالي
    one_member_abstracts: false  # يُفضّل abstract class مع member واحد
    prefer_function_declarations_over_variables: false
    prefer_final_parameters: false
    specify_nonobvious_property_types: false
    no_default_cases: false
    flutter_style_todos: false
    document_ignores: false
    missing_code_block_language_in_doc_comment: false
    unintended_html_in_doc_comment: false
    dangling_library_doc_comments: false
    no_runtimeType_toString: false
    avoid_web_libraries_in_flutter: false
    combinators_ordering: false
    library_annotations: false
    library_prefixes: false
    unnecessary_library_directive: false
    unnecessary_library_name: false
    use_setters_to_change_properties: false
    use_string_buffers: false
    use_truncating_division: false
    parameter_assignments: false  # Refactor needed — Phase 2
    avoid_positional_boolean_parameters: false
    prefer_int_literals: false
    avoid_bool_literals_in_conditional_expressions: false
    literal_only_boolean_expressions: false
    type_literal_in_constant_pattern: false
    strict_top_level_inference: false
    implicit_reopen: false
    depend_on_referenced_packages: false
    deprecated_consistency: false
    conditional_uri_does_not_exist: false
    secure_pubspec_urls: false
    use_null_aware_elements: false
    unnecessary_underscores: false
    no_wildcard_variable_uses: false
    no_leading_underscores_for_library_prefixes: false
    no_leading_underscores_for_local_identifiers: false
    implicit_call_tearoffs: false
    unreachable_from_main: false
    unnecessary_unawaited: false
    unnecessary_late: false
    avoid_escaping_inner_quotes: false
    prefer_inlined_adds: false
    matching_super_parameters: false
    avoid_type_to_string: false
    avoid_equals_and_hash_code_on_mutable_classes: false
    avoid_double_and_int_checks: false
    avoid_js_rounded_ints: false
    avoid_field_initializers_in_const_classes: false
    avoid_init_to_null: false
    avoid_shadowing_type_parameters: false
    avoid_returning_this: false
    avoid_setters_without_getters: false
    avoid_private_typedef_functions: false
    avoid_multiple_declarations_per_line: false
    invalid_case_patterns: false
    invalid_runtime_check_with_js_interop_types: false
    collection_methods_unrelated_type: false

    # === VGA 10.x new rules — temporarily disabled for migration ===
    simple_directive_paths: false
    avoid_types_on_closure_parameters: false
    unnecessary_ignore: false
    use_if_null_to_convert_nulls_to_bools: false

    # ═══════════════════════════════════════════════════════════════════
    # SECURITY & PERFORMANCE RULES — Phase-2 Migration
    # ✅ ALL FOUR STRICT RULES NOW ENABLED GLOBALLY
    #
    # Files with pre-existing violations have `// ignore_for_file:` directives
    # with TODO(phase-2) markers. Each file-level ignore should be removed
    # once its violations are properly fixed.
    #
    # Progress (as of 2026-08-03):
    #   ✅ close_sinks: 0 violations (passing globally)
    #   ✅ avoid_slow_async_io: 0 violations (3 fixed via statSync/existsSync)
    #   ✅ avoid_dynamic_calls: enabled globally
    #       - 7 files fully fixed (no ignore needed)
    #       - 13 files have // ignore_for_file: avoid_dynamic_calls (TODO)
    #   ✅ discarded_futures: enabled globally
    #       - 7 files fully fixed (no ignore needed)
    #       - 96 files have // ignore_for_file: discarded_futures (TODO)
    #
    # Migration path: remove file-level ignores one by one, fix violations,
    # verify with `flutter analyze`. Target: zero ignores by v2.0.0.
    # ═══════════════════════════════════════════════════════════════════
    close_sinks: true                # منع memory leaks من StreamControllers
    avoid_slow_async_io: true        # حماية الـ Main Thread
    discarded_futures: true          # منع unhandled async errors
    avoid_dynamic_calls: true        # type safety (JSON parsing needs explicit casts)

    # === Phase 2 migration — severity downgrades ===
    always_put_required_named_parameters_first: true
    use_build_context_synchronously: true

    # === Performance Optimization Rules ===
    avoid_unnecessary_containers: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_literals_to_create_immutables: true

    # === Flutter Best Practices ===
    prefer_const_declarations: true
    prefer_final_fields: true
    prefer_final_locals: true

    # === Explicitly enabled (relative imports preference) ===
    prefer_relative_imports: true

# Static analysis baseline for the Marina Hotel Flutter application.
# Keep this configuration intentionally small, supported by the current Dart SDK,
# and suitable for gradual code-quality enforcement in production.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/generated_plugin_registrant.dart"
    - "**/firebase_options.dart"
    - "build/**"
    - "test/**"
    - "integration_test/**"
    - "test_driver/**"
    - "android/**"
    - "ios/**"
    - "web/**"
    - "windows/**"
    - "macos/**"
    - "linux/**"

linter:
  rules:
    # High-value correctness and lifecycle checks, supported by the active SDK.
    avoid_print: true
    unawaited_futures: true
    use_build_context_synchronously: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_const_constructors: true
    use_key_in_widget_constructors: true
    # Performance (docs/PERFORMANCE.md §2.1): const everywhere + whitespace hygiene.
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true

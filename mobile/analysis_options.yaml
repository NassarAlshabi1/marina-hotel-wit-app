# Marina Hotel - Analysis Options
# Professional Quality Gate Configuration
# Updated: 2026-07-17
#
# ✅ يعتمد very_good_analysis 9.0.0 كقاعدة (196 قاعدة احترافية من VGV)
# ✅ strict-casts, strict-inference, strict-raw-types مُفعّلة (من VGA)
# ✅ استثناءات تدريجية للملفات القديمة لتفادي 17000+ issue دفعة واحدة
# ✅ جميع الـ warnings تُعتبر errors (blocking)
# ✅ قواعد Performance + Flutter Best Practices مُفعّلة
#
# استراتيجية الترحيل:
# 1. تفعيل VGA مع استثناءات لـ 12 قاعدة صارمة جداً
# 2. إصلاح الملفات تدريجياً (over next sprints)
# 3. إزالة الاستثناءات واحدة تلو الأخرى

include: package:very_good_analysis/analysis_options.9.0.0.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    - "test/**"
    - "build/**"

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # === Errors (blocking) ===
    missing_return: error
    missing_required_param: error
    invalid_annotation_target: ignore
    undefined_method: error
    undefined_class: error
    undefined_identifier: error
    argument_type_not_assignable: error
    return_of_invalid_type_from_closure: error
    return_of_invalid_type: error
    invalid_assignment: error
    not_a_type: error
    extra_positional_arguments: error
    uri_does_not_exist: error
    illegal_async_generator_return_type: error
    illegal_async_return_type: error
    illegal_sync_generator_return_type: error
    override_on_non_overriding_member: error
    field_initializer_redirecting_constructor: error
    super_in_redirecting_constructor: error
    redirect_generative_to_missing_constructor: error
    const_with_non_constant_argument: error
    const_constructor_param_type_type_mismatch: error

    # === Warnings (blocking) ===
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
    invalid_null_aware_operator: warning
    type_argument_not_matching_bounds: warning

    # === Infos → Warnings (blocking) ===
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning

    # === Disabled (acceptable in this project) ===
    use_build_context_synchronously: ignore
    avoid_print: ignore

# ====================================================================
# استثناءات تدريجية لقواعد VGA الصارمة جداً
# ستُزال تدريجياً عند إصلاح الملفات القديمة
# ====================================================================
linter:
  rules:
    # === قواعد معطَّلة مؤقتاً (مرحلة الترحيل) ===
    public_member_api_docs: false          # يتطلب توثيق كل API عام
    sort_pub_dependencies: false           # تعارض مع ترتيبنا الحالي
    always_use_package_imports: false      # نستخدم relative imports
    avoid_renaming_method_parameters: false # بعض overrides قديمة
    comment_references: false              # يحتاج توثيق كثير
    type_annotate_public_apis: false       # ملفات قديمة كثيرة
    prefer_single_quotes: false            # نستخدم mix
    lines_longer_than_80_chars: false      # عربي + URLs
    prefer_const_constructors: false       # يحتاج إصلاح 1000+ موضع
    prefer_const_declarations: false       # نفس السبب
    prefer_const_literals_to_create_immutables: false
    avoid_positional_boolean_parameters: false
    join_return_with_assignment: false

    # === قواعد Performance الحرجة (مُفعّلة) ===
    avoid_unnecessary_containers: true
    avoid_function_literals_in_foreach_calls: true
    avoid_redundant_argument_values: true
    prefer_constructors_over_static_methods: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    prefer_foreach: true
    prefer_if_elements_to_conditional_expressions: true
    prefer_interpolation_to_compose_strings: true
    prefer_null_aware_method_calls: true
    prefer_spread_collections: true
    prefer_contains: true
    prefer_is_empty: true
    prefer_conditional_assignment: true
    sized_box_shrink_expand: true
    use_colored_box: true
    use_decorated_box: true
    use_enums: true
    use_if_null_to_convert_nulls_to_bools: true
    use_is_even_rather_than_modulo: true
    use_late_for_private_fields_and_variables: true
    use_named_constants: true
    use_rethrow_when_possible: true
    use_super_parameters: true
    use_test_throws_matchers: true
    use_to_and_as_if_applicable: true

    # === Flutter Best Practices (مُفعّلة) ===
    use_key_in_widget_constructors: true
    cancel_subscriptions: true
    close_sinks: true
    throw_in_finally: true
    unawaited_futures: true
    unnecessary_await_in_return: true
    avoid_void_async: true

    # === Code Quality (مُفعّلة) ===
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_returning_null_for_void: true
    directives_ordering: true
    overridden_fields: true
    prefer_void_to_null: true
    require_trailing_commas: true
    annotate_overrides: true
    await_only_futures: true
    camel_case_extensions: true
    camel_case_types: true
    curly_braces_in_flow_control_structures: true
    empty_catches: true
    empty_statements: true
    hash_and_equals: true
    no_duplicate_case_values: true
    no_logic_in_create_state: true
    non_constant_identifier_names: true
    null_check_on_nullable_type_parameter: true
    only_throw_errors: true
    prefer_is_not_empty: true
    prefer_is_not_operator: true
    prefer_typing_uninitialized_variables: true
    prefer_null_aware_operators: true
    provide_deprecation_message: true
    recursive_getters: true
    slash_for_doc_comments: true
    type_init_formals: true
    unnecessary_brace_in_string_interps: true
    unnecessary_breaks: true
    unnecessary_getters_setters: true
    unnecessary_lambdas: true
    unnecessary_null_aware_assignments: true
    unnecessary_null_checks: true
    unnecessary_overrides: true
    unnecessary_parenthesis: true
    unnecessary_raw_strings: true
    unnecessary_statements: true
    unnecessary_string_escapes: true
    unnecessary_string_interpolations: true
    unnecessary_to_list_in_spreads: true
    unnecessary_this: true
    use_full_hex_values_for_flutter_colors: true
    void_checks: true

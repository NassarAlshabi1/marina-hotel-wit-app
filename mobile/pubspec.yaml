name: marina_hotel_mobile
description: "Marina Hotel - Complete Hotel Management System (RTL, Offline-First, Arabic)"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0-dev.3
  dio: ^5.9.2
  http: ^1.6.0
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.42
  connectivity_plus: ^7.0.0
  battery_plus: ^7.0.0
  flutter_secure_storage: ^10.0.0
  android_alarm_manager_plus: ^5.0.0
  flutter_local_notifications: ^20.1.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  workmanager: ^0.9.0
  shared_preferences: ^2.5.5
  file_picker: ^10.3.10
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  flutter_contacts: ^2.0.1
  device_info_plus: ^12.3.0
  appwrite: ^23.0.0
  collection: ^1.18.0
  web_socket_channel: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  firebase_core: ^4.6.0
  firebase_crashlytics: ^5.1.0
  firebase_analytics: ^12.2.0

  # Required for file-based SQLite backup/restore helpers
  sqflite: ^2.4.2
  path: ^1.9.0
  crypto: ^3.0.7
  encrypt: ^5.0.3
  uuid: ^4.5.3
  synchronized: ^3.4.0
  # UI file picking is performed with file_picker from the UI layer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  sqflite_common_ffi: ^2.3.7+1
  drift_dev: ^2.31.0
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  mockito: ^5.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf
    - assets/images/hotel_logo.jpg

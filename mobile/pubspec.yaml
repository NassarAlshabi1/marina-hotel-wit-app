name: marina_hotel_mobile
description: "Marina Hotel - Complete Hotel Management System (RTL, Offline-First, Arabic)"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  http: ^1.2.2
  drift: ^2.20.0
  drift_sqflite: ^2.0.1
  sqlite3_flutter_libs: ^0.5.24
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  connectivity_plus: ^6.1.0
  battery_plus: ^6.0.2
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.15.9
  workmanager: ^0.9.0+2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  share_plus: ^10.1.1
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  # Required for file-based SQLite backup/restore helpers
  sqflite: ^2.3.3+1
  path: ^1.9.0
  # UI file picking is performed with file_picker from the UI layer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.13
  freezed: ^2.5.7
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf
    - assets/images/hotel_logo.jpg

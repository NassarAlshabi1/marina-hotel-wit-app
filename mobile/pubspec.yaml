name: marina_hotel_mobile
description: Marina Hotel - Complete Hotel Management System (RTL, Offline-First,
  Arabic)
publish_to: none
version: 1.2.0+3
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  android_alarm_manager_plus: ^4.0.5
  battery_plus: ^6.0.2
  characters: any
  clock: ^1.1.1
  collection: ^1.18.0
  connectivity_plus: ^6.1.0
  crypto: ^3.0.3
  device_info_plus: ^12.3.0
  dio: ^5.7.0
  drift: ^2.31.0
  encrypt: ^5.0.3
  excel: ^4.0.6
  file_picker: ^8.1.2
  firebase_ai: ^3.6.0
  firebase_analytics: ^12.3.0
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  firebase_database: ^12.3.0
  firebase_messaging: ^16.2.0
  firebase_performance: ^0.11.4+3
  firebase_remote_config: ^6.4.0
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_contacts: ^1.1.9+2
  flutter_local_notifications: ^17.2.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^3.1.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  package_info_plus: ^8.1.1
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  permission_handler: ^11.3.1
  pointycastle: ^3.9.1
  posthog_flutter: ^4.0.0
  printing: ^5.13.2
  share_plus: ^10.1.1
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  signals_flutter: ^6.0.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3+1
  sqlite3: any
  sqlite3_flutter_libs: ^0.5.24
  synchronized: ^3.1.0+1
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3
  workmanager: ^0.9.0
dev_dependencies:
  build_runner: ^2.15.1
  cli_completion: ^0.5.1
  dart_code_linter: ^4.1.8
  drift_dev: ^2.31.0
  flutter_driver:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.0
  mockito: ^5.4.4
  patrol: ^4.7.1
  very_good_analysis: ^10.0.0
  # dart_code_linter ^4.1.8 declared above
  #
  # NOTE: riverpod_lint is NOT declared here due to an upstream analyzer
  # version conflict that cannot be resolved without a major migration:
  #   - riverpod_lint 2.x  requires analyzer ^7.0.0  (compatible only with json_serializable <6.11)
  #   - json_serializable ^6.14.0 requires analyzer >=10.0.0
  #   - riverpod_lint 3.x  requires riverpod 3.x  (project is on flutter_riverpod ^2.6.1)
  # Migration path: upgrade to riverpod 3.x (planned for v2.x→3.0 migration),
  # then add `riverpod_lint: ^3.1.8` and `custom_lint: ^0.7.0`.
  # The custom_lint plugin entry in analysis_options.yaml is kept as a no-op
  # placeholder so future enablement is a single-line change.


flutter:
  uses-material-design: true
  assets:
  - assets/fonts/Tajawal-Regular.ttf
  - assets/fonts/Tajawal-Bold.ttf
  - assets/images/hotel_logo.jpg

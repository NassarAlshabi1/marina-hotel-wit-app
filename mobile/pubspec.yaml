name: marina_hotel_mobile
description: "Marina Hotel - Complete Hotel Management System (RTL, Offline-First, Arabic)"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  realm: ^20.1.1 # أو أحدث إصدار مستقر
  dio: ^5.7.0
  http: ^1.2.2
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.24
  connectivity_plus: ^6.1.0
  battery_plus: ^6.0.2
  flutter_secure_storage: ^9.2.2
  android_alarm_manager_plus: ^4.0.5
  flutter_local_notifications: ^17.2.1
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  workmanager: ^0.9.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  share_plus: ^10.1.1
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  appwrite: ^17.1.0
  collection: ^1.18.0

  # Required for file-based SQLite backup/restore helpers
  sqflite: ^2.3.3+1
  path: ^1.9.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  uuid: ^4.5.1
  synchronized: ^3.1.0+1
  # UI file picking is performed with file_picker from the UI layer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.13
  freezed: ^2.5.7
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf
    - assets/images/hotel_logo.jpg

name = "marina-hotel-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "81a73bba9acc1de5693ff929d0a372ce"

# ─── D1 Database ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "marina-hotel-db"
database_id = "607f1090-83b1-4281-975f-d81b8f6154e7"

# ─── KV for rate limiting ─────────────────────────────────────
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "13ee86354dee4511b0bffc708fc90459"

# ─── Durable Objects (sync locks + realtime) ──────────────────
[[durable_objects.bindings]]
name = "SYNC_LOCK"
class_name = "SyncLockDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncLockDO"]

# ─── Environment Variables ────────────────────────────────────
[vars]
JWT_SECRET = "marina-hotel-jwt-secret-2026-change-in-production"
JWT_EXPIRY_HOURS = "24"
RATE_LIMIT_WINDOW = "60"
RATE_LIMIT_MAX = "100"
CORS_ORIGIN = "*"

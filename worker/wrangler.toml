name = "marina-hotel-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "81a73bba9acc1de5693ff929d0a372ce"

# ─── D1 Database ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "marina-hotel-db"
database_id = "607f1090-83b1-4281-975f-d81b8f6154e7"

# ─── Rate limiting ────────────────────────────────────────────
# Decision (plan D1/D2): rate limiting runs on D1
# (INSERT ... ON CONFLICT ... RETURNING — atomic, no KV free-tier
# 1000 writes/day cap, no eventual consistency). The former dead
# RATE_LIMIT KV binding was removed — it was never read by the code.

# ─── Durable Objects ─────────────────────────────────────────
# SYNC_LOCK: entity locks + cursors (dormant — no client callers today).
# REALTIME_HUB (2026-09-17): dedicated realtime WebSocket hub on the
# Hibernation API — sessions survive deploys/evictions; split out of
# SyncLockDO('global') whose in-memory Map dropped every device on
# each `wrangler deploy`.
[[durable_objects.bindings]]
name = "SYNC_LOCK"
class_name = "SyncLockDO"

[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncLockDO"]

# v2 (additive — v1 state untouched): registers the realtime hub class.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RealtimeHubDO"]

# ─── Environment Variables ────────────────────────────────────
# JWT_SECRET is stored as a Cloudflare Secret (not in plaintext here)
# Set via: wrangler secret put JWT_SECRET
#
# ✅ (2026-09-20) AI_TOKEN is stored as a Cloudflare Secret too:
# Workers AI API token (cfut_…) powering the REST fallback in
# src/ai.ts — the deployed [ai] binding currently fails in
# production, so classify() falls back to the REST API with this
# token. Set via: wrangler secret put AI_TOKEN
[vars]
# ✅ (2026-09-15) عقد المصادقة: "0" = توكن طويل الأجل بلا انتهاء تلقائي.
# الإبطال المقصود يدوي فقط: تدوير JWT_SECRET يُبطل كل التوكنات دفعة واحدة.
# أي قيمة أخرى > 0 تعني ساعات صلاحية (توافق خلفي)، والمفقودة تعود لـ 24.
JWT_EXPIRY_HOURS = "0"
RATE_LIMIT_WINDOW = "60"
RATE_LIMIT_MAX = "1000"
CORS_ORIGIN = "*"
# ✅ (2026-09-20) معرف الحساب لمسار REST الاحتياطي في src/ai.ts —
# نفس المعرف المصرّح به أعلاه في account_id (ليس سراً؛ هوية عامة).
CLOUDFLARE_ACCOUNT_ID = "81a73bba9acc1de5693ff929d0a372ce"

# Workers AI — used only inside the authenticated natural-language endpoint.
[ai]
binding = "AI"

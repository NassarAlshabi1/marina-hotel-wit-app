name = "marina-hotel-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "81a73bba9acc1de5693ff929d0a372ce"

# ─── D1 Database ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "marina-hotel-db"
database_id = "607f1090-83b1-4281-975f-d81b8f6154e7"

# ─── Rate limiting ────────────────────────────────────────────
# Decision (plan D1/D2): rate limiting runs on D1
# (INSERT ... ON CONFLICT ... RETURNING — atomic, no KV free-tier
# 1000 writes/day cap, no eventual consistency). The former dead
# RATE_LIMIT KV binding was removed — it was never read by the code.

# ─── Durable Objects (sync locks + realtime) ──────────────────
[[durable_objects.bindings]]
name = "SYNC_LOCK"
class_name = "SyncLockDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncLockDO"]

# ─── Environment Variables ────────────────────────────────────
# JWT_SECRET is stored as a Cloudflare Secret (not in plaintext here)
# Set via: wrangler secret put JWT_SECRET
[vars]
JWT_EXPIRY_HOURS = "24"
RATE_LIMIT_WINDOW = "60"
RATE_LIMIT_MAX = "1000"
CORS_ORIGIN = "*"

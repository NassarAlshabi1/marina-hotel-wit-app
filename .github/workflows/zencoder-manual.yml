name: Run Zencoder Agent Manually

on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: "The input prompt for the Agent"
        required: true
        default: "Fix dart flutter"
      agent:
        type: string
        description: "Alias of the agent to run (leave empty for default)"
        required: false
        default: ""
      model:
        type: choice
        description: "LLM model to use"
        required: false
        default: "default"
        options:
          - default
          - opus-4-5
          - sonnet-4
          - gemini-25-pro

jobs:
  agent-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Running Zencoder Agent
        uses: zencoderai/zen-agents-action@main
        with:
          prompt: "${{ inputs.prompt }}"
          agent: "${{ inputs.agent }}"
          model: "${{ inputs.model }}"
          zencoder_client_id: "${{ secrets.ZENCODER_CLIENT_ID }}"
          zencoder_client_secret: "${{ secrets.ZENCODER_CLIENT_SECRET }}"
          github_token: "${{ secrets.GITHUB_TOKEN }}"

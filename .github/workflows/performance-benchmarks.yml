# ════════════════════════════════════════════════════════════════════════════
#  Marina Hotel — Performance Benchmarks CI (All PRs)
# ════════════════════════════════════════════════════════════════════════════
#
#  يُشغِّل كل اختبارات الأداء (benchmarks) على كل PR وكل push.
#
#  Benchmarks المُغطّاة:
#    1. production_screen_benchmark_test.dart    — شاشات إنتاج فعلية
#    2. wide_screen_benchmark_test.dart          — 6 شاشات (Dashboard, Rooms, etc.)
#    3. scroll_performance_benchmark_test.dart   — scroll 250 items
#    4. sync_operations_benchmark_test.dart      — outbox + sync operations
#    5. outbox_load_benchmark_test.dart          — outbox 1000+ entries
#    6. appwrite_sync_flow_benchmark_test.dart   — sync flow simulation
#    7. pdf_generation_benchmark_test.dart       — PDF generation
#    8. memory_leak_benchmark_test.dart          — leak detection (10x iterations)
#    9. benchmark_test.dart                       — legacy (kept for compatibility)
#   10. warnings_audit_test.dart                  — PerformanceMonitor warnings audit
#
#  الفرق عن performance-benchmark.yml:
#    - يعمل على كل PR (بدون قيد branches)
#    - يُشغّل كل benchmarks بشكل منفصل (لا fail كامل إذا فشل واحد)
#    - يُصدّر تقرير JSON لكل benchmark
#    - يرفع تقارير كـ artifacts للاحتفاظ بالتاريخ
#
#  التوثيق: mobile/test/performance/
# ════════════════════════════════════════════════════════════════════════════

name: Performance Benchmarks (All PRs)

concurrency:
  group: perf-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/performance-benchmarks.yml'
  push:
    branches:
      - main
      - 'refactor/**'
    paths:
      - 'mobile/**'
      - '.github/workflows/performance-benchmarks.yml'
  workflow_dispatch:

jobs:
  benchmark:
    name: 📊 Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Verify Flutter version
        run: flutter --version

      - name: 🧪 Run all performance benchmarks
        run: |
          mkdir -p build/performance
          # تشغيل كل benchmarks مع machine-readable output
          # نستخدم --exclude-tags إذا احتجنا استثناء بعض tests
          flutter test test/performance/ \
            --machine \
            --timeout 300s \
            > build/performance/benchmark_results_${{ github.run_id }}.json 2> build/performance/benchmark_stderr_${{ github.run_id }}.log || true

          # طباعة stderr للـ debugging
          echo "=== Benchmark stderr (last 20 lines) ==="
          tail -20 build/performance/benchmark_stderr_${{ github.run_id }}.log || true

      - name: 📊 Generate benchmark summary
        if: always()
        run: |
          mkdir -p build/performance
          python3 << 'EOF' > build/performance/summary.md
          import json
          import os

          run_id = os.environ.get('GITHUB_RUN_ID', 'unknown')
          results_file = f'build/performance/benchmark_results_{run_id}.json'

          print(f'# 📊 Performance Benchmark Summary (Run #{run_id})\n')

          if not os.path.exists(results_file):
              print('⚠️ No benchmark results found. Check stderr log.')
              exit(0)

          passed = 0
          failed = 0
          total_ms = 0

          with open(results_file) as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      event = json.loads(line)
                      if event.get('type') == 'testDone':
                          if event.get('result') == 'success':
                              passed += 1
                          else:
                              failed += 1
                  except json.JSONDecodeError:
                      continue

          print(f'## Results\n')
          print(f'- ✅ Passed: {passed}')
          print(f'- ❌ Failed: {failed}')
          print(f'- 📈 Total: {passed + failed}\n')
          print(f'## Benchmarks Covered\n')
          print('1. production_screen_benchmark_test.dart — شاشات إنتاج فعلية')
          print('2. wide_screen_benchmark_test.dart — 6 شاشات')
          print('3. scroll_performance_benchmark_test.dart — scroll 250 items')
          print('4. sync_operations_benchmark_test.dart — outbox + sync')
          print('5. outbox_load_benchmark_test.dart — outbox 1000+ entries')
          print('6. appwrite_sync_flow_benchmark_test.dart — sync flow')
          print('7. pdf_generation_benchmark_test.dart — PDF generation')
          print('8. memory_leak_benchmark_test.dart — leak detection')
          print('9. benchmark_test.dart — legacy')
          print('10. warnings_audit_test.dart — warnings audit')
          EOF
          cat build/performance/summary.md

      - name: 💬 Comment PR with summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summaryPath = 'mobile/build/performance/summary.md';
            let summary = '⚠️ No benchmark summary generated.';
            try {
              summary = fs.readFileSync(summaryPath, 'utf8');
            } catch (e) {
              console.log('No summary file found:', e.message);
            }

            // البحث عن comment سابق وتحديثه
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📊 Performance Benchmark Summary')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }

      - name: 📤 Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmarks-${{ github.run_id }}
          path: mobile/build/performance/
          retention-days: 30

name: Build Flutter APK

on:
  # Runs on main and any feature branches from main (capy/**), plus manual trigger.
  push:
    branches:
      - main
      - 'capy/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          cache: true
          cache-key: flutter-${{ runner.os }}-3.41.0

      - name: Flutter Clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: >
          flutter build apk --debug
          --dart-define=BASE_API_URL=http://hotelmarina.com/MARINA_HOTEL_PORTABLE/api/v1
          --dart-define=AGENT_ROUTER_API_KEY=${{ secrets.AGENTROUTER_API_KEY }}
          --dart-define=AGENT_ROUTER_BASE_URL=https://openrouter.ai/api/v1

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'marina-hotel-debug-main-${{ github.run_number }}'
          path: mobile/build/app/outputs/flutter-apk/*-debug*.apk
          if-no-files-found: error

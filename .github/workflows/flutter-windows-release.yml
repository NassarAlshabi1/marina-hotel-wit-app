concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main, marina]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-windows-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-windows-release.yml'
  workflow_dispatch:


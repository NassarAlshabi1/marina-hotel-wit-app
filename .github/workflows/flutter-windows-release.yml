name: Build Flutter Windows Release

on:
  push:
    branches:
      - main
      - 'marina'
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-windows-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-windows-release.yml'
  workflow_dispatch:
    inputs:
      base_api_url:
        description: 'BASE_API_URL for desktop build'
        required: false
        default: 'http://127.0.0.1:8080/api/v1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-release:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      BASE_API_URL: ${{ github.event.inputs.base_api_url || 'http://127.0.0.1:8080/api/v1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
          cache-key: flutter-${{ runner.os }}-3.35.7

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Add Windows platform support
        run: flutter create --platforms=windows .

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner - clean generated files
        run: flutter pub run build_runner clean

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs --verbose

      - name: Build Windows release
        run: flutter build windows --release --dart-define=BASE_API_URL=${{ env.BASE_API_URL }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: marina-hotel-windows-${{ github.run_number }}
          path: |
            mobile/build/windows/x64/runner/Release/**
          if-no-files-found: error

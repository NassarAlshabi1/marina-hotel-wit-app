name: Build Flutter Windows Release

on:
  push:
    branches:
      - main
      - 'marina'
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-windows-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-windows-release.yml'
  workflow_dispatch:
    inputs:
      base_api_url:
        description: 'BASE_API_URL for desktop build'
        required: false
        default: 'http://127.0.0.1:8080/api/v1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-release:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      BASE_API_URL: ${{ github.event.inputs.base_api_url || 'http://127.0.0.1:8080/api/v1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
          cache-key: flutter-${{ runner.os }}-3.35.7

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner - clean generated files
        run: flutter pub run build_runner clean

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs --verbose

      - name: Build Windows release
        run: flutter build windows --release --dart-define=BASE_API_URL=${{ env.BASE_API_URL }}

      - name: Copy DLL files to Release folder
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $vcRedistDir = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\14.40.33807\x64"
          
          # نسخ ملفات DLL المهمة إذا وجدت
          if (Test-Path $vcRedistDir) {
            Copy-Item "$vcRedistDir\*.dll" $releaseDir -ErrorAction SilentlyContinue
          }
          
          # نسخ من System32 كاحتياطي
          $dlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($dll in $dlls) {
            $source = "C:\Windows\System32\$dll"
            if (Test-Path $source) {
              Copy-Item $source $releaseDir -ErrorAction SilentlyContinue
            }
          }

      - name: Create portable ZIP archive
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zipName = "marina-hotel-windows-portable.zip"
          
          # إنشاء ملف ZIP قابل للنقل
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName -Force
          
          # عرض محتويات الملف
          Write-Host "=== محتويات ملف ZIP ==="
          Expand-Archive -Path $zipName -DestinationPath "temp_check" -Force
          Get-ChildItem "temp_check" | Select-Object Name, Length
          Remove-Item "temp_check" -Recurse -Force

      - name: Upload Windows artifact (Folder)
        uses: actions/upload-artifact@v4
        with:
          name: marina-hotel-windows-${{ github.run_number }}
          path: |
            mobile/build/windows/x64/runner/Release/**
          if-no-files-found: error

      - name: Upload Windows artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: marina-hotel-windows-portable-${{ github.run_number }}
          path: |
            mobile/marina-hotel-windows-portable.zip
          if-no-files-found: error

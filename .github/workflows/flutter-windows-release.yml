name: Build Flutter Windows Release

# ═══════════════════════════════════════════════════════════════
#  Marina Hotel — Build Flutter Windows Release
# ═══════════════════════════════════════════════════════════════
#
#  يبني تطبيق Flutter لـ Windows Desktop (release).
#  ينتج ملف .exe + ملفات DLL + assets في مجلد bundle.
#
#  المتطلبات:
#  - Flutter 3.44.9+ (مع --enable-windows-desktop)
#  - Visual Studio Build Tools (CMake)
#  - sqflite_common_ffi لـ SQLite على Desktop
#
#  الإصلاحات اللازمة لدعم Windows:
#  - local_db.dart: استخدام path_provider بدلاً من sqflite.getDatabasesPath()
#  - main.dart: تهيئة sqflite_common_ffi على Desktop
#  - pubspec.yaml: sqflite_common_ffi كـ dependency (ليس dev فقط)

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main, marina, refactor/performance-fixes-v2]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-windows-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-windows-release.yml'
  workflow_dispatch:

jobs:
  windows-build:
    name: 🪟 Build Windows Release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 🔧 Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Generate code (build_runner)
        run: dart run build_runner build

      - name: 🔍 Static analysis
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run focused tests
        run: flutter test test/auth_login_test.dart

      - name: 🔨 Build Windows Release
        run: flutter build windows --release

      - name: 📦 Archive Windows build
        run: |
          # إنشاء ZIP archive من مجلد build
          cd build/windows/x64/runner/Release
          7z a -tzip windows-release.zip *
          mv windows-release.zip ../../../../../

      - name: 📤 Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: mobile/windows-release.zip
          retention-days: 14

      - name: 📋 Build summary
        if: always()
        run: |
          echo "## 🪟 Windows Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | Release |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Windows x64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter | 3.44.9 |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifact" >> $GITHUB_STEP_SUMMARY
          echo "- **Name**: windows-release.zip" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention**: 14 days" >> $GITHUB_STEP_SUMMARY
          echo "- **Contents**: .exe + DLLs + assets" >> $GITHUB_STEP_SUMMARY

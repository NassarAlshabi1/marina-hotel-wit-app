# Name: Build Flutter Staging APK
#
# This workflow is triggered manually via the 'workflow_dispatch' event for staging builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Build Flutter Staging APK

on:
  # Allows manual triggering of the workflow from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-staging-apk:
    # Runs the job on the latest Ubuntu runner
    runs-on: ubuntu-latest
    defaults:
      run:
        # All commands will execute from the 'mobile' directory
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: Verify Android Signing Files
        # Local keystore and key.properties are committed to repo
        # No secrets or base64 decoding needed
        run: |
          echo "Verifying local signing files..."
          ls -la android/app/staging.keystore
          ls -la android/key.properties
          echo "Local signing files verified successfully."

      - name: Clean build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (e.g., using Freezed, json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build staging APK
        # Uses unified keystore with consistent SHA-1: 67:12:57:A2:9B:53:FA:71:AC:BC:0F:A8:C9:54:2F:3F:46:0B:A8:1C
        run: >
          flutter build apk --release
          --dart-define=BASE_API_URL=http://hotelmarina.com/MARINA_HOTEL_PORTABLE/api/v1
          --dart-define=AGENT_ROUTER_API_KEY=${{ secrets.AGENTROUTER_API_KEY }}
          --dart-define=AGENT_ROUTER_BASE_URL=https://openrouter.ai/api/v1

      - name: Upload staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'marina-hotel-staging-${{ github.run_number }}'
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Staging files persist for debugging/reuse - no cleanup

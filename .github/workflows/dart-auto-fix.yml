name: Flutter Auto Fix

on:
  # يعمل على pull requests التي تؤثر على أي ملفات Flutter
  pull_request:
    paths:
      - 'mobile/**/*.dart'
      - 'mobile/pubspec.yaml'
      - 'mobile/analysis_options.yaml'
      - '**/*.dart'
  # يمكن تشغيله يدوياً
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to apply fixes to (leave empty for current branch)'
        required: false
        type: string
      target_directory:
        description: 'Target directory (default: mobile)'
        required: false
        default: 'mobile'
        type: string

jobs:
  flutter-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the head ref for PRs, or the branch specified in workflow_dispatch
          ref: ${{ github.event.pull_request.head.ref || github.event.inputs.branch || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          cache: true

      - name: Detect Flutter projects
        id: detect
        run: |
          echo "Detecting Flutter/Dart projects..."
          PROJECTS=$(find . -name "pubspec.yaml" -not -path "*/.*" -not -path "*/build/*" | sed 's|/pubspec.yaml||' | tr '\n' ' ')
          echo "projects=$PROJECTS" >> $GITHUB_OUTPUT
          echo "Found projects: $PROJECTS"

      - name: Get dependencies for all projects
        run: |
          for PROJECT in ${{ steps.detect.outputs.projects }}; do
            if [ -f "$PROJECT/pubspec.yaml" ]; then
              echo "📦 Getting dependencies for $PROJECT..."
              cd "$PROJECT"
              flutter pub get || dart pub get || true
              cd - > /dev/null
            fi
          done

      - name: Check for fixable issues (dry run)
        id: check-fixes
        run: |
          echo "Running dart fix --dry-run on all projects..."
          TOTAL_FIXES=0
          FIXES_DETAILS=""
          
          for PROJECT in ${{ steps.detect.outputs.projects }}; do
            if [ -f "$PROJECT/pubspec.yaml" ]; then
              echo "🔍 Checking $PROJECT..."
              cd "$PROJECT"
              
              FIXES_OUTPUT=$(dart fix --dry-run 2>&1 || true)
              echo "$FIXES_OUTPUT"
              
              if echo "$FIXES_OUTPUT" | grep -q "proposed fixes"; then
                PROJECT_FIXES=$(echo "$FIXES_OUTPUT" | grep -oP '^\d+(?= proposed fixes)' | head -1)
                TOTAL_FIXES=$((TOTAL_FIXES + PROJECT_FIXES))
                FIXES_DETAILS="${FIXES_DETAILS}${PROJECT}: ${PROJECT_FIXES} fixes\n"
                echo "✅ Found $PROJECT_FIXES fixable issues in $PROJECT"
              fi
              
              cd - > /dev/null
            fi
          done
          
          if [ $TOTAL_FIXES -gt 0 ]; then
            echo "fixes_available=true" >> $GITHUB_OUTPUT
            echo "fixes_count=$TOTAL_FIXES" >> $GITHUB_OUTPUT
            echo -e "fixes_details<<EOF" >> $GITHUB_OUTPUT
            echo -e "$FIXES_DETAILS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "✅ Total: $TOTAL_FIXES fixable issues across all projects"
          else
            echo "fixes_available=false" >> $GITHUB_OUTPUT
            echo "fixes_count=0" >> $GITHUB_OUTPUT
            echo "✅ No fixable issues found in any project"
          fi

      - name: Apply dart fixes to all projects
        if: steps.check-fixes.outputs.fixes_available == 'true'
        run: |
          echo "Applying dart fixes to all projects..."
          for PROJECT in ${{ steps.detect.outputs.projects }}; do
            if [ -f "$PROJECT/pubspec.yaml" ]; then
              echo "🔧 Fixing $PROJECT..."
              cd "$PROJECT"
              dart fix --apply
              cd - > /dev/null
            fi
          done
          echo "✅ Fixes applied successfully to all projects"

      - name: Check for changes
        if: steps.check-fixes.outputs.fixes_available == 'true'
        id: check-changes
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected after applying fixes"
            git status -s
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ No changes after applying fixes"
          fi

      - name: Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # إضافة جميع التغييرات في مشاريع Flutter
          for PROJECT in ${{ steps.detect.outputs.projects }}; do
            git add "$PROJECT/" || true
          done
          
          # إنشاء رسالة commit مفصلة
          COMMIT_MSG="chore: apply automatic dart fixes to all Flutter projects

Applied fixes via dart fix --apply
Fixed ${{ steps.check-fixes.outputs.fixes_count }} issue(s) across all projects

Projects affected:
${{ steps.check-fixes.outputs.fixes_details }}

Co-authored-by: GitHub Actions <github-actions[bot]@users.noreply.github.com>"
          
          git commit -m "$COMMIT_MSG"
          
          # Push التغييرات
          git push

      - name: Comment on PR
        if: |
          github.event_name == 'pull_request' && 
          steps.check-changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fixesCount = '${{ steps.check-fixes.outputs.fixes_count }}';
            const fixesDetails = `${{ steps.check-fixes.outputs.fixes_details }}`;
            const projects = '${{ steps.detect.outputs.projects }}';
            
            const body = `## 🔧 Flutter Auto Fix Applied

تم تطبيق إصلاحات Dart التلقائية بنجاح على جميع مشاريع Flutter!

✅ **عدد الإصلاحات المطبقة:** ${fixesCount}

### 📊 التفاصيل
\`\`\`
${fixesDetails || 'All projects fixed'}
\`\`\`

### 📁 المشاريع المتأثرة
${projects.split(' ').map(p => \`- \\\`${p}\\\`\`).join('\n')}

التغييرات تم رفعها تلقائياً إلى هذا الفرع. يرجى مراجعة التغييرات.

---
*تم التطبيق تلقائياً بواسطة GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Summary
        if: always()
        run: |
          echo "## Flutter Fix Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ steps.check-fixes.outputs.fixes_available }}" == "true" ]]; then
            echo "✅ **Fixes Found:** ${{ steps.check-fixes.outputs.fixes_count }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Projects:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.check-fixes.outputs.fixes_details }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [[ "${{ steps.check-changes.outputs.has_changes }}" == "true" ]]; then
              echo "✅ **Status:** Fixes applied and committed" >> $GITHUB_STEP_SUMMARY
            else
              echo "ℹ️ **Status:** Fixes applied but no file changes" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "✅ **Status:** No fixable issues found in any project" >> $GITHUB_STEP_SUMMARY
          fi

# ════════════════════════════════════════════════════════════════════════════
#  Marina Hotel — Patrol Integration Tests (Android Emulator)
#  ════════════════════════════════════════════════════════════════════════════
#
#  يحل محل android-emulator.yml القديم. الفروق الجوهرية:
#
#  2. يستخدم Patrol 4.7.1 (patrolTest + $ custom finders) بدلاً من
#     integration_test العادي. هذا يوفِّر:
#       - Native automation (permissions, notifications, WebView, share sheet)
#       - Custom finders أسرع وأوضح ($(Key).tap() بدلاً من tester.tap(find...))
#       - Hot Restart أثناء التطوير المحلي
#
#  2. يشغّل كل ملف اختبار بشكل مستقل لتقليل تلوث الحالة بين مجموعات الاختبار
#     وتحديد الملف الذي يسبب أي crash في Instrumentation.
#
#  3. يجمع تشخيصات Android عند الفشل بدلاً من الاكتفاء برسالة Gradle العامة.
#
#  4. AVD caching يبقى كما هو مع تعطيل تحميل snapshot غير الموثوق.
#
#  المرجع: https://patrol.leancode.co/documentation
# ════════════════════════════════════════════════════════════════════════════

name: Patrol Integration Tests

concurrency:
  group: patrol-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
    branches: [main, marina, 'refactor/**', 'feature/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/patrol-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/patrol-emulator.yml'
  workflow_dispatch: # يسمح بالتشغيل اليدوي من GitHub UI

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  #  Job 1: تشغيل اختبارات Patrol على Android emulator
  # ═════════════════════════════════════════════════════════════════════════
  patrol-test:
    name: Patrol Tests (API ${{ matrix.api-level }} — ${{ matrix.test-file }})
    runs-on: ubuntu-latest
    # 60 دقيقة: تهيئة (~14د) + 3 محاولات × 15د كحد أقصى لكل محاولة.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
        target: [google_apis]
        arch: [x86_64]
        test-file:
          - app_test.dart
          - login_validation_test.dart
          - login_input_test.dart
          - login_password_test.dart
          - login_remember_me_test.dart
          - login_rtl_test.dart
          - booking_payment_test.dart

    defaults:
      run:
        working-directory: mobile

    steps:
      # ─────────────────────────────────────────────────────────────────────
      #  1. Checkout الكود
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      # ─────────────────────────────────────────────────────────────────────
      #  2. تفعيل KVM — ضروري لـ hardware acceleration
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚡ Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ─────────────────────────────────────────────────────────────────────
      #  4. تثبيت Java 17 (مطلوب لـ Android Gradle Plugin 8+)
      # ─────────────────────────────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ─────────────────────────────────────────────────────────────────────
      #  5. تثبيت Flutter 3.44.9 المطابق لإصدار المشروع المحلي وCI الأساسي
      # ─────────────────────────────────────────────────────────────────────
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      # ─────────────────────────────────────────────────────────────────────
      #  6. إعداد ANDROID_HOME — Ubuntu runners لديها Android SDK مثبَّت مسبقاً
      #     في /usr/local/lib/android/sdk. نحتاج فقط تصديره لـ patrol_cli.
      # ─────────────────────────────────────────────────────────────────────
      - name: 🤖 Configure Android SDK
        run: |
          # Ubuntu runners have Android SDK preinstalled here
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # Find sdkmanager (path varies between runner images — could be
          # cmdline-tools/latest/bin or cmdline-tools/<version>/bin)
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            ls -la "$ANDROID_HOME/cmdline-tools/" || true
            exit 1
          fi
          echo "Found sdkmanager: $SDKMANAGER"
          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "$SDKMANAGER_DIR" >> $GITHUB_PATH
          "$SDKMANAGER" --version

      # ─────────────────────────────────────────────────────────────────────
      #  7. تثبيت patrol_cli المتوافق مع patrol runtime 4.7.1
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔧 Install patrol_cli
        run: dart pub global activate patrol_cli 4.6.1

      - name: 🩺 Patrol doctor
        # فحص مانع: لا ينبغي إخفاء نقص Android SDK أو adb في بيئة المحاكي.
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          PATROL_ANALYTICS_ENABLED=false patrol doctor

      # ─────────────────────────────────────────────────────────────────────
      #  8. تثبيت dependencies
      # ─────────────────────────────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: flutter pub get

      # ─────────────────────────────────────────────────────────────────────
      #  9. توليد ملفات drift/freezed اللازمة قبل البناء
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔧 Generate build_runner files
        run: dart run build_runner build --delete-conflicting-outputs

      # ─────────────────────────────────────────────────────────────────────
      #  10. AVD cache — يُسرِّع الـ runs القادمة بشكل كبير
      # ─────────────────────────────────────────────────────────────────────
      - name: 💾 AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-patrol-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}-v1

      # ─────────────────────────────────────────────────────────────────────
      #  11. تشغيل الاختبارات على الـ emulator
      #      patrol test يبني الـ APK ويُشغِّل الاختبارات في خطوة واحدة.
      #      نستخدم cold-boot لتفادي مشاكل snapshot corruption.
      # ─────────────────────────────────────────────────────────────────────
      - name: 🧪 Run Patrol tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-snapshot-load
          disable-animations: true
          script: |
            # android-emulator-runner passes the script to /usr/bin/sh -c.
            # ملاحظة (2026-08-31): لوحظ انهيار بنية تحتية متقطع —
            # "[EmulatorConsole]: Failed to start Emulator console" يتبعه
            # تجمّد Gradle بلا مخرجات حتى ضرب مهلة الـ job (run 33436036654:
            # علِق 31 دقيقة في :app:assembleDebugAndroidTest). نفس الكود
            # ينجح في بقية jobs الـ matrix وعادةً ما يكفي إعادة المحاولة.
            # إعادة محاولة محدودة (3 × 15د) مع إعادة ضبط adb بين المحاولات.
            cd "${{ github.workspace }}/mobile"
            export PATH="$HOME/.pub-cache/bin:$PATH"
            max_attempts=3
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "::group::🧪 Patrol attempt ${attempt}/${max_attempts} — ${{ matrix.test-file }}"
              adb kill-server >/dev/null 2>&1 || true
              adb start-server >/dev/null 2>&1 || true
              adb wait-for-device || true
              if timeout 900 env PATROL_ANALYTICS_ENABLED=false patrol test --target "integration_test/${{ matrix.test-file }}" --exclude-tags skip-ci --verbose; then
                echo "::endgroup::"
                exit 0
              fi
              status=$?
              echo "::endgroup::"
              echo "⚠️ Patrol attempt ${attempt} failed (exit ${status})."
              attempt=$((attempt + 1))
              if [ "$attempt" -le "$max_attempts" ]; then
                echo "إعادة المحاولة بعد 20 ثانية..."
                sleep 20
              fi
            done
            echo "::error::Patrol tests failed after ${max_attempts} attempts"
            exit 1

      # ─────────────────────────────────────────────────────────────────────
      #  12. جمع تشخيصات Android عند انهيار Instrumentation.
      #      logcat المفلتر وdumpsys يحددان هل انهارت عملية التطبيق أو
      #      test runner أو المحاكي، بدلاً من الاكتفاء برسالة Gradle العامة.
      # ─────────────────────────────────────────────────────────────────────
      - name: 🧾 Collect Android diagnostics on failure
        if: failure()
        working-directory: mobile
        run: |
          mkdir -p build/patrol-diagnostics
          timeout 30s adb logcat -d -b all -v threadtime -t 1000 \
            | grep -E 'com\\.aden\\.marina|AndroidRuntime|ActivityTaskManager|FATAL EXCEPTION' \
            > build/patrol-diagnostics/logcat-filtered.txt || true
          timeout 30s adb shell dumpsys activity activities \
            > build/patrol-diagnostics/dumpsys-activity.txt || true
          timeout 30s adb shell dumpsys package com.aden.marina \
            > build/patrol-diagnostics/dumpsys-package.txt || true
          timeout 30s adb shell ps -A \
            > build/patrol-diagnostics/process-list.txt || true
          timeout 30s find build/app/outputs/androidTest-results build/app/reports/androidTests \
            -type f -maxdepth 8 -print 2>/dev/null \
            > build/patrol-diagnostics/test-result-files.txt || true

      # ─────────────────────────────────────────────────────────────────────
      #  13. رفع تقارير الاختبار كـ artifact (في حال الفشل)
      # ─────────────────────────────────────────────────────────────────────
      - name: 📊 Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: patrol-test-results-${{ matrix.test-file }}-api-${{ matrix.api-level }}
          path: |
            mobile/build/patrol-diagnostics/
            mobile/build/app/outputs/androidTest-results/connected/debug/**/*.xml
            mobile/build/app/reports/androidTests/connected/debug/**/*.xml
            mobile/patrol_test/test_bundle.dart
          retention-days: 7
          if-no-files-found: ignore

      # ─────────────────────────────────────────────────────────────────────
      #  14. ملخّص في PR — يعرض نتيجة الاختبارات
      # ─────────────────────────────────────────────────────────────────────
      - name: ✅ Report success
        if: success()
        run: |
          echo "### ✅ Patrol Integration Tests — نجحت" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API level:** ${{ matrix.api-level }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AVD cached:** ${{ steps.avd-cache.outputs.cache-hit == 'true' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test file:** ${{ matrix.test-file }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Patrol CLI:** 4.6.1 (compatible with runtime 4.7.1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Patrol runtime:** 4.7.1" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Report failure
        if: failure()
        run: |
          echo "### ❌ Patrol Integration Tests — فشلت" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "تحقق من الـ logs أعلاه. الأسباب الشائعة:" >> $GITHUB_STEP_SUMMARY
          echo "- الـ emulator فشل في البدء (KVM غير مفعَّل)" >> $GITHUB_STEP_SUMMARY
          echo "- مشكلة في Patrol setup (patrol doctor)" >> $GITHUB_STEP_SUMMARY
          echo "- اختبار يحاول الاتصال بـ Firebase/Appwrite الحقيقي" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "لإعادة التشغيل: Actions → Re-run failed jobs" >> $GITHUB_STEP_SUMMARY

  # ═════════════════════════════════════════════════════════════════════════
  #  Job 2: فحص جاهزية اختبارات Patrol (سريع — بدون emulator)
  # ═════════════════════════════════════════════════════════════════════════
  patrol-syntax-check:
    name: Patrol Test Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Verify integration test files compile
        run: |
          echo "=== فحص أن ملفات integration_test تُترجم بدون أخطاء ==="
          flutter analyze integration_test/ --no-fatal-infos --no-fatal-warnings

      - name: 📊 List integration test files
        run: |
          echo "=== ملفات integration_test الموجودة ==="
          ls -la integration_test/
          echo ""
          echo "=== عدد اختبارات patrolTest ==="
          grep -r "patrolTest(" integration_test/ | wc -l

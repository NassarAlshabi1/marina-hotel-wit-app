# مؤقّت: ينشر خرج flutter analyze في الفرع (سجلات Actions غير قابلة للتنزيل هنا).
name: Analyze Diagnostic

on:
  push:
    paths:
      - '.github/analyze-request'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/an.txt 2>&1
          echo "EXIT=$?" >> /tmp/an.txt
          grep -E "error •|Error:|EXIT=" /tmp/an.txt | head -n 200 > diag-analyze-output.txt
          tail -c 20000 /tmp/an.txt >> diag-analyze-output.txt
      - name: Publish
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add -f diag-analyze-output.txt
          git diff --cached --quiet || {
            git commit -m "diag: analyze output [skip ci]"
            git push
          }

name: Android Kotlin Build

# Builds the Kotlin + Jetpack Compose port of the Marina Hotel app
# (mobile/android) — runs unit tests and produces signed release/debug APKs.
on:
  push:
    branches:
      - agent/wave-cloud-bi9f
    paths:
      - 'mobile/android/**'
      - 'mobile/Keystore.txt'
      - '.github/workflows/android-kotlin-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-kotlin-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Marina Hotel APK (Kotlin + Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # The JKS keystore is git-ignored by convention; restore it from the
      # base64 payload tracked in mobile/Keystore.txt so CI signs with the
      # exact same key as local builds (SHA-256 pinned below).
      - name: Restore signing keystore
        working-directory: .
        run: |
          grep -oP '(?<=KEYSTORE_BASE64: )[A-Za-z0-9+/=]+' mobile/Keystore.txt \
            | base64 -d > mobile/android/app/marina-hotel-key.jks
          sha256sum mobile/android/app/marina-hotel-key.jks
          # Expected: 4f6e5c58abc68e20f842c868060d515fe2d64d4964572d17ecf9ac04bb7fb865
          echo "4f6e5c58abc68e20f842c868060d515fe2d64d4964572d17ecf9ac04bb7fb865  mobile/android/app/marina-hotel-key.jks" | sha256sum -c -

      # ubuntu-latest ships cmdline-tools (e.g. .../cmdline-tools/16.0/bin)
      # but NOT on PATH, and android-actions/setup-android@v3 currently fails
      # trying to install the retired 'tools' package. Resolve sdkmanager by
      # full path; if unavailable, fall back to AGP's auto-install (runner
      # images ship pre-accepted SDK licenses, so AGP can self-serve).
      - name: Ensure Android SDK components
        run: |
          set -x
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            echo "sdkmanager at: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;34.0.0" > /dev/null || true
          else
            echo "sdkmanager not found — relying on AGP auto-install"
          fi
          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- installed build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Run unit tests (financial + hotel-day engine)
        run: ./gradlew testDebugUnitTest --console=plain

      # If any task fails, dump the exact resource/manifest intermediates so
      # failures are diagnosable from the log alone (runners are ephemeral).
      - name: Dump resource intermediates on failure
        if: failure()
        run: |
          echo "=== merged values.xml (first 60 lines) ==="
          find mobile/build/app/intermediates -path "*mergeDebugResources/merged.dir/values/values.xml" \
            -exec head -60 {} \; 2>/dev/null || echo "not found"
          echo "=== processed manifest ==="
          find mobile/build/app/intermediates -name "AndroidManifest.xml" \
            -path "*ManifestForPackage*" -exec head -20 {} \; 2>/dev/null || echo "not found"
          echo "=== merged res flat files ==="
          find mobile/build/app/intermediates -name "*.flat" -path "*bug*" 2>/dev/null | head -20

      - name: Build signed release APK (v1+v2+v3)
        run: ./gradlew assembleRelease --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Verify APK signature schemes
        working-directory: .
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK="mobile/build/app/outputs/apk/release/app-release.apk"
          "$BT/apksigner" verify --verbose --min-sdk-version 23 "$APK" | head -8
          "$BT/zipalign" -c 4 "$APK" && echo "zipalign OK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marina-hotel-release-apk
          path: mobile/build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marina-hotel-debug-apk
          path: mobile/build/app/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

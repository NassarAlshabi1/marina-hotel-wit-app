# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Marina Hotel — Security & Malware Scanning
#  Multi-layer defense-in-depth pipeline:
#    1. CodeQL SAST           — semantic code analysis (PHP + JS)
#    2. Semgrep               — multi-language SAST + supply-chain rules
#    3. Trivy                 — filesystem scan + misconfig + secrets
#    4. Syft + Grype          — SBOM generation + known CVE matching
#    5. npm audit             — Node.js dependency advisories
#    6. pub security check    — Flutter/Dart package advisories
#    7. PHP vulnerability check (psalm + security-checker)
#    8. GitHub Security Advisory integration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
name: Security & Malware Scan

on:
  push:
    branches:
      - main
      - marina
      - refactor/clean-v2
      - '**'
    paths:
      - '**.php'
      - '**.dart'
      - '**.js'
      - '**.ts'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**/package.json'
      - 'scripts/**/package-lock.json'
      - '.github/workflows/security-scan.yml'
      - '.github/dependabot.yml'
  pull_request:
    branches:
      - main
      - marina
      - refactor/clean-v2
  schedule:
    # Run full scan every day at 02:30 Asia/Aden (23:30 UTC)
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # Required to upload SARIF to GitHub Security tab
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════
  # 1) CodeQL — semantic SAST for PHP & JavaScript
  # ═══════════════════════════════════════════════════════════
  codeql:
    name: CodeQL Analysis (PHP/JS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@v3
        continue-on-error: true
        with:
          languages: javascript, php
          queries: security-and-quality

      - name: Skip remaining CodeQL steps if init failed
        if: steps.init.outcome != 'success'
        run: |
          echo "::warning::CodeQL init failed — likely CodeQL is not enabled on this repo."
          echo "::warning::Enable it in Settings → Security & analysis → CodeQL analysis."
          echo "Skipping Autobuild and Analyze steps."

      - name: Autobuild
        if: steps.init.outcome == 'success'
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis
        if: steps.init.outcome == 'success'
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:javascript"
          output: sarif-results/codeql-js.sarif

  # ═══════════════════════════════════════════════════════════
  # 2) Semgrep — multi-language SAST + supply-chain detection
  # ═══════════════════════════════════════════════════════════
  semgrep:
    name: Semgrep SAST + Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pip install semgrep

      - name: Semgrep scan
        run: |
          set -euo pipefail
          mkdir -p sarif-results
          # Run with:
          #   - security-audit (default ruleset)
          #   - supply-chain  (malicious package patterns)
          #   - php-lang      (PHP-specific rules)
          #   - flutter       (Dart/Flutter rules from community)
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/supply-chain \
            --config=p/php \
            --config=p/javascript \
            --config=p/owasp-top-ten \
            --config=p/sql-injection \
            --config=p/command-injection \
            --config=p/xss \
            --config=p/secrets \
            --error \
            --json --output=semgrep-report.json \
            --sarif --output=sarif-results/semgrep.sarif \
            . || {
              echo "::warning::Semgrep found findings; see SARIF report"
              # Don't fail the workflow on findings — they go to GitHub Security
              exit 0
            }

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/semgrep.sarif
          wait-for-processing: true
        continue-on-error: true  # Don't fail workflow if SARIF upload fails (rate limits, permissions)

      - name: Upload Semgrep JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # 3) Trivy — filesystem + misconfig + secrets + malware scan
  # ═══════════════════════════════════════════════════════════
  trivy:
    name: Trivy Filesystem & Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Trivy
        run: |
          # Install Trivy binary directly (avoids aquasecurity/trivy-action
          # setup issues — the action's container-based setup fails on
          # public repos without GHCR auth).
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy
          trivy --version

      - name: Trivy — Filesystem scan (vulns + secrets)
        continue-on-error: true
        run: |
          mkdir -p sarif-results
          trivy fs --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output sarif-results/trivy-fs.sarif \
            --limit-severities-for-sarif .

      - name: Trivy — Misconfiguration scan (IaC + Dockerfile + workflows)
        continue-on-error: true
        run: |
          trivy fs --exit-code 0 --scanners misconfig \
            --format sarif --output sarif-results/trivy-misconfig.sarif \
            .

      - name: Trivy — License scan
        continue-on-error: true
        run: |
          trivy fs --exit-code 0 --scanners license \
            --format table --output trivy-licenses.txt \
            . || echo "License scan completed with warnings"

      - name: Upload Trivy SARIF (filesystem)
        if: always() && hashFiles('sarif-results/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/trivy-fs.sarif
          wait-for-processing: true
        continue-on-error: true

      - name: Upload Trivy SARIF (misconfig)
        if: always() && hashFiles('sarif-results/trivy-misconfig.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/trivy-misconfig.sarif
          wait-for-processing: true
        continue-on-error: true

      - name: Upload Trivy license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-licenses
          path: trivy-licenses.txt
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # 4) Syft — SBOM generation + Grype — vulnerability matching
  # ═══════════════════════════════════════════════════════════
  sbom-grype:
    name: SBOM (Syft) + CVE Matching (Grype)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-result: true

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v5
        with:
          sbom: sbom.spdx.json
          format: sarif
          output: sarif-results/grype.sarif
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype SARIF
        if: always() && hashFiles('sarif-results/grype.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/grype.sarif
          wait-for-processing: true
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════
  # 5) npm audit — Node.js advisories
  # ═══════════════════════════════════════════════════════════
  npm-audit:
    name: npm audit (root + scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm audit — root
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "Running npm audit on root..."
            npm audit --omit=dev --audit-level=high --json > npm-audit-root.json || true
            # Pretty summary
            npm audit --omit=dev --audit-level=high || true
          else
            echo "::notice::No root package-lock.json — skipping"
          fi

      - name: npm audit — scripts/
        run: |
          set -euo pipefail
          if [ -f scripts/package-lock.json ]; then
            echo "Running npm audit on scripts/..."
            cd scripts
            npm audit --omit=dev --audit-level=high --json > ../npm-audit-scripts.json || true
            cd ..
          else
            echo "::notice::No scripts/package-lock.json — skipping"
          fi

      - name: npm audit — scripts/appwrite/
        run: |
          set -euo pipefail
          if [ -f scripts/appwrite/package-lock.json ]; then
            echo "Running npm audit on scripts/appwrite/..."
            cd scripts/appwrite
            npm audit --omit=dev --audit-level=high --json > ../../npm-audit-appwrite.json || true
            cd ../..
          else
            echo "::notice::No scripts/appwrite/package-lock.json — skipping"
          fi

      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            npm-audit-root.json
            npm-audit-scripts.json
            npm-audit-appwrite.json
          if-no-files-found: ignore
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # 6) Flutter/Dart — pub.dev advisories + discontinued detection
  # ═══════════════════════════════════════════════════════════
  pub-security:
    name: Flutter/Dart pub.dev advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter pub outdated (captures discontinued packages)
        # `flutter pub outdated` is the official Dart tool that surfaces
        # 'discontinued' packages — these no longer receive security patches.
        run: |
          set -euo pipefail
          flutter pub outdated > ../pub-outdated.txt 2>&1 || true
          cat ../pub-outdated.txt

      - name: Scan pub.dev advisories API for all locked packages
        # NOTE: `dart pub audit` does NOT exist as of Dart 3.9.
        # The official security advisories live at pub.dev/api/packages/<pkg>
        # under the `advisories` and `isDiscontinued` fields.
        # This script iterates pubspec.lock and queries each package.
        run: |
          set -euo pipefail
          python3 - <<'PYEOF' > ../pub-security-report.json
          import json, urllib.request, time, sys, yaml

          with open('pubspec.lock') as f:
              lock = yaml.safe_load(f)
          packages = lock.get('packages', {})

          findings = {
              'scanned_at': __import__('datetime').datetime.utcnow().isoformat() + 'Z',
              'total_packages': len(packages),
              'discontinued': [],
              'advisories': [],
              'errors': [],
          }

          for i, (name, info) in enumerate(packages.items()):
              try:
                  url = f'https://pub.dev/api/packages/{name}'
                  req = urllib.request.Request(url, headers={'Accept': 'application/json'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data = json.loads(r.read())
                  if data.get('isDiscontinued', False):
                      findings['discontinued'].append({
                          'package': name,
                          'installed_version': info.get('version', '?'),
                          'latest_version': data.get('latest', {}).get('version', '?'),
                      })
                  advs = data.get('advisories', []) or []
                  for a in advs:
                      findings['advisories'].append({
                          'package': name,
                          'installed_version': info.get('version', '?'),
                          'advisory_id': a.get('id', '?'),
                          'summary': a.get('summary', ''),
                          'affected_versions': a.get('affected_versions', ''),
                          'fixed_version': a.get('fixed_version', ''),
                          'published': a.get('published', ''),
                      })
                  # Be gentle with pub.dev (avoid rate limits)
                  time.sleep(0.1)
              except Exception as e:
                  findings['errors'].append({'package': name, 'error': str(e)})

          print(json.dumps(findings, indent=2))
          PYEOF
          cat ../pub-security-report.json

      - name: Build SARIF for pub.dev findings
        # Convert discontinued + advisories into SARIF so they appear in
        # GitHub Security tab alongside CodeQL/Semgrep/Trivy findings.
        run: |
          set -euo pipefail
          mkdir -p ../sarif-results
          python3 - <<'PYEOF' > ../sarif-results/pub-security.sarif
          import json
          with open('../pub-security-report.json') as f:
              data = json.load(f)

          results = []
          for d in data.get('discontinued', []):
              results.append({
                  'ruleId': 'pub-discontinued',
                  'level': 'warning',
                  'message': {
                      'text': f"Package '{d['package']}' is DISCONTINUED — "
                              f"installed {d['installed_version']}, latest {d['latest_version']}. "
                              f"Discontinued packages receive no security patches."
                  },
                  'locations': [{
                      'physicalLocation': {
                          'artifactLocation': {'uri': 'mobile/pubspec.lock'}
                      }
                  }],
                  'partialFingerprints': {'primaryLocationLineHash': d['package']},
              })
          for a in data.get('advisories', []):
              results.append({
                  'ruleId': 'pub-advisory',
                  'level': 'error',
                  'message': {
                      'text': f"{a['advisory_id']} on '{a['package']}' "
                              f"({a['installed_version']}): {a['summary']}"
                  },
                  'locations': [{
                      'physicalLocation': {
                          'artifactLocation': {'uri': 'mobile/pubspec.lock'}
                      }
                  }],
              })

          sarif = {
              '$schema': 'https://docs.oasis-open.org/sarif/sarif/v2.1.0/cos02/schemas/sarif-schema-2.1.0.json',
              'version': '2.1.0',
              'runs': [{
                  'tool': {
                      'driver': {
                          'name': 'pub.dev advisories',
                          'informationUri': 'https://pub.dev/security-advisories',
                          'rules': [
                              {'id': 'pub-discontinued', 'name': 'DiscontinuedPackage',
                               'shortDescription': {'text': 'Package marked discontinued on pub.dev'}},
                              {'id': 'pub-advisory', 'name': 'PubSecurityAdvisory',
                               'shortDescription': {'text': 'Security advisory published on pub.dev'}},
                          ]
                      }
                  },
                  'results': results,
              }]
          }
          print(json.dumps(sarif, indent=2))
          PYEOF

      - name: Upload pub security SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/pub-security.sarif
          wait-for-processing: true

      - name: Upload pub security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-security-report
          path: |
            pub-security-report.json
            pub-outdated.txt
          if-no-files-found: ignore
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # 7) PHP — security checker (sensiolabs) + Psalm SAST
  # ═══════════════════════════════════════════════════════════
  php-security:
    name: PHP security (sensiolabs + Psalm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2, psalm

      - name: Install local PHP security checker
        run: |
          set -euo pipefail
          # Use the Enlightn/local-security-checker — no composer.json required
          curl -L https://github.com/enlightn/local-security-checker/releases/latest/download/local-security-checker.phar \
            -o /usr/local/bin/local-security-checker
          chmod +x /usr/local/bin/local-security-checker

      - name: Run local PHP security checker
        # Scans composer.lock if present; if not, scans require statements in PHP files
        run: |
          set -euo pipefail
          mkdir -p sarif-results
          if [ -f composer.lock ]; then
            local-security-checker --path=. --format=json > php-security.json || true
          else
            echo "::notice::No composer.lock found — scanning PHP source for known-vulnerable patterns with Psalm"
            echo '{"skipped":true,"reason":"no composer.lock"}' > php-security.json
          fi

      - name: Run Psalm (taint analysis)
        # Psalm taint analysis detects SQL injection, XSS, path traversal, etc.
        run: |
          set -euo pipefail
          if [ -f psalm.xml ]; then
            psalm --taint-analysis --output-format=sarif --report-file=sarif-results/psalm.sarif || true
          else
            echo "::notice::No psalm.xml config — skipping Psalm taint analysis"
            echo '{"skipped":true}' > psalm-report.json
          fi

      - name: Upload Psalm SARIF
        if: always() && hashFiles('sarif-results/psalm.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/psalm.sarif
          wait-for-processing: true

      - name: Upload PHP security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-security-report
          path: |
            php-security.json
            psalm-report.json
          if-no-files-found: ignore
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # 8) Malware / typosquatting / install-script detection
  # ═══════════════════════════════════════════════════════════
  malware-detect:
    name: Malware & Supply-Chain Detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install nodejs / npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install socket-security-cli (package malware & typosquatting)
        run: npm install -g @socketsecurity/cli

      - name: Socket — npm supply-chain scan
        # Detects: install scripts, typosquatting, hidden installs, network access
        run: |
          set -euo pipefail
          for lockfile in package-lock.json scripts/package-lock.json scripts/appwrite/package-lock.json; do
            if [ -f "$lockfile" ]; then
              echo "=== Scanning $lockfile ==="
              socket scan "$lockfile" --json > "socket-$(echo $lockfile | tr '/' '_').json" || true
            fi
          done

      - name: Install & run pip-audit (for any python scripts in repo)
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip-audit 2>&1 | tail -3
          # Scan requirements.txt files if any
          find . -maxdepth 3 -name "requirements*.txt" -print0 | while IFS= read -r -d '' f; do
            echo "=== pip-audit on $f ==="
            pip-audit -r "$f" -f json -o "pip-audit-$(basename $f .txt).json" || true
          done
          echo "::notice::pip-audit complete (if no requirements.txt files, no scans ran)"

      - name: Custom malware heuristic — scan for suspicious patterns
        # Catches: base64-encoded evals, suspicious domains, exec from network
        run: |
          set -euo pipefail
          mkdir -p malware-heuristics
          # Patterns commonly used by malware in PHP/JS code:
          #   - eval(base64_decode(...))
          #   - gzinflate(base64_decode(...))
          #   - system/exec/shell_exec with user input
          #   - eval() with variable args
          #   - file_get_contents from suspicious TLDs (.cn, .ru, .su)
          #   - $_POST/$_GET passed to eval/system
          #   - @\$_\[\$_\] pattern (web shell signature)
          echo "=== Scanning PHP files for malware signatures ==="
          {
            echo "# Malware Heuristic Report — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Suspicious PHP patterns"
            rg --no-heading --line-number --type php \
              -e 'eval\s*\(\s*(base64_decode|gzinflate|str_rot13|gzuncompress)' \
              -e '\$\{.*\}\s*\(' \
              -e 'assert\s*\(\s*["\x27].*['"'"'"]\s*\)' \
              -e '@?\$_\[(?:POST|GET|REQUEST|COOKIE)\]\s*\[' \
              -e 'system\s*\(\s*\$_' \
              -e 'shell_exec\s*\(\s*\$_' \
              -e 'passthru\s*\(\s*\$_' \
              -e 'preg_replace\s*\(\s*["\x27]/[^\n]*e[^\n]*["\x27]' \
              -e 'file_get_contents\s*\(\s*["\x27]https?://[^/]*\.(?:cn|ru|su|tk|ml|ga|cf)/' \
              . 2>/dev/null || true

            echo ""
            echo "## Suspicious JS patterns"
            rg --no-heading --line-number --type js \
              -e 'eval\s*\(\s*atob\s*\(' \
              -e 'new\s+Function\s*\(\s*atob' \
              -e 'document\.write\s*\(\s*["\x27]<script.*src\s*=' \
              -e 'fetch\s*\(\s*["\x27]https?://[^/]*\.(?:cn|ru|su|tk|ml|ga|cf)/' \
              . 2>/dev/null || true

            echo ""
            echo "## Suspicious Dart patterns"
            rg --no-heading --line-number --type dart \
              -e 'HttpClient.*\.cn|HttpClient.*\.ru|HttpClient.*\.su' \
              -e 'Process\.run\s*\(\s*["\x27]/bin/' \
              . 2>/dev/null || true

            echo ""
            echo "## Install-script packages (npm — preinstall/postinstall)"
            for lockfile in package-lock.json scripts/package-lock.json scripts/appwrite/package-lock.json; do
              if [ -f "$lockfile" ]; then
                echo "### $lockfile"
                jq -r '.packages | to_entries[] | select(.value.scripts.preinstall // .value.scripts.postinstall // .value.scripts.install) | "\(.key): \(.value.scripts)"' "$lockfile" 2>/dev/null || true
              fi
            done
          } > malware-heuristics/report.md
          cat malware-heuristics/report.md

      - name: Upload malware heuristic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malware-heuristics
          path: malware-heuristics/
          retention-days: 90

      - name: Upload socket security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socket-security-reports
          path: socket-*.json
          if-no-files-found: ignore
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # 9) Summary — fail the workflow if critical findings exist
  # ═══════════════════════════════════════════════════════════
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [codeql, semgrep, trivy, sbom-grype, npm-audit, pub-security, php-security, malware-detect]
    if: always()
    steps:
      - name: Aggregate job results
        run: |
          set -euo pipefail
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Layer | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL SAST (PHP/JS) | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep SAST + Supply Chain | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Filesystem + Secrets | ${{ needs.trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Syft SBOM + Grype CVEs | ${{ needs.sbom-grype.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter pub security | ${{ needs.pub-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PHP security (Psalm + checker) | ${{ needs.php-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Malware & Supply-Chain | ${{ needs.malware-detect.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Detailed findings appear in the **Security** tab once SARIF files are ingested." >> $GITHUB_STEP_SUMMARY

          # Fail only if a hard scanner (CodeQL/Semgrep/Trivy) failed catastrophically
          for r in "${{ needs.codeql.result }}" "${{ needs.semgrep.result }}" "${{ needs.trivy.result }}"; do
            if [ "$r" = "failure" ]; then
              echo "::error::A critical security scanner failed to run — check logs"
              exit 1
            fi
          done
          echo "::notice::All security scanners completed. See GitHub Security tab for findings."

name: Dart CI

on:
  # Run on PRs and pushes to main and feature branches from main.
  push:
    branches:
      - main
      - 'capy/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: test-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  # انتظار اكتمال Auto-fix أولاً
  wait-for-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Auto-fix workflow
        run: sleep 120
        
  analyze:
    needs: wait-for-autofix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      # سحب آخر التحديثات من Auto-fix
      - name: Pull latest changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }} || true
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - id: install
        name: Install dependencies
        run: flutter pub get
      # تم توليد الكود من قبل Auto-fix workflow
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
      - name: Analyze code
        run: flutter analyze --no-pub --fatal-infos
        if: always() && steps.install.outcome == 'success'

  test:
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - id: install
        name: Install dependencies
        run: flutter pub get
      - name: Run Flutter tests
        run: flutter test
        if: always() && steps.install.outcome == 'success'

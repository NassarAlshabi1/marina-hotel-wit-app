name: Quality

# ═══════════════════════════════════════════════════════════════
#  Marina Hotel — Quality Gate (الموحد)
# ═══════════════════════════════════════════════════════════════
#
#  Pipeline شامل لضمان جودة الكود قبل الدمج.
#
#  المراحل (6):
#  1. Formatting            — dart format --set-exit-if-changed (blocking)
#  2. Static Analysis       — flutter analyze --fatal-infos --fatal-warnings (blocking)
#  3. Code Metrics          — dart_code_metrics (non-blocking)
#  4. Performance Rules     — مُدمجة في analysis_options.yaml (blocking)
#  5. Architecture          — architecture-validator.py (non-blocking)
#  6. Dependency Audit      — dependency-audit.sh (non-blocking)
#
#  أي فشل في المراحل الـ blocking يمنع دمج الـ PR.

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  pull_request:
    branches: [main, marina, 'refactor/**', 'feature/**']
    paths:
      - 'mobile/**'
      - 'scripts/architecture-validator.py'
      - 'scripts/dependency-audit.sh'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ═══════════════════════════════════════════════════════════
      #  Stage 1: Formatting (BLOCKING)
      # ═══════════════════════════════════════════════════════════
      - name: 🎨 Stage 1 — Check formatting
        run: |
          set -e
          find lib test -name "*.dart" \
            ! -name "*.g.dart" \
            ! -name "*.freezed.dart" \
            ! -name "generated_plugin_registrant.dart" \
            -print0 | xargs -0 dart format \
              --line-length 120 \
              --set-exit-if-changed \
              --output=none

      # ═══════════════════════════════════════════════════════════
      #  Stage 2: Static Analysis (BLOCKING)
      # ═══════════════════════════════════════════════════════════
      - name: 🔍 Stage 2 — Static analysis (fatal)
        run: flutter analyze --fatal-infos --fatal-warnings

      # ═══════════════════════════════════════════════════════════
      #  Stage 3: Code Metrics (non-blocking)
      # ═══════════════════════════════════════════════════════════
      - name: 📊 Stage 3 — Code metrics
        run: |
          dart pub global activate dart_code_metrics 5.7.6
          export PATH="$PATH:$HOME/.pub-cache/bin"
          # dart_code_metrics 5.7.6 يقرأ dart_code_metrics.yaml تلقائياً
          # لا يستخدم --config (غير مدعوم في هذا الإصدار)
          metrics analyze lib \
            --reporter=console \
            --root-folder=. \
            || echo "::warning::Code metrics found issues (non-blocking)"
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════
      #  Stage 4: Performance Rules (مُدمجة في Stage 2)
      # ═══════════════════════════════════════════════════════════
      - name: ⚡ Stage 4 — Performance rules
        run: |
          echo "Performance rules enforced via flutter analyze (Stage 2):"
          echo "- avoid_unnecessary_containers"
          echo "- prefer_const_constructors"
          echo "- avoid_returning_widgets"
          echo "- prefer_final_locals"
          echo "All performance rules passed ✅"

      # ═══════════════════════════════════════════════════════════
      #  Stage 5: Architecture Validation (non-blocking)
      # ═══════════════════════════════════════════════════════════
      - name: 🏗️ Stage 5 — Architecture validation
        working-directory: ${{ github.workspace }}
        run: |
          # بدون --strict: warnings لا تُسبب فشل (non-blocking)
          # الـ violations تُعرض كـ info فقط
          python3 scripts/architecture-validator.py \
            --project-root mobile \
            || echo "::warning::Architecture violations found (non-blocking, transitional)"
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════
      #  Stage 6: Dependency Audit (non-blocking)
      # ═══════════════════════════════════════════════════════════
      - name: 📦 Stage 6 — Dependency audit
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/dependency-audit.sh
          bash scripts/dependency-audit.sh mobile false
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════
      #  Summary
      # ═══════════════════════════════════════════════════════════
      - name: 📋 Quality summary
        if: always()
        run: |
          {
            echo "## 🏆 Quality Gate Report"
            echo ""
            echo "| Stage | Status |"
            echo "|---|---|"
            echo "| 🎨 Formatting (blocking) | ${{ job.status }} |"
            echo "| 🔍 Static Analysis (blocking) | ${{ job.status }} |"
            echo "| 📊 Code Metrics | Non-blocking |"
            echo "| ⚡ Performance Rules | Included in Analysis |"
            echo "| 🏗️ Architecture | Non-blocking |"
            echo "| 📦 Dependencies | Non-blocking |"
            echo ""
            echo "**Blocking stages**: Formatting + Static Analysis"
            echo "**Non-blocking** (transitional): Metrics, Architecture, Dependencies"
          } >> "$GITHUB_STEP_SUMMARY"

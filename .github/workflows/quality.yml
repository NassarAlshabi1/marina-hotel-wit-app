name: Enterprise Quality Gate

# ═══════════════════════════════════════════════════════════════
# Marina Hotel — Professional Quality Gate Pipeline
# Manual Run Only
# ═══════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality_gate:
    name: 🛡️ Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 📦 Install Dependencies
        working-directory: mobile
        run: |
          flutter pub get
          npm install -g jscpd

      - name: 🏗️ Run Build Runner
        working-directory: mobile
        run: dart run build_runner build

      - name: 🎨 Check Formatting
        working-directory: mobile
        run: dart format --line-length 120 --set-exit-if-changed lib test || true

      - name: 🔍 Flutter Analyze
        working-directory: mobile
        run: flutter analyze || true

      - name: 🧪 Run Tests & Coverage
        working-directory: mobile
        run: flutter test --coverage || true

      - name: 👯 Find Duplicate Code
        run: |
          mkdir -p reports
          jscpd ./mobile/lib \
            --format dart \
            --reporters json \
            --output ./reports || true

      - name: 🏗️ Architecture Validation
        run: python3 scripts/architecture-validator.py --project-root mobile || true

      - name: 📊 Run Custom Reports
        run: |
          mkdir -p reports
          python3 scripts/performance-report.py mobile/lib || true
          python3 scripts/complexity-report.py mobile/lib || true
          python3 scripts/dead-code-report.py || true
          bash scripts/security-scan.sh mobile/lib || true

      - name: 📝 Generate Quality Dashboard
        run: python3 scripts/quality-summary.py || true

      - name: 📦 Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/

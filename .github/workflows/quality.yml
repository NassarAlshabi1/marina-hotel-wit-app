name: Enterprise Quality Gate

# ═══════════════════════════════════════════════════════════════
# Marina Hotel — Professional Quality Gate Pipeline
# Refactored with Very Good Workflows patterns (VGV)
#
#  يستخدم flutter_ci.yml كـ reusable workflow للتحليل والاختبارات
#  ويضيف فحوصات إضافية في وضع full:
#    - Duplicate code detection (jscpd)
#    - Architecture validation
#    - Custom reports (performance, complexity, dead-code, security)
#    - Quality dashboard generation
#
#  للتشغيل:
#    1. اذهب لـ Actions tab في GitHub
#    2. اختر "Enterprise Quality Gate" workflow
#    3. اضغط "Run workflow"
#    4. اختر الفرع المراد فحصه (default: الحالي)
#    5. اختر مستوى الفحص (full / quick)
# ═══════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      check_level:
        description: 'مستوى الفحص'
        required: true
        type: choice
        default: 'quick'
        options:
          - quick    # فحص سريع: analyze + tests فقط (~5 دقائق)
          - full     # فحص شامل: كل الفحوصات + reports (~15 دقيقة)
      run_tests:
        description: 'تشغيل الاختبارات؟'
        required: false
        type: boolean
        default: true
      upload_reports:
        description: 'رفع التقارير كـ artifact؟'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.check_level || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  Job 1: Flutter CI (reusable — format + analyze + test)
  #  يُستدعى من flutter_ci.yml بمعايير VGV
  # ═══════════════════════════════════════════════════════════════
  flutter-ci:
    name: Flutter CI
    uses: ./.github/workflows/flutter_ci.yml
    with:
      flutter_version: '3.44.4'
      working_directory: 'mobile'
      analyze_directories: 'lib'
      format_directories: 'lib test'
      format_line_length: '120'
      min_coverage: ${{ inputs.check_level == 'full' && 60 || 0 }}
      coverage_excludes: '**/*.g.dart **/*.freezed.dart **/generated_plugin_registrant.dart'
      run_build_runner: false
      run_tests: ${{ inputs.run_tests != false }}
      test_concurrency: 4
      test_timeout: ${{ inputs.check_level == 'full' && '120s' || '60s' }}
      run_benchmarks: ${{ inputs.run_tests != false }}
      java_version: '17'

  # ═══════════════════════════════════════════════════════════════
  #  Job 2: Extended Quality Checks (full mode only)
  #  فحوصات إضافية لا يُغطيها الـ reusable workflow
  # ═══════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════
  #  Job: JavaScript Lint (ESLint)
  #
  #  يعمل على كل push وpull_request — وليس داخل extended-quality
  #  المشروطة بـ check_level == 'full' — حتى يُفحص JS في كل مرة.
  #  يفرض بوابة الأخطاء فقط (eslint --quiet)؛ التحذيرات تبقى مرئية
  #  في الملخص دون أن تكسر البناء، لأن الكود القائم يحتوي 40 تحذيراً.
  # ═══════════════════════════════════════════════════════════════
  js-lint:
    name: 🔎 JavaScript Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📚 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 ESLint (errors gate)
        run: npx eslint . --quiet

      - name: 📊 ESLint (full report, non-blocking)
        if: always()
        run: |
          set -uo pipefail
          npx eslint . --format json --output-file eslint-report.json || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from collections import Counter
          if not os.path.exists('eslint-report.json'):
              print('### 🔎 ESLint\n\nلم يُنتج تقرير.'); raise SystemExit
          data = json.load(open('eslint-report.json'))
          errors = sum(f['errorCount'] for f in data)
          warnings = sum(f['warningCount'] for f in data)
          dirty = [f for f in data if f['errorCount'] or f['warningCount']]
          print('### 🔎 ESLint\n')
          print(f'- ملفات مفحوصة: **{len(data)}**')
          print(f'- ملفات فيها ملاحظات: **{len(dirty)}**')
          print(f'- أخطاء: **{errors}** (بوابة كاسرة)')
          print(f'- تحذيرات: **{warnings}** (غير كاسرة)\n')
          rules = Counter(m.get('ruleId') for f in data for m in f['messages'])
          if rules:
              print('| القاعدة | العدد |')
              print('|---|---|')
              for rule, count in rules.most_common(12):
                  print(f'| `{rule}` | {count} |')
          PY

      - name: 📦 Upload ESLint report
        if: always() && inputs.upload_reports == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eslint-report-${{ github.run_id }}
          path: eslint-report.json
          retention-days: 14
          if-no-files-found: ignore

  extended-quality:
    name: 🛡️ Extended Quality (${{ inputs.check_level || 'quick' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.check_level == 'full' && 15 || 3 }}
    if: inputs.check_level == 'full'
    needs: flutter-ci

    steps:
      - name: 📚 Checkout Code
        uses: actions/checkout@v7.0.1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 📦 Install Tools
        run: npm install -g jscpd

      # ─────────────────────────────────────────────────────────────────────
      #  Full-only: Find Duplicate Code + Architecture Validation + Reports
      # ─────────────────────────────────────────────────────────────────────
      - name: 👯 Find Duplicate Code
        run: |
          mkdir -p reports
          jscpd ./mobile/lib \
            --format dart \
            --reporters json \
            --output ./reports || true

      - name: 🏗️ Architecture Validation
        run: python3 scripts/architecture-validator.py --project-root mobile || true

      - name: 📊 Run Custom Reports
        run: |
          mkdir -p reports
          python3 scripts/performance-report.py mobile/lib || true
          python3 scripts/complexity-report.py mobile/lib || true
          python3 scripts/dead-code-report.py || true
          bash scripts/security-scan.sh mobile/lib || true

      - name: 📝 Generate Quality Dashboard
        run: python3 scripts/quality-summary.py || true

      # ─────────────────────────────────────────────────────────────────────
      #  ملخص النتائج
      # ─────────────────────────────────────────────────────────────────────
      - name: 📊 Extended Quality Summary
        if: always()
        working-directory: mobile
        run: |
          {
            echo "### 🛡️ Extended Quality Gate Results"
            echo ""
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Check level:** \`${{ inputs.check_level || 'quick' }}\`"
            echo ""
            echo "#### إحصائيات الكود"
            PERF_COUNT=$(grep -r "PerformanceInspector" lib/ | wc -l || echo "0")
            SCREENS_COUNT=$(find lib/screens -name "*.dart" | wc -l || echo "0")
            echo "- **PerformanceInspector usages:** $PERF_COUNT"
            echo "- **Total screen files:** $SCREENS_COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

      # ─────────────────────────────────────────────────────────────────────
      #  رفع التقارير (optional)
      # ─────────────────────────────────────────────────────────────────────
      - name: 📦 Upload Reports
        if: always() && inputs.upload_reports == true
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            reports/
          retention-days: 14
          if-no-files-found: ignore

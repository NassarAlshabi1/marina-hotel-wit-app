name: 🔬 Enterprise Quality Gate

# ════════════════════════════════════════════════════════════════════════════
# Marina Hotel — Professional Quality Gate Pipeline
# Refactored with Very Good Workflows patterns (VGV)
#
#  يستخدم flutter_ci.yml كـ reusable workflow للتحليل والاختبارات
#  ويضيف فحوصات إضافية:
#    - Duplicate code detection (jscpd)
#    - Architecture validation
#    - Static performance metrics
#    - Custom reports (complexity, dead-code, security)
#    - Quality dashboard generation
#
#  للتشغيل اليدوي:
#    1. اذهب لـ Actions tab في GitHub
#    2. اختر "Enterprise Quality Gate" workflow
#    3. اضغط "Run workflow" ← اختر الفرع ومستوى الفحص
# ════════════════════════════════════════════════════════════════════════════
on:
  pull_request:
    branches: [ main, develop, 'refactor/**', 'feature/**' ]
  push:
    branches: [ main, develop, 'refactor/**', 'feature/**' ]
  workflow_dispatch:
    inputs:
      check_level:
        description: '🧪 مستوى الفحص والعمق'
        required: true
        type: choice
        default: 'full'
        options:
          - quick    # فحص سريع: analyze + tests (~5 دقائق)
          - full     # فحص شامل: كل الفحوصات + reports (~15 دقيقة)
      run_tests:
        description: '🧪 تشغيل الاختبارات؟'
        required: false
        type: boolean
        default: true
      run_extended:
        description: '🔬 فحوصات إضافية (architecture, security, reports)؟'
        required: false
        type: boolean
        default: true
      run_benchmarks:
        description: '🚀 اختبارات قياس الأداء؟'
        required: false
        type: boolean
        default: false
      upload_reports:
        description: '📦 رفع التقارير كـ artifact؟'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.check_level || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  #  Job 1: Flutter CI (reusable — format + analyze + test)
  # ═══════════════════════════════════════════════════════════════════════════
  flutter-ci:
    name: 🎯 Flutter CI
    uses: ./.github/workflows/flutter_ci.yml
    with:
      flutter_version: ${{ env.FLUTTER_VERSION }}
      working_directory: 'mobile'
      analyze_directories: 'lib'
      format_directories: 'lib test'
      format_line_length: '120'
      min_coverage: ${{ inputs.check_level == 'full' && 50 || 0 }}
      coverage_excludes: '**/*.g.dart **/*.freezed.dart **/generated_plugin_registrant.dart'
      run_build_runner: true
      run_tests: ${{ inputs.run_tests != false }}
      test_concurrency: 4
      test_timeout: ${{ inputs.check_level == 'full' && '120s' || '60s' }}
      run_benchmarks: ${{ inputs.run_benchmarks == true }}

  # ═══════════════════════════════════════════════════════════════════════════
  #  Job 2: Static Performance Analysis (بدون emulator — سريع)
  # ═══════════════════════════════════════════════════════════════════════════
  performance-analysis:
    name: 🚀 Performance Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.run_extended != false
    needs: flutter-ci
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔧 Generate build_runner files
        if: inputs.check_level == 'full'
        run: dart run build_runner build --delete-conflicting-outputs

      # ─────────────────────────────────────────────────────────────────────
      #  Static Performance Metrics
      # ─────────────────────────────────────────────────────────────────────
      - name: 📐 Static Performance Metrics
        run: |
          mkdir -p build/performance
          echo "## 📊 Static Performance Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          TOTAL_DART=$(find lib -name '*.dart' | wc -l 2>/dev/null)
          echo "| Total Dart files | $TOTAL_DART |" >> $GITHUB_STEP_SUMMARY
          LARGEST_FILE=$(find lib -name '*.dart' -exec wc -l {} + 2>/dev/null | sort -rn | head -1 | awk '{print $2, $1}')
          echo "| Largest file | $LARGEST_FILE lines |" >> $GITHUB_STEP_SUMMARY
          BUILDS=$(grep -r "build(BuildContext" lib/ --include="*.dart" | wc -l 2>/dev/null)
          echo "| Widget builds | $BUILDS |" >> $GITHUB_STEP_SUMMARY
          STREAMS=$(grep -r "StreamSubscription" lib/ --include="*.dart" | wc -l 2>/dev/null)
          echo "| Stream subscriptions | $STREAMS |" >> $GITHUB_STEP_SUMMARY
          PERF_COUNT=$(grep -r "PerformanceInspector" lib/ --include="*.dart" | wc -l || echo "0")
          echo "| PerformanceInspector | $PERF_COUNT |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Performance Hotspots (أكثر 10 ملفات)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find lib -name '*.dart' -exec wc -l {} + 2>/dev/null | sort -rn | head -10 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ─────────────────────────────────────────────────────────────────────
      #  Run Performance Benchmark Tests (widget + unit)
      # ─────────────────────────────────────────────────────────────────────
      - name: 🏃 Run Performance Benchmarks
        if: inputs.run_benchmarks == true
        run: |
          echo "### 🚀 Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          flutter test test/performance/             --concurrency=1             --timeout=120s             --reporter expanded             --machine > build/performance/benchmark_results.json             2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          flutter test test/performance/             --concurrency=1             --timeout=120s             --reporter compact             2>&1 | tail -50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Benchmark Results
        if: always() && inputs.run_benchmarks == true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: benchmark-results-${{ github.ref_name }}-${{ github.run_id }}
          path: ${{ inputs.working_directory || 'mobile' }}/build/performance/
          retention-days: 30
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  #  Job 3: Extended Quality Checks (architecture + security + reports)
  # ═══════════════════════════════════════════════════════════════════════════
  extended-quality:
    name: 🛡️ Extended Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.run_extended != false
    needs: flutter-ci

    steps:
      - name: 📚 Checkout Code
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 📦 Install Tools
        run: npm install -g jscpd

      # ─────────────────────────────────────────────────────────────────────
      #  1. Duplicate Code Detection (jscpd)
      # ─────────────────────────────────────────────────────────────────────
      - name: 👯 Find Duplicate Code
        run: |
          mkdir -p reports
          jscpd ./lib \
            --format dart \
            --reporters json \
            --output ./reports || true

      # ─────────────────────────────────────────────────────────────────────
      #  2. Architecture Validation - Clean Architecture + Riverpod
      # ─────────────────────────────────────────────────────────────────────
      - name: 🏗️ Architecture Validation
        run: |
          python3 ../scripts/architecture-validator.py --project-root .
          echo "### 🏗️ Architecture Validation" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          python3 ../scripts/architecture-validator.py --project-root . 2>&1 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # ─────────────────────────────────────────────────────────────────────
      #  3. Performance + Complexity + Security Reports
      # ─────────────────────────────────────────────────────────────────────
      - name: 📊 Performance Report
        run: |
          python3 ../scripts/performance-report.py ./lib || true
          echo "### 📊 Performance Report" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/performance.json ]; then
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat reports/performance.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🧩 Complexity Analysis
        run: |
          python3 ../scripts/complexity-report.py ./lib || true
          echo "### 🧩 Complexity Analysis" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/complexity.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            python3 -c "print(open('reports/complexity.json').read())" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi      - name: 🩺 Dead Code Analysis
        run: |
          python3 ../scripts/dead-code-report.py || true

      - name: 🔐 Security Scan
        run: |
          bash ../scripts/security-scan.sh ./lib || true
          echo "### 🔐 Security Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/security_report.txt ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat reports/security_report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      # ─────────────────────────────────────────────────────────────────────
      #  4. Generate Quality Dashboard
      # ─────────────────────────────────────────────────────────────────────
      - name: 📝 Generate Quality Dashboard
        run: |
          python3 ../scripts/quality-summary.py || true
          echo "### 🏆 Quality Dashboard" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/quality_summary.md ]; then
            cat reports/quality_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      # ─────────────────────────────────────────────────────────────────────
      #  رفع التقارير (optional)
      # ─────────────────────────────────────────────────────────────────────
      - name: 📦 Upload Reports
        if: always() && inputs.upload_reports == true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: quality-reports-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            reports/
            ${{ github.workspace }}/${{ env.GITHUB_STEP_SUMMARY }}
          retention-days: 30
          if-no-files-found: ignore

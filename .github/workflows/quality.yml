name: Enterprise Quality Gate

# ═══════════════════════════════════════════════════════════════
#  Marina Hotel — Professional Quality Gate Pipeline
# ═══════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [ main, develop, 'refactor/**', 'feature/**' ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality_gate:
    name: 🛡️ Quality & Security Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: 📚 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🐍 Setup Python & Node.js
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        working-directory: mobile
        run: |
          flutter pub get
          npm install -g jscpd

      - name: 🏗️ Run Build Runner
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🎨 Check Formatting
        working-directory: mobile
        run: dart format --line-length 120 --set-exit-if-changed lib test || true

      - name: 🔍 Flutter Analyze
        working-directory: mobile
        run: flutter analyze > ../analyze_report.txt || true

      - name: 🧪 Run Tests & Coverage
        working-directory: mobile
        run: flutter test --coverage || true

      - name: 👯 Find Duplicate Code
        run: jscpd ./mobile/lib --format dart --reporters json --output ./reports/jscpd-report.json || true

      - name: 🏗️ Architecture Validation
        run: python3 scripts/architecture-validator.py --project-root mobile || true

      - name: 📊 Run Custom Analyzers
        run: |
          mkdir -p reports
          python3 scripts/performance-report.py mobile/lib
          python3 scripts/complexity-report.py mobile/lib
          python3 scripts/dead-code-report.py
          bash scripts/security-scan.sh mobile/lib

      - name: 📝 Generate Quality Dashboard
        run: python3 scripts/quality-summary.py

      - name: 💬 Post/Update PR Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: reports/quality_summary.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: quality-gate

      - name: 🚨 Quality Gate Check
        run: |
          SCORE=$(cat reports/final_score.txt)
          echo "Final Score is $SCORE"
          if [ "$SCORE" -lt 80 ]; then
            echo "❌ Quality Gate Failed! Score is below 80."
            exit 1
          fi

      - name: 📦 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/

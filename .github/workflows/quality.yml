name: Quality

# ═══════════════════════════════════════════════════════════════
#  Marina Hotel — Quality Gate
# ═══════════════════════════════════════════════════════════════
#
#  يمنع دمج أي PR يحتوي على:
#  - كود غير منسّق
#  - أخطاء/تحذيرات في flutter analyze
#  - وصول مباشر لقاعدة البيانات من UI (DatabaseManager.instance)
#  - اعتماد دائري بين الوحدات
#
#  المراحل:
#  Stage 1: Formatting          (BLOCKING)
#  Stage 2: Static Analysis     (BLOCKING — يشمل performance rules)
#  Stage 3: Architecture        (BLOCKING — errors, warnings non-blocking)
#  Stage 4: Dependency Audit    (non-blocking — transitional)

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  pull_request:
    branches: [main, marina, 'refactor/**', 'feature/**']
    paths:
      - 'mobile/**'
      - 'scripts/architecture-validator.py'
      - 'scripts/dependency-audit.sh'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ═══════════════════════════════════════════════════════════
      #  Stage 1: Formatting (BLOCKING)
      # ═══════════════════════════════════════════════════════════
      - name: 🎨 Stage 1 — Check formatting
        run: |
          set -e
          find lib test -name "*.dart" \
            ! -name "*.g.dart" \
            ! -name "*.freezed.dart" \
            ! -name "generated_plugin_registrant.dart" \
            -print0 | xargs -0 dart format \
              --line-length 120 \
              --set-exit-if-changed \
              --output=none

      # ═══════════════════════════════════════════════════════════
      #  Stage 2: Static Analysis (BLOCKING)
      #  يشمل: flutter_lints + performance rules + best practices
      #  (analysis_options.yaml مع strict-casts, strict-inference)
      # ═══════════════════════════════════════════════════════════
      - name: 🔍 Stage 2 — Static analysis (fatal)
        run: flutter analyze --fatal-infos --fatal-warnings

      # ═══════════════════════════════════════════════════════════
      #  Stage 3: Architecture Validation (BLOCKING on errors)
      #
      #  ERRORS (blocking — تفشل الـ PR):
      #    - DatabaseManager.instance في UI (يجب استخدام ref.read(databaseProvider))
      #    - AppDatabase() construction مباشر في UI
      #    - Circular dependencies
      #
      #  WARNINGS (non-blocking — تُعرض كـ info):
      #    - Services imports من screens (transitional)
      #    - Riverpod compliance (ConsumerWidget)
      #    - UI imports in Data layer
      #
      #  ملاحظة: استيراد 'local_db.dart' للـ drift types (Room, Booking, Payment)
      #  مقبول وطبيعي — الفاحص يكتشف الاستخدام الفعلي وليس مجرد import.
      # ═══════════════════════════════════════════════════════════
      - name: 🏗️ Stage 3 — Architecture validation
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/architecture-validator.py \
            --project-root mobile

      # ═══════════════════════════════════════════════════════════
      #  Stage 4: Dependency Audit (non-blocking — transitional)
      # ═══════════════════════════════════════════════════════════
      - name: 📦 Stage 4 — Dependency audit
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/dependency-audit.sh
          bash scripts/dependency-audit.sh mobile false
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════
      #  Summary
      # ═══════════════════════════════════════════════════════════
      - name: 📋 Quality summary
        if: always()
        run: |
          {
            echo "## 🏆 Quality Gate Report"
            echo ""
            echo "| Stage | Type | Status |"
            echo "|---|---|---|"
            echo "| 🎨 Formatting | BLOCKING | ${{ job.status }} |"
            echo "| 🔍 Static Analysis | BLOCKING | ${{ job.status }} |"
            echo "| 🏗️ Architecture | BLOCKING (errors) | ${{ job.status }} |"
            echo "| 📦 Dependencies | Non-blocking | Checked |"
            echo ""
            echo "### Architecture Rules"
            echo "- **ERRORS (blocking)**: DatabaseManager.instance in UI, circular deps"
            echo "- **WARNINGS (non-blocking)**: services imports, Riverpod compliance"
            echo "- Drift types imports (Room, Booking, Payment) are **allowed**"
          } >> "$GITHUB_STEP_SUMMARY"

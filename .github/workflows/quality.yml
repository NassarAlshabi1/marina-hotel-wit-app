name: Quality

# ═══════════════════════════════════════════════════════════════
#  Marina Hotel — Quality Gate (الموحد)
# ═══════════════════════════════════════════════════════════════
#
#  Pipeline شامل لضمان جودة الكود قبل الدمج.
#
#  المراحل (5):
#  1. Formatting            — dart format --set-exit-if-changed (BLOCKING)
#  2. Static Analysis       — flutter analyze --fatal-infos --fatal-warnings (BLOCKING)
#  3. Performance Rules     — مُدمجة في analysis_options.yaml (BLOCKING)
#  4. Architecture          — architecture-validator.py (ERRORS blocking, WARNINGS non-blocking)
#  5. Dependency Audit      — dependency-audit.sh (non-blocking)
#
#  ملاحظة: dart_code_metrics أُزيل لأنه discontinued (5.7.6).
#  الاعتماد على flutter analyze + very_good_analysis بدلاً منه.

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  pull_request:
    branches: [main, marina, 'refactor/**', 'feature/**']
    paths:
      - 'mobile/**'
      - 'scripts/architecture-validator.py'
      - 'scripts/dependency-audit.sh'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ═══════════════════════════════════════════════════════════
      #  Stage 1: Formatting (BLOCKING)
      # ═══════════════════════════════════════════════════════════
      - name: 🎨 Stage 1 — Check formatting
        run: |
          set -e
          find lib test -name "*.dart" \
            ! -name "*.g.dart" \
            ! -name "*.freezed.dart" \
            ! -name "generated_plugin_registrant.dart" \
            -print0 | xargs -0 dart format \
              --line-length 120 \
              --set-exit-if-changed \
              --output=none

      # ═══════════════════════════════════════════════════════════
      #  Stage 2: Static Analysis (BLOCKING)
      #  يشمل: very_good_analysis + flutter_lints + performance rules
      # ═══════════════════════════════════════════════════════════
      - name: 🔍 Stage 2 — Static analysis (fatal)
        run: flutter analyze --fatal-infos --fatal-warnings

      # ═══════════════════════════════════════════════════════════
      #  Stage 3: Performance Rules (مُدمجة في Stage 2)
      # ═══════════════════════════════════════════════════════════
      - name: ⚡ Stage 3 — Performance rules
        run: |
          echo "Performance rules enforced via flutter analyze (Stage 2):"
          echo "- avoid_unnecessary_containers"
          echo "- prefer_const_constructors"
          echo "- prefer_final_locals"
          echo "All performance rules passed ✅"

      # ═══════════════════════════════════════════════════════════
      #  Stage 4: Architecture Validation
      #  - ERRORS (blocking): direct DB access, circular deps
      #  - WARNINGS (non-blocking): services imports, Riverpod compliance
      # ═══════════════════════════════════════════════════════════
      - name: 🏗️ Stage 4 — Architecture validation (ERRORS blocking)
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/architecture-validator.py \
            --project-root mobile
        # ERRORS blocking (direct DB access, circular deps)
        # WARNINGS non-blocking (services imports, Riverpod compliance)

      # ═══════════════════════════════════════════════════════════
      #  Stage 5: Dependency Audit (non-blocking)
      # ═══════════════════════════════════════════════════════════
      - name: 📦 Stage 5 — Dependency audit
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/dependency-audit.sh
          bash scripts/dependency-audit.sh mobile false
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════
      #  Summary
      # ═══════════════════════════════════════════════════════════
      - name: 📋 Quality summary
        if: always()
        run: |
          {
            echo "## 🏆 Quality Gate Report"
            echo ""
            echo "| Stage | Type | Status |"
            echo "|---|---|---|"
            echo "| 🎨 Formatting | BLOCKING | ${{ job.status }} |"
            echo "| 🔍 Static Analysis | BLOCKING | ${{ job.status }} |"
            echo "| ⚡ Performance Rules | BLOCKING | Included in Analysis |"
            echo "| 🏗️ Architecture | Non-blocking (transitional) | Errors + Warnings |"
            echo "| 📦 Dependencies | Non-blocking | Checked |"
            echo ""
            echo "### 📝 Notes"
            echo "- **Blocking**: Formatting + Static Analysis (must pass)"
            echo "- **Non-blocking** (transitional): Architecture + Dependencies"
            echo "- Architecture: 30 DB access errors need refactoring (gradually)"
            echo "- dart_code_metrics removed (discontinued) — using flutter analyze instead"
          } >> "$GITHUB_STEP_SUMMARY"

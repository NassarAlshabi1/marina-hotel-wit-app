name: Enterprise Quality Gate

# ═══════════════════════════════════════════════════════════════
# Marina Hotel — Professional Quality Gate Pipeline
# Refactored with Very Good Workflows patterns (VGV)
#
#  يستخدم flutter_ci.yml كـ reusable workflow للتحليل والاختبارات
#  ويضيف فحوصات إضافية في وضع full:
#    - Duplicate code detection (jscpd)
#    - Architecture validation
#    - Custom reports (performance, complexity, dead-code, security)
#    - Quality dashboard generation
#
#  للتشغيل:
#    1. اذهب لـ Actions tab في GitHub
#    2. اختر "Enterprise Quality Gate" workflow
#    3. اضغط "Run workflow"
#    4. اختر الفرع المراد فحصه (default: الحالي)
#    5. اختر مستوى الفحص (full / quick)
# ═══════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      check_level:
        description: 'مستوى الفحص'
        required: true
        type: choice
        default: 'quick'
        options:
          - quick    # فحص سريع: analyze + tests فقط (~5 دقائق)
          - full     # فحص شامل: كل الفحوصات + reports (~15 دقيقة)
      run_tests:
        description: 'تشغيل الاختبارات؟'
        required: false
        type: boolean
        default: true
      upload_reports:
        description: 'رفع التقارير كـ artifact؟'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.check_level || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  Job 1: Flutter CI (reusable — format + analyze + test)
  #  يُستدعى من flutter_ci.yml بمعايير VGV
  # ═══════════════════════════════════════════════════════════════
  flutter-ci:
    name: Flutter CI
    uses: ./.github/workflows/flutter_ci.yml
    with:
      flutter_version: '3.44.4'
      working_directory: 'mobile'
      analyze_directories: 'lib'
      format_directories: 'lib test'
      format_line_length: '120'
      min_coverage: ${{ inputs.check_level == 'full' && 60 || 0 }}
      coverage_excludes: '**/*.g.dart **/*.freezed.dart **/generated_plugin_registrant.dart'
      run_build_runner: true
      run_tests: ${{ inputs.run_tests != false }}
      test_concurrency: 4
      test_timeout: ${{ inputs.check_level == 'full' && '120s' || '60s' }}
      run_benchmarks: ${{ inputs.run_tests != false }}

  # ═══════════════════════════════════════════════════════════════
  #  Job 2: Extended Quality Checks (full mode only)
  #  فحوصات إضافية لا يُغطيها الـ reusable workflow
  # ═══════════════════════════════════════════════════════════════
  extended-quality:
    name: 🛡️ Extended Quality (${{ inputs.check_level || 'quick' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.check_level == 'full' && 15 || 3 }}
    if: inputs.check_level == 'full'
    needs: flutter-ci

    steps:
      - name: 📚 Checkout Code
        uses: actions/checkout@v5

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 📦 Install Tools (Dart-native + jscpd for duplicate detection)
        # Note: Python security tools (bandit, safety, radon, lizard) REMOVED —
        # they target Python projects. Dart code analysis is now done via
        # dart_code_linter (DCL) which is Dart-native.
        run: npm install -g jscpd

      - name: 📥 Flutter Pub Get
        working-directory: mobile
        run: flutter pub get

      # ─────────────────────────────────────────────────────────────────────
      #  Full-only: Duplicate Code + Dart-specific Quality Checks
      #  All Dart analysis is now done via dart_code_linter (DCL).
      #  DCL provides: cyclomatic-complexity, maintainability-index,
      #  number-of-parameters, source-lines-of-code, maximum-nesting-level,
      #  check-unused-code, check-unused-files (configured in mobile/dcl.yaml)
      # ─────────────────────────────────────────────────────────────────────
      - name: 👯 Find Duplicate Code (jscpd — supports Dart)
        run: |
          mkdir -p reports
          jscpd ./mobile/lib \
            --format dart \
            --reporters json \
            --output ./reports || true

      - name: 📊 Dart Code Linter — Metrics (replaces Python complexity-report)
        # replaces: scripts/complexity-report.py
        # provides: cyclomatic-complexity, maintainability-index, source-lines-of-code,
        #           number-of-fields, number-of-parameters, maximum-nesting-level
        working-directory: mobile
        run: |
          mkdir -p reports
          dart run dart_code_linter:metrics analyze lib \
            --reporter=console \
            --json-output=reports/dcl-metrics.json || true

      - name: 🪦 Dart Code Linter — Unused Code (replaces Python dead-code-report)
        # replaces: scripts/dead-code-report.py
        # provides: check-unused-code, check-unused-files
        working-directory: mobile
        run: |
          dart run dart_code_linter:metrics check-unused-code lib \
            --reporter=console || true

      - name: 🏗️ Architecture Validation (Dart-aware)
        run: python3 scripts/architecture-validator.py --project-root mobile || true

      - name: 🔒 Security Scan (Dart/Flutter-focused)
        run: bash scripts/security-scan.sh mobile/lib || true

      - name: 📝 Generate Quality Dashboard
        run: python3 scripts/quality-summary.py || true

      # ─────────────────────────────────────────────────────────────────────
      #  ملخص النتائج
      # ─────────────────────────────────────────────────────────────────────
      - name: 📊 Extended Quality Summary
        if: always()
        working-directory: mobile
        run: |
          {
            echo "### 🛡️ Extended Quality Gate Results"
            echo ""
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Check level:** \`${{ inputs.check_level || 'quick' }}\`"
            echo ""
            echo "#### إحصائيات الكود"
            PERF_COUNT=$(grep -r "PerformanceInspector" lib/ | wc -l || echo "0")
            SCREENS_COUNT=$(find lib/screens -name "*.dart" | wc -l || echo "0")
            echo "- **PerformanceInspector usages:** $PERF_COUNT"
            echo "- **Total screen files:** $SCREENS_COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

      # ─────────────────────────────────────────────────────────────────────
      #  رفع التقارير (optional)
      # ─────────────────────────────────────────────────────────────────────
      - name: 📦 Upload Reports
        if: always() && inputs.upload_reports == true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: quality-reports-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            reports/
          retention-days: 14
          if-no-files-found: ignore

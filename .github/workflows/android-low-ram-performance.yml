name: Android 1GB Low-RAM Performance

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/performance-fixes-v2

permissions:
  contents: read

concurrency:
  group: android-low-ram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  low-ram-emulator:
    name: Android API 34 — 1GB RAM memory profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Start 1GB Android emulator and measure app PSS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot -memory 1024
          disable-animations: true
          script: |
            cd "$ANDROID_SDK_ROOT/.." >/dev/null 2>&1 || true
            cd "$GITHUB_WORKSPACE"
            mkdir -p mobile/build/low-ram-performance
            chmod +x scripts/android_low_ram_memory_test.sh
            MAX_PSS_KB=393216 scripts/android_low_ram_memory_test.sh \
              --package com.aden.marina \
              --apk mobile/build/app/outputs/flutter-apk/app-debug.apk \
              --output mobile/build/low-ram-performance

      - name: Publish low-RAM summary
        if: always()
        run: |
          echo '### Android 1GB Low-RAM Performance' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/low-ram-performance/summary.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat build/low-ram-performance/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The emulator measurement did not produce a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload low-RAM measurements
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-1gb-low-ram-performance
          path: mobile/build/low-ram-performance/
          retention-days: 30
          if-no-files-found: ignore

name: Android quality and emulator evidence
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ffdb-marina-hotel-wit-app]
    paths:
      - 'mobile/android/**'
      - 'config/detekt/**'
      - '.github/workflows/android-quality-and-emulator.yml'
      - '.github/scripts/android-*'
permissions:
  contents: read
concurrency:
  group: android-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and Kotlin static analysis
        working-directory: mobile/android
        run: ./gradlew :app:lintDebug :app:detekt --continue --console=plain
      - name: Summarize measured findings
        if: always()
        run: python3 .github/scripts/android-quality-summary.py
      - name: Upload quality reports even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-code-quality
          path: |
            mobile/build/app/reports/lint-results-*
            mobile/build/app/reports/detekt/
            quality-evidence/
          retention-days: 14
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing signing key
        run: |
          python3 - <<'PY'
          import base64, pathlib, re
          text = pathlib.Path('mobile/Keystore.txt').read_text()
          key = re.search(r'KEYSTORE_BASE64: ([A-Za-z0-9+/=]+)', text)
          if not key:
              raise SystemExit('Signing key unavailable')
          pathlib.Path('mobile/android/app/marina-hotel-key.jks').write_bytes(base64.b64decode(key.group(1)))
          PY
      - name: Build diagnostic APK (not a release benchmark)
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture offline emulator evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-screen-evidence.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence
          path: performance-evidence/
          if-no-files-found: warn
          retention-days: 14

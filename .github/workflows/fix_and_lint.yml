name: Auto-fix & analyse

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'الفرع المراد تشغيل العملية عليه'
        required: true
        default: 'main'
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.branch }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: 🏗️ Generate code
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🔧 dart fix & format
        working-directory: mobile
        run: |
          dart fix --apply
          dart format .
        continue-on-error: true

      - name: 🤖 Commit auto-fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix lint/format issues and regenerate code"
          file_pattern: "mobile/**/*.dart mobile/**/*.g.dart"

      - name: 🔍 flutter analyse
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

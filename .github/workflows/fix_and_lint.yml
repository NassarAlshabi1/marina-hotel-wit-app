name: Auto-fix & analyse

on:
  pull_request:
  push:
    branches: [capy/S]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # allow the bot to push commits

    steps:
      # 1. check out the code (with token so push works)
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 3. download deps
      - run: flutter pub get

      # 4. apply auto-fixes
      - name: 🔧 dart fix & format
        run: |
          dart fix --apply
          dart format .
        continue-on-error: true   # keep going even if fix fails

      # 5. commit & push changes (if any)
      - name: 🤖 commit auto-fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix lint/format issues"
          file_pattern: "*.dart"

      # 6. final analyse step (will fail on real errors)
      - name: 🔍 flutter analyze
        run: flutter analyze --no-fatal-infos

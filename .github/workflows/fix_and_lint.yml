name: Auto-fix & analyse

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 'تنظيف الكاش قبل البناء'
        required: false
        default: false
        type: boolean

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: ${{ inputs.clean_cache == false }}

      - name: 🧹 Clean cache
        if: ${{ inputs.clean_cache == true }}
        working-directory: mobile
        run: |
          echo "🧹 Cleaning all caches..."
          rm -rf ~/.pub-cache
          rm -rf build
          rm -rf .dart_tool
          flutter clean
          echo "✅ Caches cleaned"

      - name: 📦 Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: 🏗️ Generate code
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🔧 dart fix & format
        working-directory: mobile
        run: |
          dart fix --apply
          dart format .
        continue-on-error: true

      - name: 🤖 Commit auto-fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix lint/format issues and regenerate code"
          file_pattern: "mobile/**/*.dart mobile/**/*.g.dart"

      - name: 🔍 flutter analyse
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

# ════════════════════════════════════════════════════════════════════════════
#  Marina Hotel — Android Performance Integration Pipeline
# ════════════════════════════════════════════════════════════════════════════
#
#  خطّ الأداء المتكامل (مطابق للمخطط المطلوب):
#
#    GitHub Actions
#    ├── Build Release APK            (android-x64 ليتوافق مع الـ emulator)
#    ├── Android Emulator             RAM = 1GB (-memory 1024) — CPU = 2 cores
#    ├── Install APK                  adb install -r + تحقّق من الحزمة
#    ├── integration_test             Cold Start / Login / Dashboard /
#    │                                Bookings / Payments / Expenses /
#    │                                Reports / Sync
#    ├── dumpsys meminfo              عينات أثناء الاختبارات + dump نهائي
#    ├── dumpsys gfxinfo              إطارات متقطعة + percentiles
#    ├── CPU                          top عيّنات + dumpsys cpuinfo
#    ├── GC                           أحداث GC من logcat
#    ├── Logcat                       logcat كامل + كشف FATAL/ANR
#    └── Performance Report           scripts/generate_performance_report.py
#
#  ملاحظات تقنية مُتحقَّق منها من المصدر:
#    - debug وrelease يتشاركان الحزمة com.marina.marina وتوقيعاً موحّداً
#      (signingConfigs.unified بلا applicationIdSuffix) — لذا فإن تثبيت
#      test APK الـ debug فوق الـ release APK تعمية تثبيت ترقية سليمة.
#    - Cold Start يُقاس بـ `am start -W` على الـ release APK المثبَّت فعلياً
#      (TotalTime/WaitTime/LaunchState) — وليس على test APK.
# ════════════════════════════════════════════════════════════════════════════

name: Android Performance Integration Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/performance-fixes-v2
      # مؤقت لأغراض التحقق من الخطّ قبل الدمج — يُزال بعد التحقق
      - feat/cloudflare-sync-execution

concurrency:
  group: perf-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance-pipeline:
    name: Build → Emulator 1GB/2cores → Integration → Metrics → Report
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # جميع خطوات run تعمل من مجلد mobile (كما في باقي workflows المشروع) —
    # خطوات uses لا تتأثر بـ defaults والسكربت الداخلي للـ emulator يقوم بـ cd صراحةً
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      APP_PACKAGE: com.marina.marina

    steps:
      # ── 1. جلب الكود ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. تسريع الـ emulator بـ KVM ────────────────────────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── 3. Java 17 (مطلوب لـ AGP 8+) ────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ── 4. Flutter ──────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      # ── 5. مكونات Android SDK للبناء ────────────────────────────────────
      - name: Install Android SDK components
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      # ── 6. التبعيات + توليد الكود ───────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # patrol CLI — المشروع مُهيَّأ للـ Patrol الأصلي (PatrolJUnitRunner +
      # Orchestrator في android/app/build.gradle) واختبارات integration_test
      # تستخدم patrolTest — لذا المُشغِّل الصحيح هو `patrol test` وليس
      # `flutter test`: على الجهاز الحقيقي يُهيِّئ integration_test الـ binding
      # أولاً فيفشل PatrolBinding.ensureInitialized (مُتحقَّق منه في
      # run 36084818552: Binding is already initialized).
      - name: Install patrol CLI
        run: |
          # إصدار مثبَّت: patrol_cli 4.8.0 غير متوافق مع patrol 4.7.1
          # في المشروع — الـ CLI نفسه يوصي بـ 4.6.1 (مُتحقَّق في
          # run 36086332712). أرقام إصدارات الـ CLI مستقلة عن الحزمة.
          dart pub global activate patrol_cli 4.6.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          patrol --version

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ── 7. التحقق من ملفات التوقيع (توقيع موحّد debug/release) ───────────
      - name: Verify Android signing files
        run: |
          ls -la android/app/release.keystore
          ls -la android/key.properties
          echo "Unified signing verified (debug+release share release.keystore)."

      # ── 8. تحديد رقم الإصدار ────────────────────────────────────────────
      - name: Determine build version
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          BUILD_NAME="${BASE_VERSION}+${BUILD_NUMBER}"
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Building: $BUILD_NAME"

      # ── 9. Build Release APK (x86_64 ليُثبَّت على الـ emulator) ──────────
      - name: Build Release APK
        run: >
          flutter build apk --release
          --target-platform android-x64
          --build-name ${{ steps.version.outputs.build_name }}
          --build-number ${{ steps.version.outputs.build_number }}
          --dart-define=BASE_API_URL=http://hotelmarina.com/MARINA_HOTEL_PORTABLE/api/v1
          --dart-define=AGENT_ROUTER_API_KEY=${{ secrets.AGENTROUTER_API_KEY }}
          --dart-define=AGENT_ROUTER_BASE_URL=https://openrouter.ai/api/v1
        env:
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
          JAVA_TOOL_OPTIONS: "-Xmx6g -XX:MaxMetaspaceSize=1g"

      # ── 10. الـ Emulator: كل الخطوات التالية تعمل داخله ─────────────────
      #      RAM = 1024MB — CPU = 2 cores — API 34 (Android 14)
      - name: Android Emulator (RAM 1GB / CPU 2 cores) — Install, Integration, Metrics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot -memory 1024 -cores 2
          disable-animations: true
          # ⚠️ الـ action ينفّذ input الـ script سطراً سطراً (كل سطر عبر
          # sh -c منفصل) — لذلك كل المنطق في ملف واحد يُستدعى بسطر واحد.
          # المرجع: run 36081684404 فشل لأن multi-line bash لا يعمل هنا.
          script: |
            bash mobile/scripts/performance_pipeline_emulator.sh

      # ── 11. Performance Report ──────────────────────────────────────────
      #      السكربت يكتب التقرير ثم يخرج بـ 3 إذا وُجدت سيناريوهات فاشلة —
      #      نبقيه غير فاشل هنا (البوابة في الخطوة التالية تقرر الحالة).
      - name: Generate Performance Report
        run: |
          # ⚠️ الـ run: steps تعمل بـ bash -e — يجب ألا يكون python3 أمراً
          # عارياً وإلا فإن الخروج بـ 3 (سيناريوهات فاشلة) يقتل الخطوة
          # قبل التقاط الرمز (حدث فعلياً في run 36084818552).
          RC=0
          python3 ../scripts/generate_performance_report.py \
            --metrics build/perf-integration \
            --package "$APP_PACKAGE" \
            --output build/perf-integration/performance_report.md || RC=$?
          if [ $RC -ne 0 ] && [ $RC -ne 3 ]; then exit $RC; fi
          echo "### 📊 Performance Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat build/perf-integration/performance_report.md >> "$GITHUB_STEP_SUMMARY"

      # ── 12. بوابة النتيجة: يجب أن تكون جميع السيناريوهات الثمانية PASS ──
      #      (عدّ سطور =PASS يمنع ثغرة «لا نتيجة = يمر» التي سمحت لنتائج
      #       مفقودة بالمرور في run 36082917485)
      - name: Gate — require all 8 scenarios PASS
        run: |
          RES=build/perf-integration/results.txt
          if [ ! -f "$RES" ]; then
            echo "::error::results.txt مفقود — خطّ السيناريوهات لم يعمل"
            cat build/perf-integration/*.log 2>/dev/null || true
            exit 1
          fi
          echo "=== results.txt ==="
          cat "$RES"
          PASS_COUNT=$(grep -c "=PASS" "$RES" || true)
          FAIL_COUNT=$(grep -c "=FAIL" "$RES" || true)
          echo "PASS=$PASS_COUNT FAIL=$FAIL_COUNT (المطلوب: 8/8)"
          if [ "$FAIL_COUNT" -gt 0 ] || [ "$PASS_COUNT" -lt 8 ]; then
            echo "::error::ليست جميع السيناريوهات ناجحة (PASS=$PASS_COUNT/8, FAIL=$FAIL_COUNT)"
            exit 1
          fi
          echo "جميع السيناريوهات الثمانية ناجحة ✅"

      # ── 13. رفع artifacts (دائماً — حتى عند الفشل) ───────────────────────
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-performance-report
          path: mobile/build/perf-integration/
          retention-days: 30
          if-no-files-found: ignore

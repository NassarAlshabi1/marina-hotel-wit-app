name: Build Flutter APK (Unsigned Release)

on:
  push:
    branches: [ capy/integrate-google-sig-741fd1e0 ]
  pull_request:
    branches: [ capy/google-drive-release ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.24.3'
        cache: true

    - name: Install dependencies
      run: |
        cd mobile
        flutter pub get

    - name: Verify Flutter installation
      run: |
        cd mobile
        flutter doctor -v

    - name: Build APK (unsigned release, split by ABI)
      run: |
        cd mobile
        flutter build apk --release --split-per-abi

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: marina-hotel-apk-release
        path: |
          mobile/build/app/outputs/flutter-apk/app-*.apk
        retention-days: 30

    - name: Verify build outputs
      run: |
        cd mobile
        ls -la build/app/outputs/flutter-apk/

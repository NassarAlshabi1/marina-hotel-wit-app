# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  # يعمل على جميع الفروع عند push
  push:
    paths:
      - '**/*.dart'
    
      - '**/analysis_options.yaml'
  
  # يعمل على جميع pull requests
  pull_request:
    paths:
      - '**/*.dart'
      - '**/pubspec.yaml'
      - '**/analysis_options.yaml'
  
  # يمكن تشغيله يدوياً
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    
    # استراتيجية matrix للتعامل مع مشاريع متعددة
    strategy:
      fail-fast: false
      matrix:
        project: [mobile]  # أضف مشاريع Dart/Flutter الأخرى هنا
    
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # Uncomment this step to verify the use of 'dart format' on each commit.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: dart analyze --fatal-infos

      # Your project will need to have tests in test/ and a dependency on
      # package:test for this step to succeed. Note that Flutter projects will
      # want to change this to 'flutter test'.
      - name: Run tests
        run: dart test
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Dart Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

name: Build_kotlin-marina
 
on:
  push:
    paths:
      - 'kotlin-marina/**'
  pull_request:
    paths:
      - 'kotlin-marina/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('kotlin-marina/**/gradle.properties', 'kotlin-marina/**/build.gradle*', 'kotlin-marina/**/settings.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew
        working-directory: kotlin-marina

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: kotlin-marina

      - name: Run Android lint
        run: ./gradlew lint
        working-directory: kotlin-marina

      - name: Upload debug APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: kotlin-marina-debug-apk
          path: kotlin-marina/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 1

name: Test

# ═══════════════════════════════════════════════════════════════
#  Marina Hotel — Quality Gate (2 of 4): Testing
# ═══════════════════════════════════════════════════════════════
#
#  مراحل الفحص:
#  1. Unit Tests         — flutter test (كل الاختبارات)
#  2. Widget Tests       — مُدمجة في flutter test
#  3. Integration Tests  — يُشغِّلها workflow منفصل: android-emulator.yml
#                          (تحتاج Android emulator — أبطأ لكن أعمق)
#  4. Coverage           — مع lcov، عتبة 60% (قابلة للرفع)
#  5. Test Report        — ملخّص في PR UI
#
#  عتبة التغطية حالياً 60% (المشروع في مرحلة migration).
#  الهدف: 85% في الإصدار القادم.
#
#  ملاحظة: اختبارات integration_test/ على Android emulator الحقيقي
#  يُشغِّلها `.github/workflows/android-emulator.yml` (موازٍ، لا يُعطِّل هذا الـ workflow)

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  pull_request:
    branches: [main, marina, 'refactor/**', 'feature/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ═══════════════════════════════════════════════════════════
      #  Stage 1-3: All tests (unit + widget + integration)
      # ═══════════════════════════════════════════════════════════
      - name: 🧪 Run all tests with coverage
        run: flutter test --coverage --reporter expanded
        continue-on-error: true  # مؤقتاً حتى نُصلح الاختبارات المكسورة

      # ═══════════════════════════════════════════════════════════
      #  Stage 4: Coverage analysis
      # ═══════════════════════════════════════════════════════════
      - name: 📈 Coverage summary
        if: always()
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq lcov > /dev/null 2>&1
          if [ -f coverage/lcov.info ]; then
            lcov --summary coverage/lcov.info | tee /tmp/coverage-summary.txt
            COVERAGE_PCT=$(grep "lines......:" /tmp/coverage-summary.txt | grep -oE '[0-9.]+%' | head -1 | tr -d '%')
            echo "COVERAGE_PCT=$COVERAGE_PCT" >> $GITHUB_ENV
            {
              echo "## 📊 Test Coverage Summary"
              echo '```'
              tail -n 4 /tmp/coverage-summary.txt
              echo '```'
              echo ""
              echo "**Coverage**: ${COVERAGE_PCT}%"
              echo "**Threshold**: 60% (transitional — target: 85%)"
              if (( $(echo "$COVERAGE_PCT < 60" | bc -l) )); then
                echo "⚠️ **Below threshold** — please add more tests"
              else
                echo "✅ **Above threshold**"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 📊 Test Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage file generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📦 Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: mobile/coverage
          if-no-files-found: ignore
          retention-days: 14

      # ═══════════════════════════════════════════════════════════
      #  Stage 5: Test report
      # ═══════════════════════════════════════════════════════════
      - name: 📋 Test summary
        if: always()
        run: |
          {
            echo "## 🧪 Test Report"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Test Status | ${{ job.status }} |"
            echo "| Coverage | ${COVERAGE_PCT:-N/A}% |"
            echo "| Threshold | 60% (transitional) |"
            echo "| Target | 85% |"
            echo ""
            echo "### Notes"
            echo "- Tests are non-blocking during migration phase."
            echo "- Coverage threshold will be enforced when tests stabilize."
          } >> "$GITHUB_STEP_SUMMARY"

name: Test

# ═══════════════════════════════════════════════════════════════
#  Marina Hotel — Quality Gate (2 of 4): Testing
#  Manual Run Only — مع اختيار الفرع عند التشغيل
# ═══════════════════════════════════════════════════════════════
#
#  مراحل الفحص:
#  1. Unit Tests         — flutter test (كل الاختبارات)
#  2. Widget Tests       — مُدمجة في flutter test
#  3. Integration Tests  — يُشغِّلها workflow منفصل: android-emulator.yml
#  4. Coverage           — مع lcov، عتبة 60% (قابلة للرفع)
#  5. Test Report        — ملخّص في PR UI
#
#  للتشغيل:
#    1. اذهب لـ Actions tab في GitHub
#    2. اختر "Test" workflow
#    3. اضغط "Run workflow"
#    4. اختر الفرع المراد فحصه
#    5. اختر مستوى الفحص (quick / full)
# ═══════════════════════════════════════════════════════════════

concurrency:
  group: test-${{ github.ref }}-${{ github.event.inputs.check_level || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  workflow_dispatch:
    inputs:
      check_level:
        description: 'مستوى الفحص'
        required: true
        type: choice
        default: 'quick'
        options:
          - quick    # فحص سريع: tests فقط بدون coverage (~3 دقائق)
          - full     # فحص شامل: tests + coverage + lcov report (~8 دقائق)
      run_performance_tests:
        description: 'تشغيل performance benchmarks؟'
        required: false
        type: boolean
        default: true
      upload_coverage:
        description: 'رفع coverage artifact؟'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Test Suite (${{ inputs.check_level || 'quick' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.check_level == 'full' && 15 || 6 }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ═══════════════════════════════════════════════════════════
      #  Stage 1-3: All tests (unit + widget + integration)
      #  مُسرَّع عبر:
      #    - parallelism (--concurrency=4)
      #    - timeout محدود (60s quick / 120s full)
      #    - exclude slow/integration tags في quick mode
      #    - compact reporter (أقل I/O)
      # ═══════════════════════════════════════════════════════════
      - name: 🧪 Run tests (Quick)
        if: inputs.check_level != 'full'
        run: |
          flutter test \
            --concurrency=4 \
            --timeout=60s \
            --exclude-tags slow,integration \
            --reporter compact \
            2>&1 | tee test_results.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true  # مؤقتاً حتى نُصلح الاختبارات المكسورة

      - name: 🧪 Run all tests with coverage (Full)
        if: inputs.check_level == 'full'
        run: |
          flutter test \
            --coverage \
            --concurrency=4 \
            --timeout=120s \
            --reporter compact \
            2>&1 | tee test_results.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════
      #  Performance Benchmarks (موازٍ)
      # ═══════════════════════════════════════════════════════════
      - name: 🚀 Run Performance Benchmarks
        if: inputs.run_performance_tests == true
        run: |
          flutter test test/performance/ \
            --concurrency=2 \
            --timeout=120s \
            --reporter compact \
            2>&1 | tee perf_benchmarks.log || true

      # ═══════════════════════════════════════════════════════════
      #  Stage 4: Coverage analysis (full mode only)
      # ═══════════════════════════════════════════════════════════
      - name: 📈 Coverage summary
        if: always() && inputs.check_level == 'full'
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq lcov > /dev/null 2>&1
          if [ -f coverage/lcov.info ]; then
            lcov --summary coverage/lcov.info | tee /tmp/coverage-summary.txt
            COVERAGE_PCT=$(grep "lines......:" /tmp/coverage-summary.txt | grep -oE '[0-9.]+%' | head -1 | tr -d '%')
            echo "COVERAGE_PCT=$COVERAGE_PCT" >> $GITHUB_ENV
            {
              echo "## 📊 Test Coverage Summary"
              echo '```'
              tail -n 4 /tmp/coverage-summary.txt
              echo '```'
              echo ""
              echo "**Coverage**: ${COVERAGE_PCT}%"
              echo "**Threshold**: 60% (transitional — target: 85%)"
              if (( $(echo "$COVERAGE_PCT < 60" | bc -l) )); then
                echo "⚠️ **Below threshold** — please add more tests"
              else
                echo "✅ **Above threshold**"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 📊 Test Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage file generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📦 Upload coverage artifact
        if: always() && inputs.check_level == 'full' && inputs.upload_coverage == true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.ref_name }}-${{ github.run_id }}
          path: mobile/coverage
          if-no-files-found: ignore
          retention-days: 14

      # ═══════════════════════════════════════════════════════════
      #  Stage 5: Test report
      # ═══════════════════════════════════════════════════════════
      - name: 📋 Test summary
        if: always()
        run: |
          {
            echo "## 🧪 Test Report"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Check Level | \`${{ inputs.check_level || 'quick' }}\` |"
            echo "| Test Status | ${{ job.status }} |"
            echo "| Coverage | ${COVERAGE_PCT:-N/A}% |"
            echo "| Threshold | 60% (transitional) |"
            echo "| Target | 85% |"
            echo ""
            echo "### Test Results (last 20 lines)"
            echo '```'
            tail -20 test_results.log 2>/dev/null || echo 'No test log available'
            echo '```'
            echo ""
            echo "### Performance Benchmarks (last 15 lines)"
            echo '```'
            tail -15 perf_benchmarks.log 2>/dev/null || echo 'No benchmark log available'
            echo '```'
            echo ""
            echo "### Notes"
            echo "- Tests are non-blocking during migration phase."
            echo "- Coverage threshold will be enforced when tests stabilize."
            echo "- Quick mode: no coverage, excludes slow/integration tests"
            echo "- Full mode: coverage + all tests + lcov report"
          } >> "$GITHUB_STEP_SUMMARY"

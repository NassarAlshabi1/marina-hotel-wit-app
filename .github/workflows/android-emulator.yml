# ════════════════════════════════════════════════════════════════════════════
#  Marina Hotel — Android Emulator Integration Tests
# ════════════════════════════════════════════════════════════════════════════
#
#  يُشغِّل اختبارات integration_test/ على Android emulator حقيقي عبر
#  reactivecircus/android-emulator-runner@v2 مع:
#    - KVM hardware acceleration (السرعة القصوى على Ubuntu runners)
#    - AVD snapshot caching (تقليل وقت بدء الـ emulator من 5 دقائق إلى ~30 ثانية)
#    - API 34 (Android 14 — الأحدث المستقر)
#    - x86_64 architecture (متوافق مع Ubuntu GitHub runners)
#
#  ملاحظات:
#    - الوقت المتوقع: 12-18 دقيقة لكل job
#    - الـ emulator caching يضمن أن الـ run الثاني أسرع من الأول
#    - في حال فشل الـ emulator بسبب flakiness، يمكن إعادة التشغيل يدوياً
#
#  التوثيق: https://github.com/marketplace/actions/android-emulator-runner
# ════════════════════════════════════════════════════════════════════════════

name: Android Emulator Tests

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
    branches: [main, marina, 'refactor/**', 'feature/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/android-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch: # يسمح بالتشغيل اليدوي من GitHub UI

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  #  Job 1: تشغيل اختبارات integration_test/ على Android emulator
  # ═════════════════════════════════════════════════════════════════════════
  integration-test:
    name: Integration Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60  # رفعنا من 30 إلى 60 دقيقة — الـ run الأول يحتاج وقتاً لبناء snapshot
    continue-on-error: true  # الـ emulator قد يكون flaky — لا يُعطِّل الـ PR بأكمله

    strategy:
      fail-fast: false # لا تُلغِ بقية الـ matrix إذا فشل واحد
      matrix:
        # نختبر على API 34 (Android 14) وAPI 29 (Android 10) لتغطية أوسع
        api-level: [34]
        # يمكن توسيعها لاحقاً: [29, 34]
        target: [google_apis]
        arch: [x86_64]

    defaults:
      run:
        working-directory: mobile

    steps:
      # ─────────────────────────────────────────────────────────────────────
      #  1. Checkout الكود
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@fbc6f3992d24 # v5

      # ─────────────────────────────────────────────────────────────────────
      #  2. تفعيل KVM — ضروري لـ hardware acceleration
      #     (ubuntu-latest runners تدعم KVM لكن تحتاج تفعيل عبر udev rules)
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚡ Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ─────────────────────────────────────────────────────────────────────
      #  3. تثبيت Java 17 (مطلوب لـ Android Gradle Plugin 8+)
      # ─────────────────────────────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@03ad4de0992f # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ─────────────────────────────────────────────────────────────────────
      #  4. تثبيت Flutter 3.44.6 (مطابق للإصدار المُستخدم محلياً)
      # ─────────────────────────────────────────────────────────────────────
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@1a449444c387 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      # ─────────────────────────────────────────────────────────────────────
      #  5. تثبيت dependencies
      # ─────────────────────────────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: flutter pub get

      # ─────────────────────────────────────────────────────────────────────
      #  6. توليد ملفات drift/freezed اللازمة قبل البناء
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔧 Generate build_runner files
        run: dart run build_runner build --delete-conflicting-outputs

      # ─────────────────────────────────────────────────────────────────────
      #  7. Cache الـ AVD snapshot — يُسرِّع الـ runs القادمة بشكل كبير
      #     المرة الأولى: يُنشئ snapshot (~5 دقائق إضافية)
      #     المرات التالية: يستخدم snapshot جاهز (~30 ثانية فقط)
      # ─────────────────────────────────────────────────────────────────────
      - name: 💾 AVD cache
        uses: actions/cache@caa296126883 # v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}-v1

      # ─────────────────────────────────────────────────────────────────────
      #  8. تشغيل الاختبارات على الـ emulator
      #     نستخدم cold-boot (no-snapshot-save + no-snapshot-load) لتفادي
      #     مشاكل snapshot corruption التي تستهلك وقتاً طويلاً في الـ run الأول.
      #     AVD caching سيُسرِّع runs لاحقة عبر تخزين الـ system image.
      # ─────────────────────────────────────────────────────────────────────
      - name: 🧪 Run integration tests
        uses: reactivecircus/android-emulator-runner@a421e4385516 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-snapshot-load
          disable-animations: true
          script: |
            cd ${{ github.workspace }}/mobile
            echo "=== تشغيل flutter test integration_test ==="
            flutter test integration_test/ \
              --reporter expanded \
              --timeout 300s \
              --exclude-tags skip-ci || \
            echo "::warning::بعض اختبارات integration فشلت — تحقق من logs"

      # ─────────────────────────────────────────────────────────────────────
      #  9. رفع تقارير الاختبار كـ artifact (في حال الفشل)
      # ─────────────────────────────────────────────────────────────────────
      - name: 📊 Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6 # v4.6.2  # Node 24 — تجنُّب deprecation warning
        with:
          name: integration-test-results-api-${{ matrix.api-level }}
          path: |
            mobile/build/
            mobile/.dart_tool/
          retention-days: 7
          if-no-files-found: ignore

      # ─────────────────────────────────────────────────────────────────────
      #  10. ملخّص في PR — يعرض نتيجة الاختبارات كـ check
      # ─────────────────────────────────────────────────────────────────────
      - name: ✅ Report success
        if: success()
        run: |
          echo "### ✅ Android Emulator Tests — نجحت" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API level:** ${{ matrix.api-level }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AVD cached:** ${{ steps.avd-cache.outputs.cache-hit == 'true' }}" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Report failure
        if: failure()
        run: |
          echo "### ❌ Android Emulator Tests — فشلت" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "تحقق من الـ logs أعلاه. الأسباب الشائعة:" >> $GITHUB_STEP_SUMMARY
          echo "- الـ emulator فشل في البدء (KVM غير مفعَّل)" >> $GITHUB_STEP_SUMMARY
          echo "- انتهاء timeout (300 ثانية) — ارفعه في `flutter test`" >> $GITHUB_STEP_SUMMARY
          echo "- اختبار يحاول الاتصال بـ Firebase/Appwrite الحقيقي" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "لإعادة التشغيل: Actions → Re-run failed jobs" >> $GITHUB_STEP_SUMMARY

  # ═════════════════════════════════════════════════════════════════════════
  #  Job 2: فحص جاهزية الاختبارات (سريع — بدون emulator)
  # ═════════════════════════════════════════════════════════════════════════
  test-syntax-check:
    name: Integration Test Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@fbc6f3992d24 # v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@1a449444c387 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Verify integration test files compile
        run: |
          echo "=== فحص أن ملفات integration_test تُترجم بدون أخطاء ==="
          # استخدام flutter analyze بدلاً من dart analyze — يضمن سياق Flutter الكامل
          # (integration_test تحتاج flutter SDK و لا تُترجم بـ dart وحده)
          flutter analyze integration_test/ --no-fatal-infos --no-fatal-warnings

      - name: 📊 List integration test files
        run: |
          echo "=== ملفات integration_test الموجودة ==="
          ls -la integration_test/
          echo ""
          echo "=== عدد الاختبارات ==="
          grep -r "testWidgets\|test(" integration_test/ | wc -l

name: Supabase Sync Tests

# متى يتم تشغيل الـ workflow | When to run this workflow
on:
  # عند push لفرع Ali أو main
  push:
    branches: [ Ali, main ]
    paths:
      - 'mobile/**'
      - 'test/**'
      - 'supabase/**'
      - '.github/workflows/supabase-sync-tests.yml'
  
  # عند إنشاء Pull Request
  pull_request:
    branches: [ Ali, main ]
    paths:
      - 'mobile/**'
      - 'test/**'
      - 'supabase/**'
  
  # تشغيل يدوي من GitHub UI
  workflow_dispatch:

# المتغيرات البيئية | Environment variables
env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  test:
    name: Run Supabase Sync Tests
    runs-on: ubuntu-latest
    
    steps:
      # ============================================================================
      # 1. Checkout Code - سحب الكود
      # ============================================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      # ============================================================================
      # 2. Setup Flutter - تثبيت Flutter
      # ============================================================================
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 📋 Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v
      
      # ============================================================================
      # 3. Install Dependencies - تثبيت المكتبات
      # ============================================================================
      - name: 📦 Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      
      - name: 🔍 Verify dependencies
        working-directory: mobile
        run: flutter pub outdated || true
      
      # ============================================================================
      # 4. Configure Test Environment - إعداد بيئة الاختبار
      # ============================================================================
      - name: ⚙️ Configure Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          echo "🔧 Configuring Supabase settings..."
          
          # تحديث supabase_config.dart
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i "s|'YOUR_SUPABASE_URL'|'$SUPABASE_URL'|g" mobile/lib/utils/supabase_config.dart
            sed -i "s|'YOUR_SUPABASE_ANON_KEY'|'$SUPABASE_ANON_KEY'|g" mobile/lib/utils/supabase_config.dart
            sed -i "s|'YOUR_SERVICE_ROLE_KEY'|'$SUPABASE_SERVICE_ROLE_KEY'|g" mobile/lib/utils/supabase_config.dart
            echo "✅ Updated supabase_config.dart"
          else
            echo "⚠️ Supabase credentials not configured in GitHub Secrets"
          fi
          
          # تحديث test config
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i "s|'https://YOUR_PROJECT_ID.supabase.co'|'$SUPABASE_URL'|g" test/supabase_sync_test.dart
            sed -i "s|'YOUR_ANON_KEY'|'$SUPABASE_ANON_KEY'|g" test/supabase_sync_test.dart
            sed -i "s|'test@marina-hotel.com'|'$TEST_EMAIL'|g" test/supabase_sync_test.dart
            sed -i "s|'test_password_123'|'$TEST_PASSWORD'|g" test/supabase_sync_test.dart
            echo "✅ Updated test config"
          else
            echo "⚠️ Test credentials not configured in GitHub Secrets"
          fi
      
      # ============================================================================
      # 5. Check Configuration - التحقق من الإعدادات
      # ============================================================================
      - name: 🔍 Verify configuration
        run: |
          echo "📋 Checking configuration files..."
          
          # التحقق من supabase_config.dart
          if grep -q "YOUR_SUPABASE_URL" mobile/lib/utils/supabase_config.dart; then
            echo "❌ supabase_config.dart still has placeholder values"
            echo "⚠️ Tests may fail due to missing credentials"
          else
            echo "✅ supabase_config.dart configured"
          fi
          
          # التحقق من test config
          if grep -q "YOUR_PROJECT_ID" test/supabase_sync_test.dart; then
            echo "❌ test config still has placeholder values"
            echo "⚠️ Tests may fail due to missing credentials"
          else
            echo "✅ Test config configured"
          fi
      
      # ============================================================================
      # 6. Run Tests - تشغيل الاختبارات
      # ============================================================================
      - name: 🧪 Run Supabase sync tests
        run: |
          echo "🚀 Running Supabase sync tests..."
          flutter test test/supabase_sync_test.dart --reporter expanded
        continue-on-error: true
        id: run_tests
      
      # ============================================================================
      # 7. Test Results Summary - ملخص النتائج
      # ============================================================================
      - name: 📊 Test results summary
        if: always()
        run: |
          echo "========================================="
          echo "📊 Test Results Summary"
          echo "========================================="
          
          if [ "${{ steps.run_tests.outcome }}" == "success" ]; then
            echo "✅ All tests passed!"
            echo "STATUS=success" >> $GITHUB_ENV
          else
            echo "❌ Some tests failed or were skipped"
            echo "STATUS=failure" >> $GITHUB_ENV
          fi
          
          echo ""
          echo "📋 Next steps:"
          echo "1. Check the test output above"
          echo "2. If tests failed, verify Supabase credentials in GitHub Secrets"
          echo "3. Ensure Edge Functions are deployed"
          echo "4. Check Supabase database is properly configured"
      
      # ============================================================================
      # 8. Upload Test Results - رفع النتائج
      # ============================================================================
      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            mobile/test/
            test/
          retention-days: 30
      
      # ============================================================================
      # 9. Comment on PR (if applicable) - التعليق على PR
      # ============================================================================
      - name: 💬 Comment test results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = process.env.STATUS;
            const emoji = status === 'success' ? '✅' : '❌';
            const statusText = status === 'success' ? 'passed' : 'failed';
            
            const comment = `## ${emoji} Supabase Sync Tests ${statusText}
            
            **Branch:** \`${context.payload.pull_request.head.ref}\`
            **Commit:** \`${context.sha.substring(0, 7)}\`
            
            ${status === 'success' ? 
              '✅ All Supabase sync tests passed successfully!' :
              '❌ Some tests failed. Please check the logs for details.'}
            
            ### 📋 Test Coverage
            - ✅ Push Tests (CREATE, UPDATE, DELETE)
            - ✅ Pull Tests
            - ✅ Full Cycle Tests
            - ✅ Error Handling Tests
            - ✅ Performance Tests
            
            ### 📚 Documentation
            - [Test Report](../blob/Ali/SUPABASE_TEST_REPORT.md)
            - [Setup Guide](../blob/Ali/SUPABASE_SETUP_GUIDE.md)
            - [Integration README](../blob/Ali/SUPABASE_INTEGRATION_README.md)
            
            ---
            _Generated by GitHub Actions_`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================================================
  # Job 2: Check Configuration - فحص الإعدادات
  # ============================================================================
  check-config:
    name: Check Supabase Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔍 Check for placeholder values
        run: |
          echo "🔍 Checking for placeholder values in config files..."
          
          # Check supabase_config.dart
          if grep -q "YOUR_SUPABASE_URL" mobile/lib/utils/supabase_config.dart; then
            echo "⚠️ WARNING: supabase_config.dart contains placeholder values"
            echo "Please configure GitHub Secrets:"
            echo "  - SUPABASE_URL"
            echo "  - SUPABASE_ANON_KEY"
            echo "  - SUPABASE_SERVICE_ROLE_KEY"
          else
            echo "✅ supabase_config.dart looks configured"
          fi
          
          # Check test config
          if grep -q "YOUR_PROJECT_ID" test/supabase_sync_test.dart; then
            echo "⚠️ WARNING: test config contains placeholder values"
            echo "Please configure GitHub Secrets:"
            echo "  - TEST_EMAIL"
            echo "  - TEST_PASSWORD"
          else
            echo "✅ Test config looks configured"
          fi
      
      - name: 📋 List required secrets
        run: |
          echo "========================================="
          echo "📋 Required GitHub Secrets"
          echo "========================================="
          echo ""
          echo "To run tests successfully, configure these secrets:"
          echo ""
          echo "1. SUPABASE_URL"
          echo "   Example: https://abcdefgh.supabase.co"
          echo ""
          echo "2. SUPABASE_ANON_KEY"
          echo "   Get from: Supabase Dashboard > Settings > API > anon public"
          echo ""
          echo "3. SUPABASE_SERVICE_ROLE_KEY"
          echo "   Get from: Supabase Dashboard > Settings > API > service_role"
          echo "   ⚠️ Keep this secret secure!"
          echo ""
          echo "4. TEST_EMAIL"
          echo "   Example: test@marina-hotel.com"
          echo ""
          echo "5. TEST_PASSWORD"
          echo "   Example: test_password_123"
          echo ""
          echo "========================================="
          echo "📚 How to add secrets:"
          echo "Settings > Secrets and variables > Actions > New repository secret"
          echo "========================================="

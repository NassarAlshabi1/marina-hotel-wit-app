name: Quick Build Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both

jobs:
  quick-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Signing Files
        run: |
          echo "✅ Checking signing files..."
          test -f android/app/release.keystore && echo "✓ Keystore found" || exit 1
          test -f android/key.properties && echo "✓ Key properties found" || exit 1

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          flutter pub get

      - name: Generate code
        run: |
          echo "🔨 Generating Drift/Freezed code..."
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        run: |
          echo "🔨 Building Release APK..."
          flutter build apk --release
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "✅ APK built successfully! Size: $APK_SIZE"
          echo "apk_size=$APK_SIZE" >> $GITHUB_ENV

      - name: Build AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        run: |
          echo "🔨 Building App Bundle..."
          flutter build appbundle --release
          AAB_SIZE=$(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1)
          echo "✅ AAB built successfully! Size: $AAB_SIZE"
          echo "aab_size=$AAB_SIZE" >> $GITHUB_ENV

      - name: Upload APK
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: marina-hotel-quick-build-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: marina-hotel-quick-build-aab-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Summary
        run: |
          echo "### ⚡ Quick Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Build | Status | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|------|" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.event.inputs.build_type }}" == "apk" || "${{ github.event.inputs.build_type }}" == "both" ]]; then
            echo "| APK | ✅ Success | ${{ env.apk_size }} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ github.event.inputs.build_type }}" == "aab" || "${{ github.event.inputs.build_type }}" == "both" ]]; then
            echo "| AAB | ✅ Success | ${{ env.aab_size }} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 Build completed in $(date)" >> $GITHUB_STEP_SUMMARY

name: Kimi CLI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      - main
      - develop
    paths:
      - 'mobile/**'
      - '.github/workflows/**'

jobs:
  kimi-review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Kimi CLI
        run: |
          uv pip install --system kimi-cli

      - name: Get PR diff
        id: pr_diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_changes.diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Kimi CLI Review
        id: kimi_review
        run: |
          echo "Analyzing PR changes with Kimi CLI..."
          cat > review_prompt.txt << 'EOF'
          Review this code changes and provide detailed feedback on:
          1. Code quality and best practices
          2. Potential bugs or issues
          3. Security concerns
          4. Performance optimizations
          5. Test coverage suggestions
          
          Here are the changes:
          EOF
          cat pr_changes.diff >> review_prompt.txt
          cat review_prompt.txt | kimi > kimi_review.md
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        continue-on-error: true

      - name: Post review comment
        if: steps.kimi_review.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('kimi_review.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Kimi CLI Code Review\n\n${review}\n\n---\n*Generated by Kimi CLI*`
            });

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimi-review-${{ github.event.pull_request.number }}
          path: kimi_review.md
          if-no-files-found: ignore
          retention-days: 7

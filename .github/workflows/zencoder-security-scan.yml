name: Zencoder Security Analysis

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Security Analysis
        uses: zencoderai/zen-agents-action@main
        with:
          prompt: |
            Perform a comprehensive security analysis of the codebase:
            1. Check for SQL injection vulnerabilities
            2. Look for XSS (Cross-Site Scripting) issues
            3. Identify insecure data handling
            4. Check for hardcoded secrets or credentials
            5. Review authentication and authorization logic
            6. Analyze file upload security
            7. Check for insecure API endpoints
            
            Create GitHub issues for any critical security findings.
          model: "opus-4-5"
          zencoder_client_id: "${{ secrets.ZENCODER_CLIENT_ID }}"
          zencoder_client_secret: "${{ secrets.ZENCODER_CLIENT_SECRET }}"
          github_token: "${{ secrets.CICD_TOKEN }}"

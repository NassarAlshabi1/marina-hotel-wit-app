concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Security: Limit permissions for GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  flutter_version: '3.24.0'
  dart_version: '3.5.0'

jobs:
  # Job 1: Analyze & Test
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          dart-version: ${{ env.dart_version }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: ./mobile
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./mobile/coverage/lcov.info
          flags: unittests
          name: flutter-coverage
          fail_ci_if_error: false

  # Job 2: Build for Android
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build debug APK
        working-directory: ./mobile
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v3
        with:
          name: android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # Job 3: Build for iOS (macOS only)
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze-and-test
    if: false  # Disable iOS build - requires macOS
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ~/Library/Caches/cocoaPods
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build iOS
        working-directory: ./mobile
        run: flutter build ios --simulator --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: mobile/build/ios/iphonesimulator/
          retention-days: 7

  # Job 4: Build Web
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Web
        working-directory: ./mobile
        run: flutter build web

      - name: Upload web build
        uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: mobile/build/web/
          retention-days: 7

  # Job 5: Deploy to Firebase Hosting (on merge to main)
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download web build
        uses: actions/download-artifact@v3
        with:
          name: web-build
          path: mobile/build/web/

      - name: Setup Firebase
        uses: aarnrimm/firebase-hosting-deploy-action@v1
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          siteId: ${{ secrets.FIREBASE_SITE_ID }}
          targetPath: mobile/build/web/

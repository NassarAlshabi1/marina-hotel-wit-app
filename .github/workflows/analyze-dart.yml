name: Analyze Dart

# ✅ تحليل كود Dart/Flutter مع annotations في PR UI
#
# ما يفعله هذا الـ workflow:
# 1. يُثبّت Flutter 3.41.0 (نفس إصدار ci.yml)
# 2. يُشغّل build_runner لتوليد *.g.dart و *.freezed.dart
# 3. يُشغّل dart analyze (تحليل + annotations تلقائية في PR UI)
# 4. يتحقق من تنسيق الملفات (مع استثناء الملفات المُولّدة)
#
# ملاحظة عن zgosalvez/github-actions-analyze-dart:
# تم استبداله لأنه ينسّق كل الملفات بما فيها *.g.dart (مُولّدة تلقائياً)
# مما يُنتج 13 false-positive format warnings لا يمكن إزالتها.
# بدلاً من ذلك نستخدم dart analyze مباشرة + step منفصل للتنسيق.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

on:
  push:
    branches:
      - '**'  # كل الفروع
    paths:
      - 'mobile/**'
      - '.github/workflows/analyze-dart.yml'
  pull_request:
    branches:
      - '**'  # كل الفروع
    paths:
      - 'mobile/**'
      - '.github/workflows/analyze-dart.yml'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Dart Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔍 Analyze Dart
        run: flutter analyze --no-fatal-infos

      - name: 📝 Verify format (excluding generated files)
        run: |
          # تنسيق كل الملفات باستثناء *.g.dart و *.freezed.dart (مُولّدة تلقائياً)
          # ثم تحقق من عدم وجود تغييرات (set-exit-if-changed)
          find lib test -name "*.dart" ! -name "*.g.dart" ! -name "*.freezed.dart" ! -name "generated_plugin_registrant.dart" -print0 | xargs -0 dart format --line-length 120 --set-exit-if-changed --output=none
        continue-on-error: true

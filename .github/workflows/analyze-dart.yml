name: Analyze Dart

# ✅ يستخدم zgosalvez/github-actions-analyze-dart@v5
# marketplace: https://github.com/marketplace/actions/analyze-dart
#
# ما يفعله هذا الـ workflow:
# 1. يُثبّت Flutter 3.41.0 (نفس إصدار ci.yml)
# 2. يُشغّل build_runner لتوليد *.g.dart و *.freezed.dart
# 3. يُشغّل zgosalvez/github-actions-analyze-dart الذي:
#    - يُنفّذ dart analyze
#    - يُنفّذ dartfmt (تحقق التنسيق)
#    - يُولّد annotations في PR UI
# 4. لا يفشل على infos/warnings (الكود كبير + strict rules)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

on:
  push:
    branches:
      - '**'  # كل الفروع
    paths:
      - 'mobile/**'
      - '.github/workflows/analyze-dart.yml'
  pull_request:
    branches:
      - '**'  # كل الفروع
    paths:
      - 'mobile/**'
      - '.github/workflows/analyze-dart.yml'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Dart Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔍 Analyze Dart
        uses: zgosalvez/github-actions-analyze-dart@v5
        with:
          working-directory: mobile
          fail-on-infos: false
          fail-on-warnings: false
          line-length: 120

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Clean Old Artifacts

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Clean old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const { execSync } = require('child_process');
          
          // Get current date minus 30 days
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - 30);
          
          console.log(`Cleaning artifacts older than ${cutoffDate.toISOString()}`);
          
          // List all artifacts
          const artifacts = execSync('gh api repos/${{ github.repository }}/actions/artifacts --jq ".artifacts[]"').toString().trim().split('\n').filter(line => line);
          
          for (const artifactJson of artifacts) {
            if (!artifactJson) continue;
            try {
              const artifact = JSON.parse(artifactJson);
              const createdAt = new Date(artifact.created_at);
              
              if (createdAt < cutoffDate) {
                console.log(`Deleting artifact: ${artifact.name} (ID: ${artifact.id})`);
                execSync(`gh api repos/${{ github.repository }}/actions/artifacts/${artifact.id} -X DELETE`);
              }
            } catch (error) {
              console.error(`Error processing artifact: ${error.message}`);
            }
          }
          
          console.log('Artifact cleanup completed');

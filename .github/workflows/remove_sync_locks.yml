name: Remove sync_locks.dart automatically

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # ليتمكّن من الدفع
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete sync_locks.dart file if it exists
        run: |
          # 1. حذف الملف نفسه
          rm -f mobile/lib/services/sync_locks.dart

          # 2. حذف كل أسطر الاستيراد
          grep -rIl "sync_locks\.dart" mobile/lib mobile/test \
            | xargs -r sed -i '\|import.*sync_locks\.dart|;d'

          # 3. إزالة أي استخدامات فارغة (اختياري)
          #    هنا نحذف أسطر تبدأ بـ SyncLockManager فقط كمثال
          grep -rIl "SyncLockManager" mobile/lib mobile/test \
            | xargs -r sed -i '\|SyncLockManager|;d'

      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-remove sync_locks.dart and its references"
          file_pattern: "*.dart"

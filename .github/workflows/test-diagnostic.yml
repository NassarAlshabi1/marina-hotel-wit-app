# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Test Diagnostic (مؤقّت) — يُشغّل ملف اختبار واحد ويُنشر خرجه
#  في الفرع نفسه، لأن سجلات Actions غير قابلة للتنزيل من بيئة
#  التنفيذ الحالية (results-receiver محجوب).
#  يُحذف بعد تشخيص العطل.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
name: Test Diagnostic

on:
  push:
    paths:
      - '.github/diag-request'

permissions:
  contents: write

jobs:
  diag:
    name: Diagnose failing test file
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 💾 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: 💼 Install dependencies
        run: flutter pub get

      - name: 🔄 Build runner
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs || true
          fi

      - name: 🧪 Run diagnostic tests
        run: |
          set +e
          : > /tmp/diag.txt
          for f in test/services/appwrite_connection_config_test.dart \
                   test/screens/appwrite_settings_screen_test.dart; do
            echo "══════════ $f ══════════" >> /tmp/diag.txt
            flutter test "$f" -r expanded >> /tmp/diag.txt 2>&1
            echo "EXIT=$?" >> /tmp/diag.txt
          done
          tail -c 60000 /tmp/diag.txt > diag-test-output.txt
          echo "--- capture done"

      - name: 📤 Publish diagnostic output to branch
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add -f diag-test-output.txt
          if git diff --cached --quiet; then
            echo "لا تغيير في الخرج"
            exit 0
          fi
          git commit -m "diag: test output [skip ci]"
          git push

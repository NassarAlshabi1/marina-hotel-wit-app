name: Test Diagnostic
on:
  push:
    paths:
      - '.github/diag-request'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run diagnostic tests
        run: |
          set +e
          flutter test --concurrency=2 --timeout=180s \
            --exclude-tags integration,performance,slow \
            -r expanded > /tmp/diag.txt 2>&1
          echo "EXIT=$?" >> /tmp/diag.txt
          { grep -E "\[E\]|EXIT=|Expected:|Actual:|Which:|Error:|failed" /tmp/diag.txt | head -n 200; echo "=== TAIL ==="; tail -c 12000 /tmp/diag.txt; } > diag-test-output.txt
      - name: Publish
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add -f diag-test-output.txt
          git diff --cached --quiet || { git commit -m "diag: link tests output [skip ci]"; git push; }

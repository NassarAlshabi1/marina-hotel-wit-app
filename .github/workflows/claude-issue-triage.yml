# Claude Issue Triage - تصنيف تلقائي للـ Issues
# يستخدم FreeModel API (OpenAI-compatible) مع gpt-5.4-mini
# يتطلب FREEMODEL_API_KEY في GitHub Secrets

name: Claude Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-triage Issue
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          
          PROMPT="Analyze this GitHub issue and determine appropriate labels.

          Title: $ISSUE_TITLE
          Body: $ISSUE_BODY

          Available labels: bug, enhancement, question, documentation, help wanted, good first issue, priority: high, priority: low

          Respond with ONLY the label names separated by commas, nothing else. Example: bug, priority: high"
          
          RESPONSE=$(curl -s -X POST "https://api.freemodel.dev/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.FREEMODEL_API_KEY }}" \
            -d "$(jq -n \
              --arg model "gpt-5.4-mini" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [{role: "system", content: "You are an issue triage assistant. Respond with label names only."}, {role: "user", content: $prompt}],
                max_tokens: 100,
                temperature: 0.1
              }' )")
          
          LABELS=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' | tr -d ' ')
          
          if [ -n "$LABELS" ]; then
            echo "Adding labels: $LABELS"
            # Add each label
            for label in $(echo "$LABELS" | tr ',' '\n'); do
              label=$(echo "$label" | xargs)
              if [ -n "$label" ]; then
                gh issue edit "$ISSUE_NUMBER" --add-label "$label" 2>/dev/null || echo "Label '$label' not available"
              fi
            done
          else
            echo "❌ Could not determine labels"
            echo "$RESPONSE" | head -10
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

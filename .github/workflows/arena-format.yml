# ⚠️ مؤقت: تنسيق الملفات المعدَّلة عبر dart format ودفع الناتج (بيئة الوكيل بلا Flutter SDK)
name: Arena Format (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Report unformatted files
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed . 2>&1 | tail -20

      - name: Format
        run: dart format .

      - name: Run identity audit tests
        continue-on-error: true
        run: |
          mkdir -p .arena
          {
            echo "### identity audit tests ($(date -u +%FT%TZ))"
            flutter test test/unit/financial_identity_audit_test.dart --reporter compact 2>&1 | grep -vE "drift\\):|GeneratedDatabase|_whenConstructed|_handleInstantiated|Invoker|Declarer|asynchronous suspension|This warning|Try to follow|package:drift" | tail -250
          } > .arena/identity-test-report.txt
          tr '\r' '\n' < .arena/identity-test-report.txt | grep -E "All tests passed|Some tests failed|\[E\]|Failing tests|Expected:|Actual:|Which:|Exception|Error" | tail -40

      - name: Run guard suites
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### guard suites"
            flutter test \
              test/unit/id_resolver_cross_device_test.dart \
              test/unit/mirror_uuid_link_migration68_test.dart \
              test/unit/outbox_dao_comprehensive_test.dart \
              test/unit/sync_pull_service_pushed_to_remote_test.dart \
              test/unit/conflict_resolution_fix_test.dart \
              --reporter compact 2>&1 | tail -30
          } >> .arena/identity-test-report.txt
          tail -c 800 .arena/identity-test-report.txt

      - name: Push formatted files
        run: |
          git config user.name "arena-verify-bot"
          git config user.email "arena-verify-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(arena): dart format + test report [skip ci]"
          git push

name: CI
permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - 'capy/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # هذا السطر ضروري لعملية الـ auto-commit
          ref: ${{ github.head_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      # 1. تطبيق الإصلاحات التلقائية (مثل const و sort_dependencies)
      - name: Apply Dart Fixes
        run: dart fix --apply
        
      # 2. حفظ التغييرات ورفعها تلقائياً للمستودع إذا وجد إصلاحات
      - name: Auto Commit Fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated lint fixes (dart fix)"
          skip_fetch: true

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      
      # تحليل الكود (سيفشل فقط إذا بقيت أخطاء لا يمكن إصلاحها تلقائياً)
      - name: Flutter Analyze
        run: flutter analyze --no-pub
      
      - name: Dart Format
        run: dart format --set-exit-if-changed .
        continue-on-error: true
      
      - name: Run tests
        run: flutter test --coverage
      
      - name: Coverage summary
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lcov
          lcov --summary coverage/lcov.info | tee /tmp/coverage-summary.txt
          {
            echo "## Coverage summary";
            tail -n 4 /tmp/coverage-summary.txt;
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: mobile/coverage

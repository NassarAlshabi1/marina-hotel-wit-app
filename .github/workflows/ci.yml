concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: CI
permissions:
  contents: read
  pull-requests: write

# ═══════════════════════════════════════════════════════════════
# يعمل على كل الفروع
# ═══════════════════════════════════════════════════════════════
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Dart Format
        run: dart format --set-exit-if-changed .
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════
      #  اختبارات
      #  --exclude-tags integration: يستثني اختبارات tagged بـ @Tags(['integration'])
      #  --concurrency=2: تقليل ضغط الذاكرة
      #  --timeout=60s: timeout قصير لمنع التعليق
      #  test/flutter_test_config.dart يُهيِّئ sqfliteFfiInit() تلقائياً
      # ═══════════════════════════════════════════════════════════
      - name: Run tests
        run: flutter test --coverage --concurrency=2 --timeout=60s --exclude-tags integration --reporter compact
        continue-on-error: true

      - name: Coverage summary
        if: always()
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq lcov > /dev/null 2>&1
          if [ -f coverage/lcov.info ]; then
            lcov --summary coverage/lcov.info | tee /tmp/coverage-summary.txt
            {
              echo "## 📊 Coverage Summary"
              echo ""
              echo "**Branch:** \`${{ github.ref_name }}\`"
              echo ""
              echo '```'
              tail -n 4 /tmp/coverage-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 📊 Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage file generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-report-${{ github.ref_name }}-${{ github.run_id }}
          path: mobile/coverage
          if-no-files-found: ignore
          retention-days: 14

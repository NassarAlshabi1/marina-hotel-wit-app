name: Worker CI

# Cloudflare Worker (worker/): typecheck + vitest suite (miniflare D1 + DO).
# Independent from the Flutter pipelines so worker changes validate alone.

on:
  push:
    branches: ['**']
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Worker typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Tests (vitest + miniflare D1/Durable Objects)
        run: npm test

      - name: Deploy dry-run (config validation)
        run: npx wrangler deploy --dry-run --outdir dist

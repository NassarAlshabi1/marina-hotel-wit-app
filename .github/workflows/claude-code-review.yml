# AI Code Review - مراجعة تلقائية للـ Pull Requests
# يستخدم FreeModel API (OpenAI-compatible) مع gpt-5.4
# يتطلب FREEMODEL_API_KEY في GitHub Secrets

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Code Review
        env:
          FREEMODEL_API_KEY: ${{ secrets.FREEMODEL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import subprocess
          import urllib.request
          import os
          import sys

          pr_number = os.environ["PR_NUMBER"]
          pr_title = os.environ["PR_TITLE"]
          repo = os.environ["REPOSITORY"]
          api_key = os.environ["FREEMODEL_API_KEY"]
          gh_token = os.environ["GH_TOKEN"]

          # Get PR diff
          print("Fetching PR diff...")
          result = subprocess.run(
              ["gh", "pr", "diff", pr_number, "--repo", repo],
              capture_output=True, text=True
          )
          diff = result.stdout[:50000]  # Truncate to avoid token limits

          if not diff:
              print("No diff found, skipping review")
              sys.exit(0)

          print(f"Diff length: {len(diff)} chars")

          # Prepare the API request
          prompt = f"""You are an expert code reviewer. Review the following pull request diff and provide constructive feedback.

          PR Title: {pr_title}

          Diff:
          ```
          {diff}
          ```

          Review for:
          1. Bugs and potential issues
          2. Security vulnerabilities
          3. Code style and best practices
          4. Performance concerns
          5. Missing tests

          Provide your review in a clear, structured format with Markdown. Be specific about which files and lines have issues."""

          payload = {
              "model": "gpt-5.4",
              "messages": [
                  {"role": "system", "content": "You are an expert code reviewer. Be concise but thorough."},
                  {"role": "user", "content": prompt}
              ],
              "max_tokens": 4000,
              "temperature": 0.3
          }

          # Call FreeModel API
          print("Calling FreeModel API...")
          req = urllib.request.Request(
              "https://api.freemodel.dev/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  response = json.loads(resp.read().decode())
              review = response["choices"][0]["message"]["content"]
              print("Review generated successfully!")
          except Exception as e:
              error_msg = str(e)
              print(f"API call failed: {error_msg}")
              review = None

          if not review:
              print("Failed to generate review")
              sys.exit(1)

          # Post review as PR comment
          comment = f"""## AI Code Review (FreeModel gpt-5.4)

          {review}

          ---
          *This review was generated automatically by [FreeModel](https://freemodel.dev) using gpt-5.4.*"""

          # Write comment to file and post with gh CLI
          with open("/tmp/review_comment.md", "w") as f:
              f.write(comment)

          result = subprocess.run(
              ["gh", "pr", "comment", pr_number, "--repo", repo, "--body-file", "/tmp/review_comment.md"],
              capture_output=True, text=True
          )

          if result.returncode == 0:
              print("Review posted successfully!")
          else:
              print(f"Failed to post comment: {result.stderr}")
              sys.exit(1)
          PYTHON_SCRIPT

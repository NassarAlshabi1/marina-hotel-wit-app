name: Android Launch Probe (real emulator)

# The Kotlin build is green and the Robolectric launch smoke test passes, yet
# the app closes right after MainActivity on real hardware with no stack trace.
# Robolectric cannot see native libraries, real Firebase init, real SQLite or
# the platform's own kill paths, so this job reproduces the launch on an actual
# Android runtime and captures the truth:
#
#   * logcat (main + crash buffers, threadtime)
#   * `dumpsys activity exit-info` — the OS's own record of *why* the process
#     died (Java crash / native crash / ANR / low memory / SIGKILL)
#   * /data/tombstones and /data/anr (via adb root)
#   * the marina-diag stages.log / crash.log written by the debug launchers
#
# It launches three components in order: the real MainActivity, then the
# framework-only BareLaunchActivity and the staged LaunchProbeActivity, so the
# failure is bisected inside one run.

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Android API level of the emulator system image
        required: false
        default: '34'
  push:
    branches:
      - agent/android-cloudflare
      # فرع الجلسة: حلقة تشخيص سريعة — الأدلة تُنشر في check-run فيُقرأ
      # سبب أي فشل من API بلا حاجة إلى سجلات Actions (غير قابلة للقراءة آلياً).
      - arena/be8302d7-marina-hotel-wit-app
    paths:
      - '.github/workflows/android-emulator-launch-probe.yml'
      - '.github/scripts/emulator-launch-probe.sh'
      - 'mobile/android/**'

permissions:
  contents: read
  # نشر أدلة الفحص في check-run مخصّص (اسمه android-launch-probe-diagnostics)
  # حتى يُقرأ سبب الفشل من API بلا سجلات ولا حزمة أدلة.
  checks: write

concurrency:
  group: android-launch-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Launch on emulator (API ${{ github.event.inputs.api_level || '34' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-probe-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore signing keystore
        working-directory: .
        run: |
          grep -oP '(?<=KEYSTORE_BASE64: )[A-Za-z0-9+/=]+' mobile/Keystore.txt \
            | base64 -d > mobile/android/app/marina-hotel-key.jks
          sha256sum mobile/android/app/marina-hotel-key.jks

      - name: Ensure Android SDK components
        run: |
          set -x
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;34.0.0" > /dev/null || true
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Enable KVM group perms
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Launch probe on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          # The action executes this input line by line, so the probe must be a
          # single command backed by a script file (variables and functions
          # would otherwise be lost between lines).
          script: bash .github/scripts/emulator-launch-probe.sh

      - name: Publish probe diagnostics to a check run
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/launch-probe-diagnostics.json"
          import json, os, pathlib

          def read(name, keep=0):
              path = pathlib.Path("probe") / name
              if not path.exists():
                  return f"(missing: {name})"
              text = path.read_text(errors="replace")
              if keep and len(text) > keep:
                  text = text[-keep:]
              return text

          states = []
          for label in ("main", "bare", "probe"):
              states.append(f"{label}: " + read(f"state-{label}.txt").strip())

          sections = [
              ("state", "\n".join(states)),
              ("install", read("install.txt", 1500)),
              ("am-start-main", read("am-start-main.txt", 1500)),
              ("interesting-main", read("interesting-main.txt", 12000)),
              ("logcat-crash-main", read("logcat-crash-main.txt", 12000)),
              ("exit-info-main", read("exit-info-main.txt", 8000)),
              ("marina-diag", read("stages.log", 5000) + "\n" + read("crash.log", 5000)),
          ]
          text = "\n\n".join(f"===== {title} =====\n{body}" for title, body in sections)[:60000]
          main_state = read("state-main.txt").strip()
          print(json.dumps({
              "name": "android-launch-probe-diagnostics",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              # محايد عمداً: القناة للأدلة فقط، والفشل يُعلنه الـjob نفسه.
              "conclusion": "neutral",
              "output": {
                  "title": f"Launch probe evidence — main: {main_state or 'MISSING'}",
                  "summary": f"state-main: {main_state or 'MISSING'}",
                  "text": text,
              },
          }))
          PY
          gh api -X POST "repos/${{ github.repository }}/check-runs" \
            --input "$RUNNER_TEMP/launch-probe-diagnostics.json" >/dev/null \
            || echo "diagnostics check-run publish failed"

      - name: Upload launch probe evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: marina-launch-probe
          path: probe
          if-no-files-found: warn
          retention-days: 14

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Marina Hotel — Semantic Pull Request
#  Custom validation script (replaces amannn/action-semantic-pull-request)
#
#  يضمن أن عناوين PR تتبع Conventional Commits:
#    feat: ✨ إضافة ميزة جديدة
#    fix: 🐛 إصلاح خطأ
#    refactor: ♻️ إعادة هيكلة
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Semantic PR

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: semantic-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 🔍 Validate PR title follows Conventional Commits
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          #!/bin/bash
          set -e

          echo "PR #$PR_NUMBER"
          echo "Title: $PR_TITLE"
          echo ""

          # Valid conventional commit types
          VALID_TYPES="feat fix refactor perf docs test chore ci style build revert"

          # Extract type from title (everything before the first colon)
          TYPE=$(echo "$PR_TITLE" | cut -d: -f1 | tr -d ' ')

          # Check if type has a scope (e.g., feat(scope))
          BASE_TYPE=$(echo "$TYPE" | cut -d'(' -f1)

          # Validate type
          VALID=false
          for t in $VALID_TYPES; do
            if [ "$BASE_TYPE" = "$t" ]; then
              VALID=true
              break
            fi
          done

          if [ "$VALID" = "false" ]; then
            echo "❌ Invalid PR title: '$PR_TITLE'"
            echo ""
            echo "The type '$BASE_TYPE' is not a valid Conventional Commit type."
            echo "Valid types: $VALID_TYPES"
            echo ""
            echo "Expected format: <type>: <subject>"
            echo "Examples:"
            echo "  feat: Add new feature"
            echo "  fix: Resolve bug in login"
            echo "  refactor: Clean up database code"
            echo ""
            echo "See: https://www.conventionalcommits.org/"
            exit 1
          fi

          # Extract subject (everything after the first colon)
          SUBJECT=$(echo "$PR_TITLE" | cut -d: -f2- | sed 's/^ *//')

          # Check subject is not empty
          if [ -z "$SUBJECT" ]; then
            echo "❌ Invalid PR title: '$PR_TITLE'"
            echo ""
            echo "The subject (text after the colon) is empty."
            echo "Expected format: <type>: <subject>"
            exit 1
          fi

          echo "✅ Valid Conventional Commit: $TYPE → $SUBJECT"

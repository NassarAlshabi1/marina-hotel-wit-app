# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Marina Hotel — Semantic Pull Request
#  Based on Very Good Workflows: semantic_pull_request.yml
#
#  يضمن أن عناوين PR تتبع Conventional Commits:
#    feat: ✨ إضافة ميزة جديدة
#    fix: 🐛 إصلاح خطأ
#    refactor: ♻️ إعادة هيكلة
#    perf: ⚡ تحسين أداء
#    docs: 📝 توثيق
#    test: 🧪 اختبارات
#    chore: 🔧 صيانة
#    ci: 👷 CI/CD
#    style: 💄 تنسيق
#    build: 📦 بناء
#
#  الأنواع المقبولة مستوحاة من:
#  https://www.conventionalcommits.org/en/v1.0.0/
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Semantic PR

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: write

jobs:
  semantic:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 🔍 Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            chore
            ci
            style
            build
            revert
          requireScope: false
          subjectPattern: ^[A-Z\u0600-\u06FF].+$
          subjectPatternError: |
            The subject "{subject}" found in the PR title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with an uppercase character or Arabic letter, and has no
            trailing period.
          wip: true
          validateSingleCommit: false

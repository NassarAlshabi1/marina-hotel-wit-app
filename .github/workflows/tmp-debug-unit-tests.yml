# TEMPORARY debug workflow — failures-only format verdicts on test files.
# DELETE AFTER DIAGNOSIS.
name: TMP Debug Unit Tests
on:
  push:
    branches:
      - arena/01a0eff0-marina-hotel-wit-app
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Failures-only verdicts
        run: |
          set +e
          BAD=0
          for f in test/auth/permission_actions_test.dart test/hotel_day_key_fix_guard_test.dart test/production_readiness_test.dart test/utils/low_ram_performance_test.dart test/bookings_outbox_pull_diagnosis_test.dart lib/screens/settings/settings_users.dart; do
            if dart format --set-exit-if-changed --output=none "$f" > /dev/null 2>&1; then
              echo "OK: $f"
            else
              echo "::error::FMT_BAD: $f"
              BAD=$((BAD+1))
            fi
          done
          echo "::notice::DIAG BAD_COUNT=$BAD"

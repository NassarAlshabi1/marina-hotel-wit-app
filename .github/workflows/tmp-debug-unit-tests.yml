# TEMPORARY debug workflow — diagnoses lint-test failure steps.
# DELETE AFTER DIAGNOSIS.
name: TMP Debug Unit Tests
on:
  push:
    branches:
      - arena/01a0eff0-marina-hotel-wit-app
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Diagnose build_runner
        run: |
          set +e
          timeout 300 dart run build_runner build > /tmp/br.log 2>&1
          echo "BR_EXIT=$?" >> "$GITHUB_ENV"
          tail -n 5 /tmp/br.log || true
      - name: Diagnose analyze errors
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/ana.log 2>&1
          echo "ANA_EXIT=$?" >> "$GITHUB_ENV"
          grep -E "error •|error:" /tmp/ana.log | head -n 10 || true
      - name: Diagnose format
        run: |
          set +e
          dart format --set-exit-if-changed lib test > /tmp/fmt.log 2>&1
          echo "FMT_EXIT=$?" >> "$GITHUB_ENV"
          grep -E "Changed" /tmp/fmt.log | head -n 40 || true
      - name: Emit diagnosis as annotations
        if: always()
        run: |
          echo "::notice::DIAG BR_EXIT=${{ env.BR_EXIT }} ANA_EXIT=${{ env.ANA_EXIT }} FMT_EXIT=${{ env.FMT_EXIT }}"
          grep -E "error •|error:" /tmp/ana.log | head -n 8 | while IFS= read -r line; do
            echo "::error::ANA: $line"
          done
          grep -E "^Changed " /tmp/fmt.log | head -n 30 | while IFS= read -r line; do
            echo "::error::FMT: $line"
          done
          tail -n 3 /tmp/br.log | while IFS= read -r line; do
            echo "::notice::BR: $line"
          done

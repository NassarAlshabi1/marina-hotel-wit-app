# TEMPORARY debug workflow — show manager format diff.
# DELETE AFTER VERIFICATION.
name: TMP Debug Unit Tests
on:
  push:
    branches:
      - arena/01a0eff0-marina-hotel-wit-app
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Show format diff
        run: |
          set +e
          dart format --output=show lib/services/cloudflare_sync_manager.dart > /tmp/formatted.dart 2> /dev/null
          python3 -c "
          import subprocess
          d = subprocess.run(['diff', '-U1', 'lib/services/cloudflare_sync_manager.dart', '/tmp/formatted.dart'], capture_output=True, text=True).stdout
          d = '\n'.join([l for l in d.split('\n') if not l.startswith(('---', '+++', '+Formatted'))])
          print('DIFFCHARS=' + str(len(d)))
          d = d[:5500]
          enc = d.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
          print('::error::FMT_DIFF%0A' + enc)
          "

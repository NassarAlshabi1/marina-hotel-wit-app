# TEMPORARY debug workflow — lists unformatted files (robust: rewrite + git).
# DELETE AFTER DIAGNOSIS.
name: TMP Debug Unit Tests
on:
  push:
    branches:
      - arena/01a0eff0-marina-hotel-wit-app
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: List unformatted files via rewrite + git status
        run: |
          set +e
          dart format lib test > /tmp/fmt2.log 2>&1
          echo "FMT_WRITE_EXIT=$?" >> "$GITHUB_ENV"
          tail -n 3 /tmp/fmt2.log || true
          git -C "$GITHUB_WORKSPACE" status --short | head -n 60 || true
      - name: Emit file list as annotations
        if: always()
        run: |
          set +e
          echo "::notice::DIAG FMT_WRITE_EXIT=${{ env.FMT_WRITE_EXIT }}"
          git -C "$GITHUB_WORKSPACE" status --short | head -n 50 | while IFS= read -r line; do
            echo "::error::UNFORMATTED: $line"
          done
          git -C "$GITHUB_WORKSPACE" status --short | wc -l | while IFS= read -r n; do
            echo "::notice::DIAG UNFORMATTED_COUNT=$n"
          done

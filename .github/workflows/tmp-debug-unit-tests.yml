# TEMPORARY debug workflow — verify the 3 fixed/checked files are format-clean.
# DELETE AFTER DIAGNOSIS.
name: TMP Debug Unit Tests
on:
  push:
    branches:
      - arena/01a0eff0-marina-hotel-wit-app
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify format
        run: |
          set +e
          BAD=0
          for f in test/auth/permission_actions_test.dart test/bookings_outbox_pull_diagnosis_test.dart lib/screens/settings/settings_users.dart; do
            if dart format --set-exit-if-changed --output=none "$f" > /dev/null 2>&1; then
              echo "::notice::FMT_OK: $f"
            else
              echo "::error::STILL_BAD: $f"
              BAD=$((BAD+1))
            fi
          done
          echo "::notice::DIAG VERIFY_BAD_COUNT=$BAD (bookings+settings_users expect 2 pre-existing)"

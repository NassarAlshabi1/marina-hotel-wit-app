# TEMPORARY debug workflow — verify fresh-client fix.
# DELETE AFTER VERIFICATION.
name: TMP Debug Unit Tests
on:
  push:
    branches:
      - arena/01a0eff0-marina-hotel-wit-app
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify fresh-client fix
        run: |
          set +e
          for f in lib/providers/appwrite_providers.dart test/connection_client_freshness_test.dart; do
            if dart format --set-exit-if-changed --output=none "$f" > /dev/null 2>&1; then
              echo "::notice::FMT_OK: $f"
            else
              echo "::error::FMT_BAD: $f"
            fi
          done
          flutter analyze lib/providers/appwrite_providers.dart test/connection_client_freshness_test.dart > /tmp/ana.log 2>&1
          echo "::notice::DIAG ANA_EXIT=$?"
          grep -E ' (error|warning|info) • ' /tmp/ana.log | head -n 8 | while IFS= read -r line; do
            echo "::error::ANA: $line"
          done
          flutter test test/connection_client_freshness_test.dart test/connection_status_d1_test.dart test/cloudflare_connection_fixes_test.dart test/sync_indicator_connection_test.dart test/cloudflare_auto_connection_card_test.dart --reporter compact > /tmp/t.log 2>&1
          echo "::notice::DIAG TEST_EXIT=$? (connection tests)"
          tail -n 3 /tmp/t.log

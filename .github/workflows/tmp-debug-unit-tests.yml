# TEMPORARY debug workflow — show analyzer issues on extraction files.
# DELETE AFTER VERIFICATION.
name: TMP Debug Unit Tests
on:
  push:
    branches:
      - arena/01a0eff0-marina-hotel-wit-app
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Show analyzer issues
        run: |
          set +e
          flutter analyze lib/services/sync/fk_rules.dart lib/services/cloudflare_sync_manager.dart > /tmp/ana.log 2>&1
          echo "::notice::DIAG ANA_EXIT=$?"
          grep -E ' (error|warning|info) • ' /tmp/ana.log | head -n 8 | while IFS= read -r line; do
            echo "::error::ANA: $line"
          done
          echo "::notice::DIAG ANA_LINES=$(grep -cE ' (error|warning|info) • ' /tmp/ana.log)"

# Name: Build Flutter Release APK
#
# This workflow is triggered on pull requests affecting files in the 'mobile/' directory,
# or manually via the 'workflow_dispatch' event.
name: Build Flutter Release APK

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-release.yml'
  # Allows manual triggering of the workflow from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build-release-apk:
    # Runs the job on the latest Ubuntu runner
    runs-on: ubuntu-latest
    defaults:
      run:
        # All commands will execute from the 'mobile' directory
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-read-only: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          cache: true
          cache-key: flutter-${{ runner.os }}-3.38.3

      - name: Install Android SDK components (API 36)
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Installing Android SDK Platform 36 and Build-Tools..."
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" || sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.1" || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --list | head -n 50
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify Android Signing Files
        # Local keystore and key.properties are committed to repo
        # No secrets or base64 decoding needed
        run: |
          echo "Verifying local signing files..."
          ls -la android/app/release.keystore
          ls -la android/key.properties
          echo "Local signing files verified successfully."

      - name: Clean build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (e.g., using Freezed, json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: |
          for i in 1 2 3; do
            echo "=== Build attempt $i of 3 ==="
            if flutter build apk --release; then
              echo "Build succeeded!"
              exit 0
            else
              echo "Build failed on attempt $i"
              if [ $i -lt 3 ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
              fi
            fi
          done
          echo "All build attempts failed"
          exit 1
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
        timeout-minutes: 30

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'marina-hotel-release-${{ github.run_number }}'
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Signing files preserved for debugging/reuse
      # - name: Clean signing files
      #   if: ${{ always() }}
      #   run: |
      #     echo "Cleaning up sensitive signing files..."
      #     rm -f android/app/release.keystore
      #     rm -f android/key.properties

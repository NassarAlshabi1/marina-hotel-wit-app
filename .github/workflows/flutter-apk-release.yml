# Name: Build Flutter Release APK
#
# This workflow is triggered on pull requests affecting files in the 'mobile/' directory,
# or manually via the 'workflow_dispatch' event.
name: Build Flutter Release APK

on:
  push:
    branches:
      - main
      - 'capy/**'
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-release.yml'
  # Allows manual triggering of the workflow from the GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-apk:
    # Runs the job on the latest Ubuntu runner
    runs-on: ubuntu-latest
    # Increase job timeout to allow build_runner and pub get more time
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        # All commands will execute from the 'mobile' directory
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          cache: true
          cache-key: flutter-${{ runner.os }}-3.38.3

      - name: Cache pub cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Android SDK components (API 35)
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Installing Android SDK Platform 35 and Build-Tools..."
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --list | head -n 50
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify Android Signing Files
        # Local keystore and key.properties are committed to repo
        # No secrets or base64 decoding needed
        run: |
          echo "Verifying local signing files..."
          ls -la android/app/release.keystore
          ls -la android/key.properties
          echo "Local signing files verified successfully."

      - name: Clean build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Determine dynamic build version
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          BUILD_NAME="${BASE_VERSION}.${BUILD_NUMBER}"
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Build runner - clean generated files
        run: flutter pub run build_runner clean

      - name: Generate code (e.g., using Freezed, json_serializable)
        # Use delete-conflicting-outputs and verbose logging to avoid conflicts and aid debugging
        run: flutter pub run build_runner build --delete-conflicting-outputs --verbose

      - name: Build release APK
        # Uses unified keystore with consistent SHA-1: 67:12:57:A2:9B:53:FA:71:AC:BC:0F:A8:C9:54:2F:3F:46:0B:A8:1C
        # Build only for arm64-v8a architecture (modern 64-bit Android devices)
        run: flutter build apk --release --target-platform android-arm64 --build-name ${{ steps.version.outputs.build_name }} --build-number ${{ steps.version.outputs.build_number }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'marina-hotel-release-${{ steps.version.outputs.build_name }}'
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Signing files preserved for debugging/reuse
      # - name: Clean signing files
      #   if: ${{ always() }}
      #   run: |
      #     echo "Cleaning up sensitive signing files..."
      #     rm -f android/app/release.keystore
      #     rm -f android/key.properties

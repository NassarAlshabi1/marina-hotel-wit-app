# Name: Build Flutter Release APK
#
# This workflow is triggered on pull requests affecting files in the 'mobile/' directory,
# or manually via the 'workflow_dispatch' event.
name: Build Flutter Release APK

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-release.yml'
  # Allows manual triggering of the workflow from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build-release-apk:
    # Runs the job on the latest Ubuntu runner
    runs-on: ubuntu-latest
    defaults:
      run:
        # All commands will execute from the 'mobile' directory
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Verify Android Signing Files
        # Local keystore and key.properties are committed to repo
        # No secrets or base64 decoding needed
        run: |
          echo "Verifying local signing files..."
          ls -la android/app/release.keystore
          ls -la android/key.properties
          echo "Local signing files verified successfully."

      - name: Clean build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (e.g., using Freezed, json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Release APK (ARM64 only)
        run: |
          echo "🔨 Building Release APK with Ditto (ARM64 only)..."
          flutter build apk --release --target-platform android-arm64 --verbose
          echo "✅ APK built successfully (ARM64)"

      - name: Build App Bundle (AAB) - Recommended
        run: |
          echo "🔨 Building App Bundle (ARM64 optimized)..."
          flutter build appbundle --release
          echo "✅ AAB built successfully - Recommended for distribution"
      
      - name: Get APK info
        id: apk-info
        run: |
          APK_SIZE=$(stat -c%s "build/app/outputs/flutter-apk/app-release.apk" | numfmt --to=iec-i --suffix=B)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK Size: $APK_SIZE"
      
      - name: Get AAB info
        id: aab-info
        run: |
          AAB_SIZE=$(stat -c%s "build/app/outputs/bundle/release/app-release.aab" | numfmt --to=iec-i --suffix=B)
          echo "aab_size=$AAB_SIZE" >> $GITHUB_OUTPUT
          echo "AAB Size: $AAB_SIZE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'marina-hotel-apk-${{ github.run_number }}'
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'marina-hotel-aab-${{ github.run_number }}'
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Signing files preserved for debugging/reuse
      # - name: Clean signing files
      #   if: ${{ always() }}
      #   run: |
      #     echo "Cleaning up sensitive signing files..."
      #     rm -f android/app/release.keystore
      #     rm -f android/key.properties

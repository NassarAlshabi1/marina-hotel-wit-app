name: Build Flutter Release APK

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-release.yml'
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.35.6'
      FLUTTER_HOME: "${{ runner.temp }}/flutter"
      PUB_CACHE: "${{ runner.temp }}/pub-cache"
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        run: |
          set -euo pipefail
          mkdir -p "$PUB_CACHE"
          rm -rf "$FLUTTER_HOME"
          curl -L "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -o "$RUNNER_TEMP/flutter.tar.xz"
          tar xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/flutter" "$FLUTTER_HOME"
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_HOME/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          flutter config --no-analytics
          flutter --version

      - name: Clean build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: 'marina-hotel-release-${{ github.run_number }}'
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

# Build Flutter Release APK
name: Build Flutter Release APK

on:
  push:
    branches:
      - main
      - 'marina'
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-release.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Working Directory
        run: |
          echo "Flutter version:"
          flutter --version
          echo ""
          echo "Working directory: $(pwd)"
          echo "Contents:"
          ls -la
          echo ""
          echo "Checking pubspec.yaml:"
          ls -la pubspec.yaml || echo "pubspec.yaml NOT FOUND in $(pwd)"
        working-directory: mobile

      - name: Cache pub cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Android SDK components (API 35)
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Installing Android SDK Platform 35, Build-Tools, NDK, and CMake..."
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --list | head -n 50

      - name: Verify Android Signing Files
        run: |
          echo "Verifying local signing files..."
          ls -la android/app/release.keystore
          ls -la android/key.properties
          echo "Local signing files verified successfully."
        working-directory: mobile

      - name: Clean build artifacts
        run: flutter clean
        working-directory: mobile

      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Determine dynamic build version
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          BUILD_NAME="${BASE_VERSION}.${BUILD_NUMBER}"
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        working-directory: mobile

      - name: Build runner - clean generated files
        run: flutter pub run build_runner clean
        working-directory: mobile

      - name: Generate code (Freezed, json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs --verbose
        working-directory: mobile

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --build-name ${{ steps.version.outputs.build_name }} --build-number ${{ steps.version.outputs.build_number }}
        working-directory: mobile

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'marina-hotel-release-${{ steps.version.outputs.build_name }}'
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

# Name: Build Flutter Release APK
#
# This workflow is triggered on pull requests affecting files in the 'mobile/' directory,
# or manually via the 'workflow_dispatch' event.
name: Build Flutter Release APK

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-release.yml'
  # Allows manual triggering of the workflow from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build-release-apk:
    # Runs the job on the latest Ubuntu runner
    runs-on: ubuntu-latest
    defaults:
      run:
        # All commands will execute from the 'mobile' directory
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Configure Android Signing Files
        # We use secrets directly in the 'run' command to avoid security checks
        # that lead to false negatives (where the secrets are present but appear empty).
        run: |
          # 1. Decode the Base64 keystore file and save it to the Android project path
          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          
          # 2. Create the key.properties file with signing credentials
          # This file is used by the build.gradle to access the signing details.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > android/key.properties
          
          echo "Signing files created successfully and securely."

      - name: Clean build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (e.g., using Freezed, json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        # The signing process is now automatically handled by Gradle/Flutter using the
        # key.properties file created in the previous step.
        run: flutter build apk --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'marina-hotel-release-${{ github.run_number }}'
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Clean signing files
        # Use always() to ensure sensitive files are removed even if the build fails
        if: ${{ always() }}
        run: |
          echo "Cleaning up sensitive signing files..."
          rm -f android/app/release.keystore
          rm -f android/key.properties

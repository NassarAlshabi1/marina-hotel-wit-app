name: Build Flutter Release APK New

on:
  push:
    branches:
      - main
      - 'capy/**'
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-release.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk-release.yml'

  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true

      - name: Cache pub cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Android SDK components
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android signing files
        run: |
          ls -la android/app/release.keystore
          ls -la android/key.properties

      - name: Clean build
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Set build version
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          echo "build_name=${BASE_VERSION}.${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build release APK
        run: flutter build apk --release \
          --build-name ${{ steps.version.outputs.build_name }} \
          --build-number ${{ steps.version.outputs.build_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marina-hotel-release-${{ steps.version.outputs.build_name }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

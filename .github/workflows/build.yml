name: Build

# ═══════════════════════════════════════════════════════════════
#  Marina Hotel — Quality Gate (4 of 4): Build Verification
# ═══════════════════════════════════════════════════════════════
#
#  منصات مدعومة:
#  - Android (APK debug + release) — مدعوم
#  - Windows — غير مدعوم حالياً (لا يوجد windows/ directory)
#  - Linux — غير مدعوم حالياً
#
#  أي فشل في البناء = رفض الـ PR.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  pull_request:
    branches: [main, marina, 'refactor/**', 'feature/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  android:
    name: 🤖 Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔨 Build debug APK
        run: flutter build apk --debug --no-pub
        continue-on-error: true  # مؤقتاً — قد تحتاج secrets (keystore)

      - name: 📦 Upload debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: 📋 Build summary
        if: always()
        run: |
          {
            echo "## 🤖 Android Build Report"
            echo ""
            echo "| Build Type | Status |"
            echo "|---|---|"
            echo "| Debug APK | ${{ job.status }} |"
            echo ""
            echo "**Note**: Release APK requires keystore secrets (not configured in PR builds)."
          } >> "$GITHUB_STEP_SUMMARY"

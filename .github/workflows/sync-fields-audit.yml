# .github/workflows/sync-fields-audit.yml
#
# فحص تلقائي لـ adapters على كل PR
# يمنع فقدان البيانات بسبب حقول مفقودة في validFieldsPerCollection

name: Sync Fields Audit

on:
  pull_request:
    branches: [main, marina]
    paths:
      - 'mobile/lib/services/adapters/**'
      - 'mobile/lib/services/appwrite_sync_utils.dart'
      - 'mobile/lib/services/local_db.dart'
      - 'mobile/test/sync_fields_audit_test.dart'

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run sync fields audit (flutter test)
        id: audit
        run: |
          OUTPUT=$(flutter test test/sync_fields_audit_test.dart 2>&1 || true)
          echo "$OUTPUT"
          # الفحص يمر إذا ظهر "tests passed." أو "All tests passed!" في المخرجات.
          # flutter test يُنتج تنسيقات مختلفة حسب البيئة:
          #   - TTY: "All tests passed!"
          #   - no-TTY (CI): "🎉 N tests passed."
          if echo "$OUTPUT" | grep -qE "(All tests passed!|tests passed\.)"; then
            # نتأكد أيضاً من عدم وجود فشل
            if echo "$OUTPUT" | grep -qE "(Some tests failed|FAILED)"; then
              echo "passed=false" >> $GITHUB_OUTPUT
              echo "issues=1" >> $GITHUB_OUTPUT
            else
              echo "passed=true" >> $GITHUB_OUTPUT
              echo "issues=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "issues=1" >> $GITHUB_OUTPUT
          fi

      - name: Flutter analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Fail if audit found issues
        if: steps.audit.outputs.passed != 'true'
        run: |
          echo "::error::Sync fields audit failed!"
          echo "::error::Some adapter fields are missing from validFieldsPerCollection."
          echo "::error::Run 'flutter test test/sync_fields_audit_test.dart' locally to see details."
          exit 1

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.audit.outputs.passed }}' === 'true';
            const status = passed ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${status} Sync Fields Audit\n\n**Result:** ${passed ? 'All adapter fields are properly synced.' : 'Some fields will be filtered before reaching Appwrite Cloud. Fix before merging!'}\n\nRun \`flutter test test/sync_fields_audit_test.dart\` locally to see details.`
            });

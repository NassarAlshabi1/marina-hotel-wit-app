# .github/workflows/sync-fields-audit.yml
#
# فحص تلقائي لـ adapters على كل PR
# يمنع فقدان البيانات بسبب حقول مفقودة في validFieldsPerCollection

name: Sync Fields Audit

on:
  pull_request:
    branches: [main, marina]
    paths:
      - 'mobile/lib/services/adapters/**'
      - 'mobile/lib/services/appwrite_sync_utils.dart'
      - 'mobile/lib/services/local_db.dart'

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run sync fields audit
        id: audit
        run: |
          OUTPUT=$(dart run lib/scripts/audit_sync_fields.dart 2>&1)
          echo "$OUTPUT"
          # استخرج عدد المشاكل
          ISSUES=$(echo "$OUTPUT" | grep "Total issues:" | grep -o '[0-9]*' || echo "0")
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT

      - name: Flutter analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Fail if audit found issues
        if: steps.audit.outputs.issues != '0'
        run: |
          echo "::error::Sync fields audit found ${{ steps.audit.outputs.issues }} issues!"
          echo "::error::Some adapter fields are missing from validFieldsPerCollection."
          echo "::error::Run 'dart run lib/scripts/audit_sync_fields.dart' locally to see details."
          exit 1

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = '${{ steps.audit.outputs.issues }}';
            const status = issues === '0' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${status} Sync Fields Audit\n\n**Issues found:** ${issues}\n\n${issues === '0' ? 'All adapter fields are properly synced.' : 'Some fields will be filtered before reaching Appwrite Cloud. Fix before merging!'}`
            });

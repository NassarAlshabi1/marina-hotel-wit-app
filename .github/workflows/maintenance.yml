name: Maintenance

# ═══════════════════════════════════════════════════════════════
#  Marina Hotel — Maintenance Workflow
# ═══════════════════════════════════════════════════════════════
#
#  مهام صيانة دورية:
#  1. تنظيف Artifacts القديمة (أقدم من 30 يوم)
#  2. تنظيف workflow runs الفاشلة (أحدث 100 فقط)
#  3. تنظيف cache القديم
#
#  ملاحظة (2026-11-04): استبدلنا استدعاءات `gh api` عبر execSync
#  بواجهة Octokit المدمجة في github-script:
#   - execSync مع --paginate كان يفيض على maxBuffer (ENOBUFS)
#     لأن المستودع فيه آلاف الـ runs
#   - Octokit يتعامل مع الترقيم والحذف مباشرة بلا مخازن وسيطة
#
#  يعمل يومياً عند منتصف الليل UTC + يدوياً.

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # يومياً عند منتصف الليل UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  clean-artifacts:
    name: 🧹 Clean Old Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Delete artifacts older than 30 days
        uses: actions/github-script@v8
        with:
          script: |
            // احسب تاريخ ما قبل 30 يوم
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - 30);

            console.log(`🧹 Cleaning artifacts older than ${cutoffDate.toISOString()}`);

            // اجلب كل الـ artifacts عبر Octokit (ترقيم تلقائي)
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            let deleted = 0;
            for (const artifact of artifacts) {
              const createdAt = new Date(artifact.created_at);
              if (createdAt < cutoffDate) {
                console.log(`🗑️  Deleting: ${artifact.name} (ID: ${artifact.id}, created: ${artifact.created_at})`);
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  deleted++;
                } catch (error) {
                  core.warning(`⚠️  Could not delete artifact ${artifact.id}: ${error.message}`);
                }
              }
            }

            console.log(`✅ Artifact cleanup completed — ${deleted} deleted (of ${artifacts.length})`);

  clean-failed-runs:
    name: 🧹 Clean Failed Workflow Runs
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Delete failed runs (keep last 100)
        uses: actions/github-script@v8
        with:
          script: |
            // احصل على كل الـ runs الفاشلة عبر Octokit (الترتيب: الأحدث أولاً)
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'failure',
              per_page: 100,
            });

            const KEEP = 100;
            // سقف أمان: 200 حذف كحد أقصى لكل تشغيل (يومي) لتجنب
            // استهلاك rate limit عند وجود آلاف الـ runs القديمة
            const MAX_DELETIONS = 200;
            const toDelete = runs.slice(KEEP, KEEP + MAX_DELETIONS);

            console.log(`📊 Total failed runs: ${runs.length}, keeping newest ${KEEP}, deleting now: ${toDelete.length}`);

            let deleted = 0;
            for (const run of toDelete) {
              console.log(`🗑️  Deleting failed run: ${run.name} #${run.run_number} (ID: ${run.id})`);
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                deleted++;
              } catch (error) {
                core.warning(`⚠️  Could not delete run ${run.id}: ${error.message}`);
              }
            }

            console.log(`✅ Failed runs cleanup completed — ${deleted} deleted`);

  clean-old-cache:
    name: 🧹 Clean Old Cache
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Delete old cache entries
        uses: actions/github-script@v8
        with:
          script: |
            console.log('🧹 Cleaning old cache entries...');

            try {
              // احصل على كل الـ caches عبر Octokit
              const caches = await github.paginate(github.rest.cache.getActionsCacheList, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });

              // احذف caches لم تُستخدم منذ أكثر من 7 أيام
              const cutoffDate = new Date();
              cutoffDate.setDate(cutoffDate.getDate() - 7);

              let deleted = 0;
              for (const cache of caches) {
                const lastAccess = new Date(cache.last_accessed_at);
                if (lastAccess < cutoffDate) {
                  console.log(`🗑️  Deleting cache: ${cache.key} (ID: ${cache.id})`);
                  try {
                    await github.rest.cache.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    });
                    deleted++;
                  } catch (e) {
                    // تجاهل — بعض caches لا يمكن حذفها
                  }
                }
              }

              console.log(`✅ Cache cleanup completed — ${deleted} deleted`);
            } catch (error) {
              console.log(`ℹ️  Cache cleanup skipped: ${error.message}`);
            }

name: Android 1GiB RAM profile probe
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ffdb-marina-hotel-wit-app]
    paths:
      - '.github/workflows/android-ram-profile-probe.yml'
permissions:
  contents: read
concurrency:
  group: android-ram-profile-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ram-profile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: google_apis
            arch: x86
            profile: Nexus One
          - api: 26
            target: google_apis
            arch: x86
            profile: pixel_2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify RAM only — do not install or launch the hotel app
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 1024M
          disable-animations: false
          emulator-options: -memory 1024 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p ram-profile-evidence
            timeout --kill-after=10s 60s adb shell cat /proc/meminfo > ram-profile-evidence/meminfo.txt
            timeout --kill-after=10s 60s adb shell getprop > ram-profile-evidence/properties.txt
            python3 .github/scripts/benchmark-environment.py --meminfo ram-profile-evidence/meminfo.txt --output ram-profile-evidence/ram.json
      - name: Preserve profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram-profile-${{ matrix.api }}-${{ matrix.target }}-${{ matrix.arch }}
          path: ram-profile-evidence/
          if-no-files-found: warn
          retention-days: 14

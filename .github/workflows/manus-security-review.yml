name: Manus Security Review

on:
  # This target-based trigger is safe for external PRs because the workflow
  # executes only trusted base-branch code. It becomes active after the file
  # exists in the base branch.
  pull_request_target:
    branches:
      - A
      - marina
      - refactor/clean-v2
      - refactor/performance-fixes-v2
    paths:
      - '**.dart'
      - '**.php'
      - '**.js'
      - '**.ts'
      - '**.yml'
      - '**.yaml'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - 'scripts/**'
      - '.github/workflows/manus-security-review.yml'
  # The current branch is trusted and needs an immediate self-test before the
  # workflow is merged into the base branch, where pull_request_target applies.
  push:
    branches:
      - refactor/performance-fixes-v2
    paths:
      - '**.dart'
      - '**.php'
      - '**.js'
      - '**.ts'
      - '**.yml'
      - '**.yaml'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - 'scripts/**'
      - '.github/workflows/manus-security-review.yml'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional base commit SHA for a manual review range'
        required: false
        type: string
      head_sha:
        description: 'Optional head commit SHA for a manual review range'
        required: false
        type: string
      max_chunks:
        description: 'Maximum Manus chunks (one API task each) to review'
        required: false
        default: '12'
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: manus-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manus-review:
    name: Manus AI Security Review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Resolve trusted review range
        id: range
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha || '' }}
          DISPATCH_HEAD_SHA: ${{ inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER:-}" ]; then
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
            base="${PR_BASE_SHA}"
            head="$(git rev-parse refs/remotes/origin/pr-head)"
          elif [ -n "${DISPATCH_BASE_SHA:-}" ]; then
            base="${DISPATCH_BASE_SHA}"
            head="${DISPATCH_HEAD_SHA}"
          else
            base="$(git rev-parse HEAD^1)"
            head="${DISPATCH_HEAD_SHA}"
          fi
          # workflow_dispatch can name SHAs that are not in the checked-out
          # history (for example a PR base that is not an ancestor of this ref).
          for sha in "$base" "$head"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Build redacted review diff
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          # --unified=8 instead of --unified=80: a 1490-file pull request produced a
          # 4.75 MB diff at U80 (run 39314309799) versus 1.2 MB here. Generated and
          # lock files are excluded because they are machine output, not review targets.
          git diff --no-ext-diff --unified=8 "$BASE_SHA" "$HEAD_SHA" -- \
            '*.dart' '*.php' '*.js' '*.ts' '*.yml' '*.yaml' \
            ':!mobile/docs/**' ':!node_modules/**' \
            ':!**/*.g.dart' ':!**/*.freezed.dart' ':!**/*.mocks.dart' \
            ':!**/package-lock.json' ':!**/pubspec.lock' ':!**/*.min.js' \
            > manus-review.diff
          wc -c manus-review.diff
          echo "changed files in review scope: $(grep -c '^diff --git ' manus-review.diff || true)"

      - name: Explain missing Manus secret
        if: env.MANUS_API_KEY == ''
        run: |
          {
            echo '## Manus Security Review'
            echo ''
            echo '> Skipped because the repository secret `MANUS_API_KEY` is not configured.'
            echo '> Add it under Settings → Secrets and variables → Actions to enable this advisory review.'
            echo '> CodeQL, Semgrep, Trivy, and the other repository security scanners remain authoritative.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Manus security review
        if: env.MANUS_API_KEY != ''
        env:
          MANUS_SECURITY_BLOCKING: 'false'
          REVIEW_SHA: ${{ steps.range.outputs.head }}
          MAX_CHUNKS: ${{ inputs.max_chunks || 12 }}
        run: |
          set -euo pipefail
          # Each chunk is a separate Manus task polled to completion, so the review
          # is bounded by MAX_CHUNKS instead of failing on large pull requests.
          # Files that do not fit are listed as "not reviewed" in the report.
          python3 scripts/manus_security_review.py \
            --diff-file manus-review.diff \
            --sha "$REVIEW_SHA" \
            --max-chunks "$MAX_CHUNKS" \
            --json-output manus-security-report.json \
            --markdown-output manus-security-report.md
          cat manus-security-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Manus review report
        if: always() && hashFiles('manus-security-report.*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manus-security-review-${{ github.run_id }}
          path: |
            manus-security-report.json
            manus-security-report.md
          retention-days: 14

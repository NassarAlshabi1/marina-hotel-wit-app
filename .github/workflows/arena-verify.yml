# ⚠️ ملف مؤقت لغرض واحد: تشغيل `dart format` + اختبارات الهوية المالية على الـ CI
# ودفع النتيجة (ملف منسَّق + تقرير) إلى الفرع — لأن بيئة الوكيل لا تحتوي Flutter SDK
# ولا تصل إلى سجلات Actions. يُحذف بعد أخذ النتيجة.
name: Arena Verify (temporary)

on:
  workflow_dispatch:
  # بديل الـ dispatch: تشغيل عند الدفع لهذا الفرع (workflow_dispatch لا يعمل
  # إلا إذا كان الملف موجودًا على الفرع الافتراضي — وهذا الفرع ليس الافتراضي).
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Report which files fail the format gate
        continue-on-error: true
        run: |
          mkdir -p .arena
          {
            echo "### format gate report ($(date -u +%FT%TZ))"
            echo "--- files that would change (dart format --output=none --set-exit-if-changed .) ---"
            dart format --output=none --set-exit-if-changed . 2>&1 || true
            echo "--- end ---"
          } > .arena/identity-test-report.txt
          cat .arena/identity-test-report.txt

      - name: Format the audit test file
        run: |
          dart format test/unit/financial_identity_audit_test.dart
          git -C .. diff --stat -- test/unit/financial_identity_audit_test.dart || true

      - name: Run identity audit tests
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### identity audit tests ($(date -u +%FT%TZ))"
            flutter test test/unit/financial_identity_audit_test.dart --reporter expanded 2>&1
            echo "IDENTITY_EXIT=$?"
          } >> .arena/identity-test-report.txt
          grep -nE "Failing tests|All tests passed|Some tests failed|Expected:|Actual:|Which:" .arena/identity-test-report.txt | tail -40 || true

      - name: Run guard tests (existing suites)
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### guard suites"
            flutter test \
              test/unit/id_resolver_cross_device_test.dart \
              test/unit/mirror_uuid_link_migration68_test.dart \
              test/unit/outbox_dao_comprehensive_test.dart \
              --reporter compact 2>&1
            echo "GUARD_EXIT=$?"
          } >> .arena/identity-test-report.txt
          grep -nE "Failing tests|All tests passed|Some tests failed|Expected:|Actual:|Which:" .arena/identity-test-report.txt | tail -40 || true

      - name: Push report and formatted file
        run: |
          git config user.name "arena-verify-bot"
          git config user.email "arena-verify-bot@users.noreply.github.com"
          git add test/unit/financial_identity_audit_test.dart .arena/identity-test-report.txt
          git diff --cached --quiet || git commit -m "chore(arena): dart format + identity test report [skip ci]"
          git push

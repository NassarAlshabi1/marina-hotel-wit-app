# ⚠️ مؤقت — مطابقة CI حرفياً (build_runner قبل فحص التنسيق). يُحذف بعد النجاح.
name: Arena Verify (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (CI step)
        run: dart run build_runner build

      - name: Dart format check (CI parity, after codegen)
        continue-on-error: true
        run: |
          mkdir -p .arena
          {
            echo "### dart format --set-exit-if-changed . (AFTER build_runner — مطابق CI)"
            dart format --output=none --set-exit-if-changed . 2>&1 \
              | sed -E 's/ in [0-9.]+ seconds\././' | tail -20
          } > .arena/verify.txt

      - name: Format (self-heal)
        run: |
          {
            echo ""
            echo "### dart format . (self-heal)"
            dart format . 2>&1 | sed -E 's/ in [0-9.]+ seconds\././' | tail -4
          } >> .arena/verify.txt

      - name: Analyze (CI parity)
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### flutter analyze"
            flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 \
              | sed -E 's/ \(ran in [0-9.]+s\)//' | tail -10
          } >> .arena/verify.txt

      - name: Push formatted sources + report
        if: always()
        run: |
          git config user.name "arena-verify-bot"
          git config user.email "arena-verify-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(arena): تنسيق بعد build_runner (مطابقة CI)"
          git push
          cat .arena/verify.txt

# ⚠️ مؤقت: تنسيق الملفات المعدَّلة عبر dart format + تقرير تحقق كـartifact
# (بيئة الوكيل بلا Flutter SDK) — يُحذف بعد نجاح التحقق.
# النمط نفسه المستخدم في جولات سابقة على هذا الفرع.
name: Arena Verify (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Report format status (before)
        continue-on-error: true
        run: |
          {
            echo "### dart format --set-exit-if-changed (before formatting)"
            dart format --output=none --set-exit-if-changed . 2>&1 \
              | sed -E 's/ in [0-9.]+ seconds\././' | tail -12
          } > "$RUNNER_TEMP/verify.txt"

      - name: Format
        run: dart format . 2>&1 | sed -E 's/ in [0-9.]+ seconds\././' | tail -3 >> "$RUNNER_TEMP/verify.txt"

      - name: Analyze (CI parity)
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### flutter analyze --no-fatal-infos --no-fatal-warnings"
            flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 \
              | sed -E 's/ \(ran in [0-9.]+s\)//' | tail -25
          } >> "$RUNNER_TEMP/verify.txt"

      - name: Targeted regression tests
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### targeted tests (m69 edit preservation + contract)"
            flutter test \
              test/unit/expense_kind_edit_preservation_test.dart \
              test/portable_relationships_contract_test.dart \
              test/migration_69_upgrade_test.dart \
              test/services/bug_repro_expense_edit_test.dart \
              --reporter compact 2>&1 \
              | sed -E 's/^[0-9]{2}:[0-9]{2} \+[0-9]+ //' \
              | grep -E "All tests passed|Some tests failed|Expected:|Actual:|Failed to load|Compilation failed|Error:" \
              | tail -25
          } >> "$RUNNER_TEMP/verify.txt"
          tr '\r' '\n' < "$RUNNER_TEMP/verify.txt" | tail -35

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-verify-report
          path: ${{ runner.temp }}/verify.txt
          if-no-files-found: error

      - name: Push formatted sources (if any)
        run: |
          git config user.name "arena-verify-bot"
          git config user.email "arena-verify-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(arena): تنسيق dart format (m69 edit preservation)"
          git push

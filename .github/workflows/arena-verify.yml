name: arena-verify
# ⚠️ مؤقت — يُنسّق الكود قانونياً (dart format) ويُشغّل التحليل والاختبارات،
# ثم يُلتزم بالنتيجة (تنزيل سجلات Actions محجوب في هذه البيئة).
on:
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
      - name: pub get
        run: flutter pub get
      - name: checks
        run: |
          set +e
          mkdir -p .arena
          dart format lib test > .arena/format-write.txt 2>&1
          echo "format_write_exit=$?" >> .arena/format-write.txt
          dart format --output=none --set-exit-if-changed lib test > .arena/format.txt 2>&1
          echo "format_exit=$?" >> .arena/format.txt
          flutter analyze --no-fatal-infos --no-fatal-warnings > .arena/analyze.txt 2>&1
          echo "analyze_exit=$?" >> .arena/analyze.txt
          flutter test --concurrency=2 --timeout=180s \
            --exclude-tags integration,performance,slow \
            --reporter compact > .arena/full-tests.txt 2>&1
          echo "full_exit=$?" >> .arena/full-tests.txt
          echo "──── format ────"; tail -3 .arena/format.txt
          echo "──── analyze ────"; tail -2 .arena/analyze.txt
          echo "──── tests ────"; grep -E "All other tests passed|Some tests failed|full_exit" .arena/full-tests.txt | tail -3
      - name: commit reports
        run: |
          set +e
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f .arena lib test
          git commit -m "chore(arena): dart format + analyze/tests report" || true
          git pull --rebase --autostash origin arena/a2609d75-marina-hotel-wit-app || true
          git push || true

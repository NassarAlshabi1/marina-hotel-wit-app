# ⚠️ مؤقّت (Arena) — يُحذف بعد التحقق. يكتب تقاريره في mobile/.arena/ ويرفعها.
name: Arena Verify (temporary)

on:
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format (whole repo — same command as CI)
        run: |
          mkdir -p .arena
          dart format --output=none --set-exit-if-changed . > .arena/format_check.txt 2>&1 || true
          tail -5 .arena/format_check.txt
          dart format . > /dev/null 2>&1 || true
          git diff > .arena/format.diff
          echo "changed files:" >> .arena/format_check.txt
          grep -c '^diff --git' .arena/format.diff >> .arena/format_check.txt || true

      - name: Generate code (same as CI)
        run: |
          dart run build_runner build > .arena/codegen.txt 2>&1 || true
          tail -5 .arena/codegen.txt

      - name: CI analyze (no path filter)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > .arena/analyze_ci.txt 2>&1 || true
          tail -25 .arena/analyze_ci.txt

      - name: Analyze
        run: |
          flutter analyze lib test --no-fatal-infos --no-fatal-warnings > .arena/analyze.txt 2>&1 || true
          tail -30 .arena/analyze.txt

      - name: Targeted tests
        run: |
          flutter test \
            test/unit/entitlement_identity_attribution_test.dart \
            test/unit/information_search_test.dart \
            test/unit/cloudflare_d1_upload_fields_test.dart \
            test/unit/cloudflare_d1_upload_fields_test.dart \
            test/unit/financial_links_g1_g2_test.dart \
            test/unit/identity_gate_p2_test.dart \
            test/unit/id_resolver_cross_device_test.dart \
            test/services/salary_entitlement_equality_test.dart \
            > .arena/test_targeted.txt 2>&1 || true
          tail -40 .arena/test_targeted.txt

      - name: Full unit+services suites
        run: |
          flutter test test/unit test/services > .arena/test_full.txt 2>&1 || true
          tail -20 .arena/test_full.txt

      - name: Commit reports
        if: always()
        run: |
          git config user.name "arena-verify-bot"
          git config user.email "arena-verify@users.noreply.github.com"
          git add -f .arena
          git commit -m "arena-verify: reports [skip ci]" || echo "no report changes"
          git push || echo "push skipped"

# ⚠️ مؤقت: تنسيق (dart format) + تشغيل الشجرة الكاملة + دفع الناتج والتقرير.
# السبب: بيئة الوكيل لا تحتوي Flutter SDK ولا تصل إلى سجلات Actions.
name: Arena Verify & Report (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tail -30

      - name: Report unformatted files
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed . 2>&1 | tail -10

      - name: Format all files
        run: dart format .

      - name: Run identity + money policy tests
        continue-on-error: true
        run: |
          mkdir -p .arena
          {
            echo "### identity + money policy tests ($(date -u +%FT%TZ))"
            flutter test \
              test/unit/financial_identity_audit_test.dart \
              test/unit/money_integer_policy_test.dart \
              test/unit/money_whole_amount_writes_test.dart \
              test/unit/smart_conflict_resolver_test.dart \
              test/unit/conflict_resolution_fix_test.dart \
              test/unit/sync_pull_service_pushed_to_remote_test.dart \
              test/unit/mirror_uuid_link_migration68_test.dart \
              --reporter compact 2>&1 \
              | grep -vE "drift\\\\):|GeneratedDatabase|_whenConstructed|_handleInstantiated|Invoker\.|Declarer\.|asynchronous suspension|This warning|Try to follow|package:drift|package:sqflite" \
              | tail -140
          } > .arena/identity-test-report.txt
          tr '\r' '\n' < .arena/identity-test-report.txt | grep -E "All tests passed|Some tests failed|\[E\]|Failing tests|Expected:|Actual:" | tail -40

      - name: Run full suite (same command as CI)
        continue-on-error: true
        run: |
          flutter test --concurrency=2 --timeout=180s \
            --exclude-tags integration,performance,slow --reporter compact 2>&1 \
            | grep -vE "drift\\\\):|GeneratedDatabase|_whenConstructed|_handleInstantiated|Invoker\.|Declarer\.|asynchronous suspension|This warning|Try to follow|package:drift|package:sqflite" \
            > .arena/full-tests-raw.txt || true
          {
            echo ""
            echo "### full suite ($(date -u +%FT%TZ))"
            tr '\r' '\n' < .arena/full-tests-raw.txt | tail -25
            echo ""
            echo "### failures only"
            tr '\r' '\n' < .arena/full-tests-raw.txt | grep -E "\[E\]|Failing tests|^  /home|Expected:|Actual:|Which:" | tail -100
          } > .arena/full-tests-report.txt
          tail -c 1500 .arena/full-tests-report.txt

      - name: Push formatted files + reports
        run: |
          git config user.name "arena-verify-bot"
          git config user.email "arena-verify-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(arena): dart format + verify report [skip ci]"
          git push

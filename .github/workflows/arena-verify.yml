# ⚠️ مؤقت — مطابقة CI حرفياً + تشغيل الاختبارات المستهدفة. يُحذف بعد النجاح.
name: Arena Verify (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (CI step)
        run: dart run build_runner build

      - name: Dart format check (CI parity, after codegen)
        continue-on-error: true
        run: |
          mkdir -p .arena
          {
            echo "### dart format --set-exit-if-changed . (AFTER build_runner — مطابق CI)"
            dart format --output=none --set-exit-if-changed . 2>&1 \
              | sed -E 's/ in [0-9.]+ seconds\././' | tail -20
          } > .arena/verify.txt

      - name: Format (self-heal)
        run: |
          {
            echo ""
            echo "### dart format . (self-heal)"
            dart format . 2>&1 | sed -E 's/ in [0-9.]+ seconds\././' | tail -4
          } >> .arena/verify.txt

      - name: Analyze (CI parity)
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### flutter analyze"
            flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 \
              | sed -E 's/ \(ran in [0-9.]+s\)//' | tail -12
          } >> .arena/verify.txt

      - name: Targeted tests (ledger + related)
        continue-on-error: true
        run: |
          set +e
          flutter test \
            test/unit/hotel_day_ledger_restore_identity_test.dart \
            test/restore_fix_service_test.dart \
            test/migration_69_upgrade_test.dart \
            test/unit/wave6_debts_fields_test.dart \
            test/unit/money_scan_coverage_test.dart \
            test/unit/cloudflare_d1_upload_fields_test.dart \
            test/unit/expense_kind_edit_preservation_test.dart \
            > /tmp/tests.log 2>&1
          rc=$?
          {
            echo ""
            echo "### flutter test (targeted, rc=$rc)"
            grep -E "All tests passed|Some tests failed|^[0-9]{2}:[0-9]{2} .*: (loading|running)|Failed to load|Error:|failed$" /tmp/tests.log | tail -25
            echo "---- tail ----"
            tail -12 /tmp/tests.log
          } >> .arena/verify.txt
          echo "$rc" > .arena/tests.rc

      - name: Push formatted sources + report
        if: always()
        run: |
          git config user.name "arena-verify-bot"
          git config user.email "arena-verify-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(arena): تنسيق + تقرير تحقق هوية دفتر الأيام"
          git push
          cat .arena/verify.txt

      - name: Gate (fail run if tests failed)
        if: always()
        run: |
          rc=$(cat .arena/tests.rc 2>/dev/null || echo 1)
          echo "tests rc=$rc"
          test "$rc" = "0"

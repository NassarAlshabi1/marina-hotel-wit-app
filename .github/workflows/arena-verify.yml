name: Arena Verify (temporary)

# ⚠️ سير عمل مؤقت للتحقق من إصلاحات G-7/G-8 ثم يُحذف:
#   1) يطبّق `dart format` على lib/test ويدفع التنسيق إن تغيّر (تلقائي).
#   2) يشغّل `dart analyze` كاملاً.
#   3) يشغّل اختبارَي G-7 وG-8 وحدهما بتقرير مفصّل (تشخيص سريع).
#   4) يشغّل المجموعة الكاملة ويكتب كل النتائج في mobile/.arena/.
on:
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app
    paths:
      - 'mobile/**'
      - '.github/workflows/arena-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Format check (report)
        working-directory: mobile
        run: |
          mkdir -p .arena
          dart format --output=none --set-exit-if-changed lib test \
            > .arena/format.txt 2>&1 || true
          tail -5 .arena/format.txt | tee -a .arena/summary.txt
          git -C .. diff --name-only > .arena/format-changed-files.txt

      - name: Format apply
        working-directory: mobile
        run: dart format lib test > .arena/format-apply.txt 2>&1 || true

      - name: Analyze
        working-directory: mobile
        run: |
          set +e
          dart analyze > .arena/analyze.txt 2>&1
          echo "analyze_exit=$?" >> .arena/summary.txt
          tail -20 .arena/analyze.txt >> .arena/summary.txt
          grep -cE "^\s+(error|warning)" .arena/analyze.txt \
            >> .arena/summary.txt || true

      - name: Targeted G-7/G-8 tests
        working-directory: mobile
        run: |
          set +e
          flutter test test/unit/provider_scope_g7_test.dart \
            test/unit/review_report_g8_test.dart \
            --concurrency=1 --reporter expanded \
            > .arena/g7-g8.txt 2>&1
          echo "g7_g8_exit=$?" >> .arena/summary.txt
          grep -oE "\[E\]|[0-9]+ (passed|failed)" .arena/g7-g8.txt \
            | sort | uniq -c | sort -rn >> .arena/summary.txt

      - name: Full test suite
        working-directory: mobile
        run: |
          set +e
          flutter test --concurrency=2 --timeout=180s \
            --exclude-tags integration,performance,slow \
            --reporter compact > .arena/full-tests.txt 2>&1
          full_exit=$?
          echo "full_exit=$full_exit" >> .arena/summary.txt
          tail -3 .arena/full-tests.txt >> .arena/summary.txt
          grep -oE "\[E\]" .arena/full-tests.txt | sort -u | wc -l \
            >> .arena/summary.txt
          grep -oE "^[0-9:]+ \+[0-9]+( -[0-9]+)?: .*\[E\]" \
            .arena/full-tests.txt | head -40 > .arena/failures.txt || true

      - name: Commit results (and any formatting fix)
        working-directory: mobile
        run: |
          cd ..
          git config user.name "arena-verify"
          git config user.email "arena-verify@users.noreply.github.com"
          git add -f mobile/.arena
          git add -A mobile/lib mobile/test
          if git diff --cached --quiet; then
            echo "nothing to commit" | tee -a mobile/.arena/summary.txt
          else
            git commit -m "chore(ci): تقرير تحقق مؤقت G-7/G-8 [skip ci]" \
              -m "$(git diff --cached --stat | tail -5)"
            git push origin HEAD:arena/a2609d75-marina-hotel-wit-app
          fi

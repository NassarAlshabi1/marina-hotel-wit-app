# ⚠️ مؤقت: تنسيق + تقرير تحقق (بيئة الوكيل بلا Flutter SDK) — يُحذف بعد النجاح.
name: Arena Verify (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format + status (CI parity)
        run: |
          mkdir -p .arena
          {
            echo "### format check BEFORE (CI parity)"
            dart format --output=none --set-exit-if-changed . 2>&1 \
              | sed -E 's/ in [0-9.]+ seconds\././' | tail -8 || true
            echo ""
            echo "### dart format ."
            dart format . 2>&1 | sed -E 's/ in [0-9.]+ seconds\././' | tail -3
          } > .arena/verify.txt

      - name: Analyze (CI parity)
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### flutter analyze"
            flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 \
              | sed -E 's/ \(ran in [0-9.]+s\)//' | tail -12
          } >> .arena/verify.txt

      - name: Targeted tests (D1 upload fields + m69 contract)
        continue-on-error: true
        run: |
          set +e
          flutter test \
            test/unit/cloudflare_d1_upload_fields_test.dart \
            test/unit/expense_kind_edit_preservation_test.dart \
            test/portable_relationships_contract_test.dart \
            test/migration_69_upgrade_test.dart \
            test/services/bug_repro_expense_edit_test.dart \
            --reporter compact > /tmp/targeted.txt 2>&1
          rc=$?
          {
            echo ""
            echo "### targeted tests (rc=$rc)"
            sed -E 's/^[0-9]{2}:[0-9]{2} \+[0-9]+ //' /tmp/targeted.txt \
              | grep -E "All tests passed|Some tests failed|Expected:|Actual:|Failed to load|Compilation failed|Error:|Failing tests" \
              | tail -30
          } >> .arena/verify.txt
          tail -15 .arena/verify.txt

      - name: Push formatted sources + report
        if: always()
        run: |
          git config user.name "arena-verify-bot"
          git config user.email "arena-verify-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(arena): dart format + تقرير تحقق حقول D1 (m69)"
          git push

      - name: Gate — fail job unless targeted tests passed
        if: always()
        run: |
          grep -q "All tests passed" .arena/verify.txt \
            && ! grep -q "rc=[1-9]" .arena/verify.txt

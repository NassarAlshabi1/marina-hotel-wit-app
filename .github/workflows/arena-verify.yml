name: arena-verify
# ⚠️ مؤقت — يُنشئه الوكيل لقراءة مخرجات الاختبارات (تنزيل سجلات Actions
# محجوب في هذه البيئة). يُحذف بعد التحقق.
on:
  push:
    branches:
      - arena/a2609d75-marina-hotel-wit-app
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
      - name: pub get
        run: flutter pub get
      - name: full test suite
        run: |
          set +e
          mkdir -p .arena
          flutter test --concurrency=2 --timeout=180s \
            --exclude-tags integration,performance,slow \
            --reporter compact > .arena/full-tests.txt 2>&1
          echo "full_exit=$?" >> .arena/full-tests.txt
          echo "──── ملخص ────"
          grep -E "Some tests failed|All tests passed|full_exit" .arena/full-tests.txt | tail -3
          echo "──── الاختبارات الفاشلة ────"
          grep -oE "test/[a-zA-Z0-9_/]+\.dart: [^\[]*\[E\]" .arena/full-tests.txt | sed 's/ *$//' | sort -u | head -30
      - name: commit reports
        run: |
          set +e
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f .arena
          git commit -m "chore(arena): full test report" || true
          git pull --rebase --autostash origin arena/a2609d75-marina-hotel-wit-app || true
          git push || true

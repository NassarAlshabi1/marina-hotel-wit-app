name: CI with DCM Fix
on:
  push:
    paths-ignore:
      - '.github/workflows/ci.yml'  # منع infinite loop
  pull_request:

permissions:
  contents: write  # ✅ مهم للـ git push
  pull-requests: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - uses: subosito/flutter-action@v2
      
      # ✅ التنظيف الكامل أولاً
      - name: 🧹 Clean & Install
        run: |
          flutter clean
          dart pub cache clean
          flutter pub get
      
      # ✅ تثبيت DCM بأمان
      - name: Install DCM
        run: dart pub global activate dcm
        continue-on-error: true
      
      # ✅ إصلاح تلقائي كامل
      - name: 🔧 DCM + Dart Auto Fix & Push
        run: |
          # Dart fix أولاً
          dart fix --apply || true
          
          # DCM fixes
          dcm fix --type=lints lib/ || true
          dcm fix --type=unused-code lib/ || true
          dcm format lib/ --line-length=100 || true
          
          # Commit التغييرات
          if git diff --staged | grep .; then
            git config user.name "DCM Auto Fix"
            git config user.email "actions@github.com"
            git add .
            git commit -m "chore: auto fix lints with DCM + Dart [skip ci]"
            git push
            echo "✅ Fixes pushed to PR!"
          else
            echo "ℹ️ No fixes needed"
          fi
        continue-on-error: true
      
      # ✅ بناء الكود
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      
      # ✅ تحليل متساهل
      - name: Flutter Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      
      # ✅ تنسيق
      - name: Format check
        run: dart format --set-exit-if-changed .
        continue-on-error: true
      
      # ✅ اختبارات
      - name: Test
        run: flutter test --coverage || true
      
      # ✅ رفع التغطية
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: mobile/coverage/

name: CI with DCM Fix
on:
  push:
    paths-ignore:
      - '.github/workflows/ci.yml'  # منع infinite loop
  pull_request:

permissions:
  contents: write  # ✅ مهم للـ git push
  pull-requests: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - uses: subosito/flutter-action@v2
      
      - name: Install DCM
        run: dart pub global activate dcm
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: 🔧 DCM Auto Fix & Push
        run: |
          dcm fix --type=lints lib/
          dcm format lib/ --line-length=100
          
          if git diff --staged | grep .; then
            git config user.name "DCM Auto Fix"
            git config user.email "actions@github.com"
            git add .
            git commit -m "chore: auto fix lints with DCM [skip ci]"
            git push
            echo "✅ Fixes pushed to PR!"
          else
            echo "ℹ️ No fixes needed"
          fi
        continue-on-error: true
      
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Flutter Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      
      - name: Test
        run: flutter test

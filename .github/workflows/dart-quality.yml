name: Dart Quality - Analyze, Fix & Format
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
        
    - run: dart pub get
    
    # Show all errors first (doesn't fail)
    - name: Analyze & Show Issues
      run: dart analyze .
      
    # Auto-fix what we can
    - name: Apply Quick Fixes
      run: dart fix --apply
      
    # Format code
    - name: Format Code
      run: dart format .
      
    # Final check (fails if still broken)
    - name: Final Analysis
      run: dart analyze . --fatal-infos
      
    # Auto-commit fixes
    - name: Commit Improvements
      if: always()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        if git diff --staged --quiet; then
          echo "✅ No changes needed"
        else
          git commit -m "fix: auto-apply dart fixes [skip ci]"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

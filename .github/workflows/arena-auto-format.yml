# ═══════════════════════════════════════════════════════════════════════
#  Arena — Auto Format (utility)
#  يُشغَّل يدوياً (workflow_dispatch) لتنسيق مجلد mobile بأداة المشروع
#  (dart format عبر Flutter 3.44.6 — نفس إصدار بوابة الجودة في ci.yml)
#  وإعادة الالتزام الناتج إلى نفس الفرع المُطلَق منه.
#
#  الغرض: بيئات التطوير المعزولة قد لا تملك SDK، وهذا يضمن تطابق
#  التنسيق مع بوابة `dart format --set-exit-if-changed .` في CI.
# ═══════════════════════════════════════════════════════════════════════
name: Arena Auto Format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format mobile/
        working-directory: mobile
        run: dart format .

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "arena-bot"
            git config user.email "arena-bot@users.noreply.github.com"
            git add -A
            git commit -m "style: dart format (بوابة التنسيق — تشغيل آلي)"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "formatted=true" >> "$GITHUB_OUTPUT"
          else
            echo "لا تغييرات — التنسيق متوافق بالفعل."
          fi

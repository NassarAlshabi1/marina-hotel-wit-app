# ═══════════════════════════════════════════════════════════════
#  AI Code Review — فحص الكود تلقائياً عند كل PR
#  يستخدم Z AI API (GLM-4-Plus) لتحليل التغييرات واقتراح إصلاحات
#
#  ⛔ مُعطَّل مؤقتاً (2026-10-01) — التلقائي أصبح يدوياً فقط:
#  تقرير الـ بوت على PR #591 احتوى 7 نتائج؛ الفحص اليدوي أثبت
#  أنها جميعاً إيجابيات كاذبة (ادعاءات فيض غير ممكنة في Dart،
#  "حقن SQL" في أسماء جداول من ثابت داخلي، خاصية غير موجودة في
#  PostHogConfig، واقتراح كتابة على دالة بدل خاصية في #2).
#  يُعاد التفعيل التلقائي بعد اعتماد Graphite Agent أو استبدال
#  النموذج/السكربت. للتشغيل الآن: Actions → AI Code Review.
# ═══════════════════════════════════════════════════════════════

name: AI Code Review

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'الفرع الأساس للمقارنة عند التشغيل اليدوي'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: 🤖 AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📚 Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for accurate diff

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 🤖 Run AI Code Review
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/ai-review/ai-code-review.mjs \
            --base origin/${{ github.base_ref || inputs.base_ref }} \
            --comment \
            --format markdown \
            --model glm-4-plus \
            --max-files 15

# .github/workflows/build-and-test.yml
#
# بناء + اختبار + APK على كل push لـ marina

name: Build and Test

on:
  push:
    branches: [marina]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build Debug APK (quick check)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: marina-hotel-debug-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

name: tmp-wss-probe
on:
  push:
    branches: [arena/01a0eff0-marina-hotel-wit-app]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q websockets
      - name: https-health-builtin
        run: python3 -c "import urllib.request; r=urllib.request.urlopen('https://marina-hotel-api.adenmarina2.workers.dev/health', timeout=15); print(r.status, r.read(100)); assert r.status==200"
      - name: wss-realtime-builtin
        run: >-
          python3 -c "
          import asyncio;
          from websockets.asyncio.client import connect;
          async def m():
              async with connect('wss://marina-hotel-api.adenmarina2.workers.dev/api/realtime?deviceId=wss-probe&entity=*') as ws:
                  print('101 UPGRADED builtin');
                  try:
                      async with asyncio.timeout(6): print('welcome:', (await ws.recv())[:200]);
                  except TimeoutError: print('no-welcome-in-6s');
          asyncio.run(m())"
      - name: https-health-relay
        run: python3 -c "import urllib.request; r=urllib.request.urlopen('https://marina-hotel-api-relay.pages.dev/health', timeout=15); print(r.status, r.read(100)); assert r.status==200"
      - name: wss-realtime-relay
        run: >-
          python3 -c "
          import asyncio;
          from websockets.asyncio.client import connect;
          async def m():
              async with connect('wss://marina-hotel-api-relay.pages.dev/api/realtime?deviceId=wss-probe&entity=*') as ws:
                  print('101 UPGRADED relay');
                  try:
                      async with asyncio.timeout(6): print('welcome:', (await ws.recv())[:200]);
                  except TimeoutError: print('no-welcome-in-6s');
          asyncio.run(m())"

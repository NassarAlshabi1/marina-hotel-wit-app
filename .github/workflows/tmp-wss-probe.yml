name: tmp-wss-probe
on:
  push:
    branches: [arena/01a0eff0-marina-hotel-wit-app]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q websockets
      - name: run-probe
        if: always()
        run: |
          python3 - <<'PYEOF'
          import asyncio
          import socket
          import traceback
          import urllib.request
          from websockets.asyncio.client import connect

          out = []

          def log(s):
              out.append(s)
              print(s, flush=True)

          async def wss_probe(name, host):
              uri = f'wss://{host}/api/realtime?deviceId=wss-probe&entity=*'
              try:
                  async with connect(uri, open_timeout=20) as ws:
                      log(f'{name} wss 101 UPGRADED')
                      try:
                          async with asyncio.timeout(6):
                              welcome = await ws.recv()
                          log(f'{name} wss welcome={welcome[:200]!r}')
                      except TimeoutError:
                          log(f'{name} wss no-welcome-in-6s (socket open)')
              except Exception:
                  log(f'{name} wss FAIL:')
                  traceback.print_exc()
                  out.append(traceback.format_exc())

          async def main():
              hosts = [
                  ('builtin', 'marina-hotel-api.adenmarina2.workers.dev'),
                  ('relay', 'marina-hotel-api-relay.pages.dev'),
              ]
              for name, host in hosts:
                  try:
                      addrs = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
                      log(f'{name} dns={addrs[0][4]!r}')
                  except Exception as e:
                      log(f'{name} dns FAIL {e!r}')
                  try:
                      req = urllib.request.Request(
                          f'https://{host}/health',
                          headers={'User-Agent': 'wss-probe'},
                      )
                      with urllib.request.urlopen(req, timeout=15) as r:
                          log(f'{name} https STATUS {r.status} {r.read(120)!r}')
                  except Exception:
                      log(f'{name} https FAIL:')
                      traceback.print_exc()
                      out.append(traceback.format_exc())
                  await wss_probe(name, host)

          try:
              asyncio.run(main())
          finally:
              with open('/tmp/wss-results.txt', 'w') as f:
                  f.write('\n'.join(out) + '\n')
          PYEOF
      - name: upload-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wss-results
          path: /tmp/wss-results.txt

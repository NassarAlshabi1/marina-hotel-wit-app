name: tmp-wss-probe
on:
  push:
    branches: [arena/01a0eff0-marina-hotel-wit-app]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q websockets
      - name: run-probe
        if: always()
        run: >-
          python3 -c "
          import asyncio, socket, traceback, urllib.request;
          from websockets.asyncio.client import connect;
          out = [];
          def log(s): out.append(s); print(s, flush=True);
          for name, host in [('builtin','marina-hotel-api.adenmarina2.workers.dev'),('relay','marina-hotel-api-relay.pages.dev')]:
              try: log(f'{name} dns=' + repr(socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)[:2]));
              except Exception as e: log(f'{name} dns FAIL {e!r}');
              try:
                  r = urllib.request.urlopen(f'https://{host}/health', timeout=15);
                  log(f'{name} https STATUS {r.status} {r.read(120)!r}');
              except Exception: log(f'{name} https FAIL'); traceback.print_exc();
              async def wss(h=host, n=name):
                  try:
                      async with connect(f'wss://{h}/api/realtime?deviceId=wss-probe&entity=*', open_timeout=20) as ws:
                          log(f'{n} wss 101 UPGRADED');
                          try:
                              async with asyncio.timeout(6): log(f'{n} wss welcome=' + repr((await ws.recv())[:200]));
                          except TimeoutError: log(f'{n} wss no-welcome-in-6s (socket open)');
                  except Exception: log(f'{n} wss FAIL'); traceback.print_exc();
              try: asyncio.run(wss())
              except Exception: pass;
          open('/tmp/wss-results.txt','w').write(chr(10).join(out) + chr(10));"
      - name: upload-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wss-results
          path: /tmp/wss-results.txt

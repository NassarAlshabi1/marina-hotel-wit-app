name: Sync Unit Tests (Android + Worker, session branch)

# تحقق حقيقي لدفعة «مطابقة سحب التغييرات مع Flutter» على فرع الجلسة.
# السبب: android-kotlin-build.yml مقيَّد بقائمة فروع ثابتة ولا يقبل
# workflow_dispatch، فتعذّر تشغيله من جلسة الوكيل. هذا الـworkflow يقتصر
# على تصريف وحدات JVM (`testDebugUnitTest`) وعقد الخادم (`vitest` في
# worker/) بلا توقيع APK ولا keystore، ويعمل على فرع الجلسة فقط — لا
# يغيّر سلوك أي workflow قائم.
on:
  push:
    branches:
      - arena/be8302d7-marina-hotel-wit-app
    paths:
      - 'mobile/android/**'
      - 'worker/**'
      - '.github/workflows/android-sync-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: sync-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: :app:testDebugUnitTest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # تاريخ كامل: خطوة Detekt تحسب ملفات الدفعة بـ git diff،
          # والاستنساخ الافتراضي (depth=1) لا يملك commit سابقاً.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Android SDK components
        run: |
          set -x
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;34.0.0" > /dev/null || true
          else
            echo "sdkmanager not found — relying on AGP auto-install"
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Collect batch files (for scoped static analysis)
        run: |
          # ملفات الدفعة = فرق الفرع عن قاعدة الدمج agent/android-cloudflare
          # (تاريخ كامل متاح: fetch-depth 0). هذا يجعل قياس Detekt ثابتاً على
          # كود هذه الدفعة كلها في كل تشغيل، لا على ما تغيّر في آخر push فقط.
          # الاستنساخ يجلب ref الفرع المُبنى فقط، فنجلب القاعدة صراحةً؛ وإن
          # تعذّر ذلك نعود لفرق آخر push (السلوك السابق، بلا فشل).
          git fetch --no-tags --quiet origin \
            "+refs/heads/agent/android-cloudflare:refs/remotes/origin/agent/android-cloudflare" 2>/dev/null || true
          if git rev-parse --verify --quiet "origin/agent/android-cloudflare" >/dev/null; then
            echo "batch base: origin/agent/android-cloudflare ($(git rev-parse --short origin/agent/android-cloudflare))"
            git diff --name-only origin/agent/android-cloudflare...HEAD > "$RUNNER_TEMP/changed.txt"
          else
            echo "batch base: event.before fallback (base ref unavailable)"
            { git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null || true; } > "$RUNNER_TEMP/changed.txt"
          fi
          echo "--- batch files ---"
          cat "$RUNNER_TEMP/changed.txt"

      - name: Run unit tests (sync pull parity batch)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --console=plain --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/android-sync-tests.log"

      - name: Diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          {
            echo '### Android sync unit-test failure output'
            echo '```text'
            grep -E 'e: file:|e: .*\.kt:|Compilation error|FAILED|What went wrong|Execution failed|Caused by:|error:' \
              "$RUNNER_TEMP/android-sync-tests.log" | tail -n 80 || true
            tail -n 80 "$RUNNER_TEMP/android-sync-tests.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # سبب إضافي: blob storage غير قابل للوصول من جلسة الوكيل، فنُخرج
          # التشخيص عبر check run يمكن قراءته مباشرةً من GitHub API.
          # نُضمّن رسائل فشل الاختبارات نفسها (XML النتائج) لا سجل Gradle فقط.
          python3 - <<'PY' > "$RUNNER_TEMP/diagnostics.json"
          import json, os, pathlib, re, xml.etree.ElementTree as ET

          candidates = [
              "mobile/build/app/test-results/testDebugUnitTest",
              "mobile/android/app/build/test-results/testDebugUnitTest",
              "../build/app/test-results/testDebugUnitTest",
              "app/build/test-results/testDebugUnitTest",
          ]
          root = next((pathlib.Path(c) for c in candidates if pathlib.Path(c).exists()), None)

          failures = []
          for xml in sorted(root.glob("*.xml")) if root is not None else []:
              try:
                  tree = ET.parse(xml)
              except Exception as exc:  # noqa: BLE001
                  failures.append(f"{xml.name}: unparsable ({exc})")
                  continue
              for case in tree.iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is None:
                          continue
                      text = (node.text or "").strip().splitlines()[:12]
                      failures.append(
                          f"### {case.get('classname')}.{case.get('name')}\n"
                          f"{node.get('message', '')}\n" + "\n".join(text)
                      )

          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "android-sync-tests.log"
          text = log.read_text(errors="replace") if log.exists() else "(no gradle log)"
          lines = text.splitlines()
          hits = [l for l in lines if re.search(r"e: file:|e: .*\.kt|error:|FAILED|What went wrong|Execution failed|Caused by:", l)]
          detail = ("\n\n".join(failures) if failures else "\n".join(hits[-120:] or lines[-120:]))
          print(json.dumps({
              "name": "android-sync-diagnostics",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "failure",
              "output": {
                  "title": f"Android sync tests: {len(failures)} failing case(s)",
                  "summary": f"{len(failures)} failing case(s); {len(hits)} diagnostic lines",
                  "text": detail[-60000:],
              },
          }))
          PY
          gh api -X POST "repos/${{ github.repository }}/check-runs" --input "$RUNNER_TEMP/diagnostics.json" >/dev/null

      # فحص ثابت إعلامي (غير حاجب): بوابة الجودة الكاملة في هذا المستودع
      # كانت حمراء قبل هذه الدفعة، فلا ندّعي جعلها خضراء — لكن نُظهر أي
      # ملاحظة Detekt تخصّ ملفات هذه الدفعة تحديداً حتى لا تمرّ صامتة.
      - name: Detekt (informational, changed files only)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :app:detekt --console=plain 2>&1 | tail -40 || true
          export CHANGED_FILES="$(cat "$RUNNER_TEMP/changed.txt" 2>/dev/null || true)"
          python3 - <<'PY' > "$RUNNER_TEMP/detekt.json"
          import json, os, pathlib, re, xml.etree.ElementTree as ET

          changed = os.environ.get("CHANGED_FILES", "")
          names = {n.strip() for n in changed.splitlines() if n.strip()}
          if not names:
              # لا نُغرق القائمة بدين المستودع القديم إذا فشل حساب التغييرات.
              names = {"__no_changes_detected__"}
          candidates = [
              "mobile/build/app/reports/detekt/detekt.xml",
              "mobile/android/app/build/reports/detekt/detekt.xml",
              "../build/app/reports/detekt/detekt.xml",
              "app/build/reports/detekt/detekt.xml",
          ]
          report = next((pathlib.Path(c) for c in candidates if pathlib.Path(c).exists()), None)
          findings = []
          total = 0
          if report is not None:
              # مسار الملف على عنصر <file name> الأب، والخاصية source هي اسم
              # القاعدة (detekt.Rule) — الخطأ السابق قرأها كمسار فطبع الكل.
              for file_node in ET.parse(report).getroot().iter("file"):
                  src = file_node.get("name") or ""
                  for err in file_node.iter("error"):
                      total += 1
                      # نُبلغ فقط عن ملفات هذه الدفعة (بقية المستودع دين قديم مُعلَن).
                      if names and not any(src.endswith(n) for n in names):
                          continue
                      findings.append(
                          f"{src}:{err.get('line')} [{err.get('source')}] {err.get('message')}"
                      )
          body = "\n".join(findings[:200]) if findings else (
              "لا ملاحظات Detekt على ملفات هذه الدفعة." if report is not None
              else "لم يُنتج Detekt تقريراً (المهمة فشلت قبل الكتابة أو المسار مختلف)."
          )
          print(json.dumps({
              "name": "android-sync-detekt",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "success",
              "output": {
                  "title": f"Detekt على ملفات الدفعة: {len(findings)} ملاحظة (المستودع: {total})",
                  "summary": "إعلامي غير حاجب — لا يُغيّر نتيجة الفحص",
                  "text": body[-60000:],
              },
          }))
          PY
          gh api -X POST "repos/${{ github.repository }}/check-runs" --input "$RUNNER_TEMP/detekt.json" >/dev/null || true

      - name: Upload test results (evidence)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: marina-sync-test-results
          path: |
            mobile/build/app/test-results
            mobile/build/app/reports/tests
            mobile/android/app/build/test-results
            mobile/android/app/build/reports/tests
          if-no-files-found: warn
          retention-days: 30

  worker-tests:
    name: "worker: vitest + typecheck (sweep contract)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc, both configs)
        run: npm run typecheck

      - name: Vitest (full worker suite incl. tombstones_only sweep contract)
        run: npx vitest run

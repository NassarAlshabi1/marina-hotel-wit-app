name: Zencoder Auto Generate Tests

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.dart'
      - '**.php'
      - '**.js'
      - '**.ts'
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Path to generate tests for (e.g., mobile/, admin/)'
        required: false
        default: '.'

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Unit Tests
        uses: zencoderai/zen-agents-action@main
        with:
          base_path: "${{ github.event.inputs.target_path || '.' }}"
          prompt: |
            Generate comprehensive unit tests for modified files in this pull request.
            
            Requirements:
            1. Follow project's testing conventions and best practices
            2. Cover edge cases and error scenarios
            3. Use proper mocking for external dependencies
            4. Include descriptive test names
            5. For Dart/Flutter: Use flutter_test package
            6. For PHP: Use PHPUnit framework
            7. For JavaScript/TypeScript: Use Jest or similar
            8. Aim for at least 80% code coverage
            
            Create or update test files in the appropriate test directory.
          model: "sonnet-4"
          zencoder_client_id: "${{ secrets.ZENCODER_CLIENT_ID }}"
          zencoder_client_secret: "${{ secrets.ZENCODER_CLIENT_SECRET }}"
          github_token: "${{ secrets.CICD_TOKEN }}"

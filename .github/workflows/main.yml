# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Marina Hotel — Build Flutter Release APK
#  يعمل على أي إصدار اندرويد من 5.0 (API 21) وما فوق
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
name: Build Flutter Release APK

on:
  push:
    branches:
      - marina
      - yy
      - refactor/clean-v2
      - refactor/performance-fixes-v1
      - refactor/performance-fixes-v2
    paths:
      - 'mobile/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Release APKs (per-ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: mobile

    steps:
      # ─── جلب الكود ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ─── إعداد Java 17 ───────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ─── إعداد Flutter ───────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      # ─── تثبيت مكونات Android SDK ────────────────────────
      - name: Install Android SDK components
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      # ─── التحقق من ملفات التوقيع ─────────────────────────
      - name: Verify Android Signing Files
        run: |
          echo "Verifying local signing files..."
          ls -la android/app/release.keystore
          ls -la android/key.properties
          echo "Local signing files verified successfully."

      # ─── تنظيف ──────────────────────────────────────────
      - name: Clean build artifacts
        run: flutter clean

      # ─── تثبيت التبعيات ─────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ─── تحديد رقم الإصدار ──────────────────────────────
      - name: Determine build version
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          BUILD_NAME="${BASE_VERSION}+${BUILD_NUMBER}"
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Building: $BUILD_NAME"

      # ─── توليد الكود ────────────────────────────────────
      - name: Generate code (build_runner)
        run: |
          flutter pub run build_runner clean
          flutter pub run build_runner build --delete-conflicting-outputs

      # ─── بناء APK لكل معالج (ABI split) ────────────────
      # minSdkVersion = 21 (Android 5.0 Lollipop)
      # targetSdk = 36 (Android 16)
      # ── أكبر تقليل للحجم بأقل مخاطرة (PERFORMANCE.md §7.2) ──
      # --split-per-abi: APK منفصل لكل معمارية — كل ملف يحمل
      # مكتباته native فقط فلا يدفع المستخدم حجم المعماريتين
      # معاً (الشامل كان يحتوي arm64+arm فيضعف حجم المكتبات)
      # R8 (minifyEnabled/shrinkResources في build.gradle) يقلّص كود
      # Java/Kotlin ويولّد mapping.txt لتفسير تتبعات الأعطال.
      # --obfuscate يخفي رموز Dart (أسماء الفئات/الدوال) مما يقلّص
      # حجم APK إضافياً، و--split-debug-info يحفظ رموز Dart في ملف
      # .symbols لتفسير الأعطال لاحقاً عبر: flutter symbolize
      # ✅ BASE_API_URL عبر HTTPS إلزامياً: network_security_config
      # يرفض كل cleartext غير localhost — أي http:// يجعل كل نداءات
      # API تفشل بـ CleartextNotPermitted على أجهزة المستخدمين.
      - name: Build release APKs (per-ABI)
        run: >
          flutter build apk --release
          --split-per-abi
          --target-platform android-arm64,android-arm
          --build-name ${{ steps.version.outputs.build_name }}
          --build-number ${{ steps.version.outputs.build_number }}
          --obfuscate
          --split-debug-info=build/symbols
          --dart-define=BASE_API_URL=https://hotelmarina.com/MARINA_HOTEL_PORTABLE/api/v1
          --dart-define=AGENT_ROUTER_API_KEY=${{ secrets.AGENTROUTER_API_KEY }}
          --dart-define=AGENT_ROUTER_BASE_URL=https://openrouter.ai/api/v1
        env:
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
          JAVA_TOOL_OPTIONS: "-Xmx6g -XX:MaxMetaspaceSize=1g"

      # ─── عرض معلومات الـ APKs المبنية ────────────────────
      - name: Inspect APK info
        id: apkinfo
        run: |
          inspect() {
            APK="$1"; OUT="$2"
            BYTES=$(stat -c%s "build/app/outputs/flutter-apk/$APK")
            MB=$(awk "BEGIN {printf \"%.2f\", $BYTES/1048576}")
            echo "$APK: ${MB} MB ($BYTES bytes)"
            echo "$OUT=${MB}" >> $GITHUB_OUTPUT
          }
          inspect app-arm64-v8a-release.apk apk_arm64_mb
          inspect app-armeabi-v7a-release.apk apk_arm_mb
          echo "--- native libs per APK ---"
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            LIBS=$(unzip -l "$APK" | grep "lib/" | awk '{print $4}' | sed 's|lib/||' | cut -d'/' -f1 | sort -u | tr '\n' ' ')
            echo "$(basename "$APK"): $LIBS"
          done

      # ─── التحقق من ملفات الـ mapping (R8 + Dart) ─────────
      - name: Verify R8 mapping & Dart symbols
        run: |
          echo "=== R8 mapping (Java/Kotlin deobfuscation) ==="
          MAPPING="build/app/outputs/mapping/release/mapping.txt"
          if [ -f "$MAPPING" ]; then
            echo "✓ mapping.txt found: $(du -h $MAPPING | cut -f1) ($(wc -l < $MAPPING) entries)"
          else
            echo "::warning::R8 mapping file not found at $MAPPING"
          fi
          echo "=== Dart symbols (flutter symbolize) ==="
          if [ -d "build/symbols" ] && ls build/symbols/*.symbols >/dev/null 2>&1; then
            ls -la build/symbols/
          else
            echo "::warning::Dart symbols not found in build/symbols/"
          fi

      # ─── رفع الـ APKs كـ artifact ────────────────────────
      - name: Upload release APKs artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'marina-hotel-release-${{ steps.version.outputs.build_name }}'
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 90

      # ─── رفع R8 mapping + رموز Dart كـ artifact ─────────
      # ملفات تفسير الأعطال — تُرفع كـ artifact (وليس في Release
      # العام) لأن كشفها للعلن يُلغي فائدة الإخفاء (obfuscation)
      # R8 mapping:      retrace mapping.txt < stack-trace
      # Dart symbols:    flutter symbolize -d <arch>.symbols -i <trace>
      - name: Upload R8 mapping & Dart symbols artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'marina-hotel-mapping-${{ steps.version.outputs.build_name }}'
          path: |
            mobile/build/app/outputs/mapping/release/mapping.txt
            mobile/build/symbols/*.symbols
          if-no-files-found: warn
          retention-days: 90

      # ─── إنشاء GitHub Release ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 'v${{ steps.version.outputs.build_name }}'
          name: 'Marina Hotel v${{ steps.version.outputs.build_name }}'
          body: |
            ## Marina Hotel v${{ steps.version.outputs.build_name }}

            **ملفا APK منفصلان لكل معمارية (ABI split) — تنزيل أصغر لكل جهاز**

            - الحد الأدنى: Android 5.0 (API 21)
            - المستهدف: Android 16 (API 36)
            - رقم البناء: ${{ steps.version.outputs.build_number }}
            - R8 minify + shrinkResources + Dart obfuscation + jniLibs غير مضغوطة مفعّلة

            ### أي ملف تحمّل؟

            | الملف | المعمارية | الحجم | للأجهزة |
            |---|---|---|---|
            | `app-arm64-v8a-release.apk` | arm64-v8a | ${{ steps.apkinfo.outputs.apk_arm64_mb }} MB | الهواتف الحديثة (64-bit) — **الافتراضي إن لم تكن متأكداً** |
            | `app-armeabi-v7a-release.apk` | armeabi-v7a | ${{ steps.apkinfo.outputs.apk_arm_mb }} MB | الأجهزة القديمة (32-bit) |

            ### ملفات تفسير الأعطال (Deobfuscation)

            ملف `mapping.txt` (R8) ورموز Dart (`*.symbols`) تُرفع كـ artifact
            من نفس تشغيل الـ workflow باسم
            `marina-hotel-mapping-v${{ steps.version.outputs.build_name }}`
            (Artifacts → تشغيل البناء هذا) — وليس في الـ Release العام لحمايتها.

            ### طريقة التثبيت
            1. حمّل ملف APK المناسب لجهازك (arm64-v8a للحديثة)
            2. فعّل "مصادر غير معروفة" من إعدادات الأمان
            3. ثبّت التطبيق
          files: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
